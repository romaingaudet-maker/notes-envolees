/* Layout : couverture safran pour l'accueil, chemin de portée qui relie les comptines.
   Chaque comptine tient sur un seul écran comme une double page d'album en papier découpé :
   décor animé à gauche (en haut sur téléphone), pupitre à droite avec la phrase en cours
   mise en avant, et en bas l'endroit où l'on joue (xylophone ou micro). Le décor reste
   toujours visible pendant le jeu. Chaque comptine a sa propre palette (pas de variante
   sombre/claire : un seul univers visuel par page, par choix). */
:root {
  --cover: #F6C744;
  --ink: #1D2350;
  --ink-soft: #464C7C;
  --paper: #FFFBF0;
  --red: #E5484D;
  --font-display: 'Gluten', 'Trebuchet MS', 'Comic Sans MS', cursive;
  --font-text: 'Andika', 'Verdana', 'Segoe UI', sans-serif;
  /* code couleur des notes, le même partout */
  --n-do: #E5484D;
  --n-re: #F2803C;
  --n-mi: #F5C32C;
  --n-fa: #4CAF5A;
  --n-sol: #1FA7A0;
  --n-la: #3E6FD8;
  --n-si: #8B57C9;
  --n-ink-light: #FFFFFF;
  --n-ink-dark: #2A1E06;
  /* tokens de page (accueil) ; chaque monde les redéfinit */
  --bg: var(--cover);
  --panel: #FFFBF0;
  --panel-2: #FFF1D6;
  --text: #1D2350;
  --text-soft: #5A5F86;
  --accent: #D93D43;
  --accent-ink: #FFFFFF;
  --line: rgba(29, 35, 80, 0.16);
  --line-strong: rgba(29, 35, 80, 0.38);
  --frame: #6B3E2E;
  --stage-bg: #F6C744;
  --iris: #F6C744;
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
.nw { white-space: nowrap; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-text);
  font-size: 17px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

/* papier : grain léger posé sur les décors */
.grain::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 2;
  opacity: .2;
  mix-blend-mode: multiply;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .42  0 0 0 0 .36  0 0 0 0 .3  0 0 0 .5 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
.iris { position: fixed; inset: 0; z-index: 60; background: var(--iris); pointer-events: none; }

/* couleurs des notes */
[data-l="C"] { --nc: var(--n-do); --nt: var(--n-ink-light); }
[data-l="D"] { --nc: var(--n-re); --nt: var(--n-ink-dark); }
[data-l="E"] { --nc: var(--n-mi); --nt: var(--n-ink-dark); }
[data-l="F"] { --nc: var(--n-fa); --nt: var(--n-ink-light); }
[data-l="G"] { --nc: var(--n-sol); --nt: var(--n-ink-light); }
[data-l="A"] { --nc: var(--n-la); --nt: var(--n-ink-light); }
[data-l="B"] { --nc: var(--n-si); --nt: var(--n-ink-light); }

/* ================================ ACCUEIL ================================ */
.home { background: var(--cover); color: var(--ink); position: relative; overflow: hidden; min-height: 100%; }
.home.grain::after { opacity: .16; }
.home-in {
  max-width: 1240px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 56px;
  position: relative;
  z-index: 3;
}
.home-head { display: grid; grid-template-columns: minmax(0, 1fr) minmax(240px, 26em); gap: 14px 48px; align-items: end; }
.eyebrow { grid-column: 1 / -1; margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); }
.home-title { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: clamp(52px, 8.4vw, 128px); line-height: .86; letter-spacing: -.01em; color: var(--ink); }
.home-title .w { display: block; width: fit-content; position: relative; white-space: nowrap; }
.home-title .lift { display: inline-block; transform: translate(var(--tx, 0), var(--ty, 0)) rotate(var(--rot, 0deg)); animation: drift 4.5s ease-in-out infinite alternate; animation-delay: var(--dl, 0s); }
.home-title .lift.c1 { --ty: -.06em; --rot: -4deg; --dl: -.4s; }
.home-title .lift.c2 { --ty: -.16em; --rot: 6deg; --dl: -1.2s; color: var(--red); }
.home-title .lift.c3 { --ty: -.3em; --rot: 14deg; --dl: -2s; }
.home-title .flyaway { position: absolute; left: 100%; top: -.05em; margin-left: .06em; display: flex; gap: .06em; }
.home-title .flyaway i { width: .2em; height: .2em; border-radius: 50%; display: inline-block; background: var(--c); animation: drift 3.6s ease-in-out infinite alternate; animation-delay: var(--dl); }
@keyframes drift { from { translate: 0 0; } to { translate: .04em -.12em; } }
.home-lede { margin: 0 0 10px; font-size: clamp(17px, 1.6vw, 20px); max-width: 36em; color: var(--ink); }
.home-lede strong { font-weight: 700; }

.score { position: relative; margin-top: 46px; }
.staff { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: visible; }
.staff .ink { fill: var(--ink); opacity: .82; }
.medals { list-style: none; margin: 0; padding: 30px 0 10px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 44px 18px; position: relative; z-index: 1; }
.medal { display: flex; justify-content: center; }
.medal-link { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: var(--ink); transform: translateY(var(--off, 0px)); border-radius: 24px; outline-offset: 6px; }
.medal-disc { position: relative; width: clamp(104px, 11vw, 140px); aspect-ratio: 1; max-width: 100%; border-radius: 50%; background: var(--c); display: grid; place-items: center; box-shadow: 0 7px 0 rgba(29, 35, 80, .2), 0 16px 28px rgba(29, 35, 80, .2); transition: transform .3s cubic-bezier(.3, 1.5, .5, 1); }
.medal-disc > svg:not(.medal-ring) { width: 64%; height: 64%; }
.medal-ring { position: absolute; inset: -9px; width: calc(100% + 18px); height: calc(100% + 18px); }
.medal-ring .trk { fill: none; stroke: rgba(255, 251, 240, .7); stroke-width: 5; }
.medal.is-won .medal-ring .trk { stroke: var(--ink); }
.medal-num { position: absolute; top: -6px; left: -6px; width: 36px; height: 36px; border-radius: 50%; background: var(--paper); color: var(--ink); font: 800 18px/38px var(--font-display); text-align: center; box-shadow: 0 3px 0 rgba(29, 35, 80, .18); }
.medal-badge { position: absolute; bottom: -6px; right: -10px; display: flex; gap: 1px; padding: 4px 7px; border-radius: 999px; background: var(--paper); box-shadow: 0 3px 0 rgba(29, 35, 80, .18); }
.medal-badge svg { width: 15px; height: 15px; }
.medal-title { margin-top: 16px; padding: 0 10px; border-radius: 10px; background: var(--cover); font-family: var(--font-display); font-weight: 700; font-size: clamp(18px, 1.8vw, 23px); line-height: 1.12; text-align: center; text-wrap: balance; max-width: 12em; }
.medal-meta { margin-top: 4px; padding: 0 8px; border-radius: 8px; background: var(--cover); font-size: 14px; color: var(--ink-soft); text-align: center; }
.medal-link:hover .medal-disc, .medal-link:focus-visible .medal-disc { transform: translateY(-6px) rotate(-3deg) scale(1.04); }
.medal-link:active .medal-disc { transform: translateY(2px) scale(.98); }

.howto { margin-top: 58px; display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 22px 40px; align-items: start; }
.howto h2 { grid-column: 1 / -1; margin: 0; font-family: var(--font-display); font-size: clamp(26px, 3vw, 34px); font-weight: 800; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; counter-reset: s; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 12px; align-items: start; }
.steps li::before { content: counter(s); width: 40px; height: 40px; border-radius: 50%; background: var(--ink); color: var(--cover); display: grid; place-items: center; font: 800 20px/1 var(--font-display); }
.steps p { margin: 7px 0 0; max-width: 38em; }
.side-cards { display: grid; gap: 16px; }
.legend { background: var(--paper); border-radius: 22px; padding: 18px 20px 20px; box-shadow: 0 6px 0 rgba(29, 35, 80, .12); border: 0; margin: 0; min-width: 0; }
.legend h3, .legend legend { margin: 0 0 4px; padding: 0; font-size: 15px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
.legend legend { float: left; width: 100%; }
.legend p { margin: 0 0 12px; font-size: 15px; color: var(--ink-soft); clear: both; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-width: 46px; height: 40px; padding: 0 10px; border-radius: 12px; display: grid; place-items: center; font-weight: 700; background: var(--nc); color: var(--nt); box-shadow: 0 3px 0 color-mix(in srgb, var(--nc) 65%, #000); }
.inst-opts { display: grid; gap: 8px; }
.inst-opt { display: block; cursor: pointer; }
.inst-opt input { position: absolute; opacity: 0; pointer-events: none; }
.inst-card { display: grid; gap: 2px; padding: 10px 14px 10px 44px; border-radius: 14px; border: 2px solid rgba(29, 35, 80, .16); position: relative; }
.inst-card::before { content: ""; position: absolute; left: 14px; top: 13px; width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--ink-soft); }
.inst-card b { font-size: 16px; color: var(--ink); }
.inst-card small { font-size: 14px; color: var(--ink-soft); line-height: 1.3; }
.inst-opt input:checked + .inst-card { border-color: var(--ink); background: #FFF3C9; }
.inst-opt input:checked + .inst-card::before { border-color: var(--ink); background: radial-gradient(var(--ink) 45%, transparent 50%); }
.inst-opt input:focus-visible + .inst-card { outline: 3px solid var(--red); outline-offset: 2px; }
.inst-online { margin: 12px 0 0; padding: 10px 14px; border-radius: 14px; background: #FFF3C9; color: var(--ink); font-size: 15px; }
.inst-online a { color: var(--ink); font-weight: 700; }
.home-foot { margin-top: 36px; font-size: 14px; color: var(--ink-soft); max-width: 62em; }
.home-foot .legal-link { display: block; width: fit-content; margin-top: 10px; color: var(--ink); font-weight: 700; text-underline-offset: 3px; }

/* ================================ COMPTINE ================================ */
:root[data-view="song"], :root[data-view="song"] body, :root[data-view="song"] #app { height: 100%; }
:root[data-view="song"] body { overflow: hidden; }
.song {
  height: 100%;
  display: grid;
  grid-template-columns: minmax(0, 1.08fr) minmax(400px, 1fr);
  grid-template-rows: minmax(0, 1fr) auto;
  grid-template-areas: "stage play" "stage dock";
  background: var(--panel);
  color: var(--text);
}
.stage { grid-area: stage; position: relative; overflow: hidden; background: var(--stage-bg); isolation: isolate; min-height: 0; }
.stage .sc { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.back, .next-song {
  position: absolute; z-index: 4;
  top: calc(14px + env(safe-area-inset-top, 0px));
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 42px; border-radius: 999px;
  background: var(--paper); color: var(--ink);
  text-decoration: none; font-weight: 700; font-size: 15px;
  box-shadow: 0 4px 0 rgba(0, 0, 0, .16);
}
.back { left: max(14px, env(safe-area-inset-left, 0px)); padding: 0 16px 0 10px; }
.next-song { right: 14px; width: 42px; }
.back svg, .next-song svg { width: 22px; height: 22px; }
.back:hover, .next-song:hover { transform: translateY(-1px); }
.stage-title { display: none; position: absolute; z-index: 4; left: max(12px, env(safe-area-inset-left, 0px)); bottom: 10px; max-width: calc(100% - 24px); padding: 6px 12px 7px; border-radius: 14px; background: var(--paper); color: var(--ink); box-shadow: 0 4px 0 rgba(0, 0, 0, .14); }
.stage-title span { display: block; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); }
.stage-title b { display: block; font-family: var(--font-display); font-weight: 800; font-size: 21px; line-height: 1.05; }

.play {
  grid-area: play;
  min-height: 0;
  overflow-y: auto;
  display: flex; flex-direction: column; gap: 14px;
  padding-left: 22px;
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  padding-block: 24px 12px;
}
.play-head .kicker { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text-soft); }
.play-head h1 { margin: 4px 0 0; font-family: var(--font-display); font-weight: 800; font-size: clamp(32px, 3.6vw, 52px); line-height: .98; text-wrap: balance; }
.play-head .instr { margin: 6px 0 0; color: var(--text-soft); font-size: 15px; }

.listen { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn-big {
  display: inline-flex; align-items: center; gap: 10px;
  height: 52px; padding: 0 20px 0 7px;
  border: 0; border-radius: 999px;
  background: var(--accent); color: var(--accent-ink);
  font-weight: 700; font-size: 17px; cursor: pointer; text-decoration: none;
  box-shadow: 0 4px 0 color-mix(in srgb, var(--accent) 62%, #000);
  transition: transform .08s;
}
.btn-big .ic { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--accent-ink) 22%, transparent); }
.btn-big svg, .btn svg { width: 20px; height: 20px; }
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  height: 46px; padding: 0 16px;
  border-radius: 999px; border: 2px solid var(--line-strong);
  background: var(--panel); color: var(--text);
  font-weight: 700; font-size: 15px; cursor: pointer; text-decoration: none;
  transition: transform .08s, background-color .2s;
}
.btn .q { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; border: 2px dashed currentColor; font-size: 14px; }
.btn[aria-pressed="true"] { background: var(--text); color: var(--panel); border-color: var(--text); }
.btn-big:active, .btn:active { transform: translateY(2px); }
.btn:disabled { opacity: .45; cursor: default; }
.is-playing .listen .btn-big { box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 30%, transparent), 0 4px 0 color-mix(in srgb, var(--accent) 62%, #000); }

/* la phrase en cours */
.card { background: var(--panel-2); border-radius: 24px; padding: 14px 16px 18px; display: flex; flex-direction: column; gap: 12px; }
.card-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.strip { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.pill { position: relative; overflow: hidden; width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--line-strong); background: var(--panel); color: var(--text); font-weight: 700; font-size: 14px; cursor: pointer; padding: 0; }
.pill::before { content: ""; position: absolute; inset: 0; background: var(--accent); opacity: .3; transform: translateY(calc((1 - var(--f, 0)) * 100%)); transition: transform .5s cubic-bezier(.3, 1.3, .5, 1); }
.pill.is-done { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.pill.is-done::before { opacity: 0; }
.pill.is-view { box-shadow: 0 0 0 3px var(--panel-2), 0 0 0 5px var(--text); }
.count { margin: 0; font-size: 14px; color: var(--text-soft); font-variant-numeric: tabular-nums; white-space: nowrap; }
.count b { color: var(--text); }
.panel { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 10px 12px; align-items: center; }
.ph-play { width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--line-strong); background: var(--panel); color: var(--text); display: grid; place-items: center; cursor: pointer; padding: 0; }
.ph-play svg { width: 18px; height: 18px; }
.ph-body { display: contents; }
.ph-lyric { margin: 0; font-size: 19px; line-height: 1.35; color: var(--text-soft); min-width: 0; }
.syl { border-radius: 5px; transition: background-color .12s, color .12s; }
.syl.is-on { color: var(--text); background: color-mix(in srgb, var(--accent) 24%, transparent); }
.syl.is-cur { color: var(--text); text-decoration: underline wavy var(--accent) 2px; text-underline-offset: 5px; }
.beads { grid-column: 1 / -1; --stp: 8px; --bs: 32px; display: grid; grid-template-columns: var(--cols); gap: 4px; max-width: 760px; }
.bc { position: relative; min-width: 0; height: calc(var(--span) * var(--stp) + var(--bs)); }
.bead {
  position: absolute; left: 0; right: 0;
  top: calc(var(--y) * var(--stp));
  height: var(--bs);
  border-radius: 999px;
  border: 2px dashed var(--line-strong);
  background: transparent;
  color: var(--text-soft);
  font-size: 13px; font-weight: 700; line-height: 1;
  padding: 0; cursor: pointer;
  display: grid; place-items: center;
  transition: top .45s cubic-bezier(.3, 1.5, .5, 1), background-color .25s, transform .12s, box-shadow .2s;
}
.bead > span { position: relative; }
.bead.is-found { border: 0; background: var(--nc); color: var(--nt); box-shadow: 0 2px 0 color-mix(in srgb, var(--nc) 60%, #000); }
.bead.is-given { border: 3px solid var(--nc); background: var(--panel); color: var(--text); }
.bead.low > span::after { content: ""; position: absolute; left: 50%; bottom: -6px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: currentColor; }
.bead.high > span::before { content: ""; position: absolute; left: 50%; top: -6px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: currentColor; }
.bead.is-cursor { animation: cursor-pulse 1.4s ease-in-out infinite; }
.bead.is-cursor:not(.is-given) { border: 3px solid var(--accent); color: var(--accent); background: var(--panel); }
.bead.is-on { transform: scale(1.16); }
.bead.is-on:not(.is-found) { background: var(--accent); color: var(--accent-ink); border-style: solid; border-color: var(--accent); }
.bead.pop { animation: bead-pop .5s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes cursor-pulse { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 50%, transparent); } 50% { box-shadow: 0 0 0 8px color-mix(in srgb, var(--accent) 0%, transparent); } }
@keyframes bead-pop { 0% { transform: scale(.4); } 60% { transform: scale(1.25); } 100% { transform: scale(1); } }

.done-card { display: grid; gap: 12px; padding: 18px 20px 20px; border-radius: 24px; background: var(--panel-2); }
.done-card h2 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: clamp(26px, 3vw, 34px); line-height: 1.05; }
.done-card p { margin: 0; color: var(--text-soft); }
.done-stars { display: flex; gap: 6px; color: var(--text-soft); }
.done-actions { display: flex; flex-wrap: wrap; gap: 10px; }

.play-foot { margin-top: auto; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 14px; }
.play-foot a, .play-foot button { display: inline-flex; align-items: center; gap: 6px; color: var(--text-soft); text-decoration: none; background: none; border: 0; padding: 6px 0; cursor: pointer; font-weight: 700; font-size: 14px; }
.play-foot svg { width: 16px; height: 16px; }
.play-foot a:hover, .play-foot button:hover { color: var(--text); }

/* là où l'on joue */
.dock {
  grid-area: dock;
  background: var(--panel-2);
  border-top: 2px solid var(--line);
  display: flex; flex-direction: column; align-items: stretch; gap: 6px;
  padding-left: max(18px, env(safe-area-inset-left, 0px));
  padding-right: max(18px, env(safe-area-inset-right, 0px));
  padding-block: 8px calc(12px + env(safe-area-inset-bottom, 0px));
}
.hint { min-height: 40px; margin: 0; display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 6px 10px; text-align: center; font-family: var(--font-display); font-weight: 700; font-size: 21px; line-height: 1.1; color: var(--text); }
.hint small { font-family: var(--font-text); font-weight: 400; font-size: 14px; color: var(--text-soft); }
.hint svg { width: 30px; height: 30px; }
.hint.ok { color: var(--accent); }
.hint.pop { animation: hint-pop .35s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes hint-pop { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.nchip { display: inline-grid; place-items: center; min-width: 50px; height: 36px; padding: 0 10px; border-radius: 10px; background: var(--nc, var(--panel)); color: var(--nt, var(--text)); border: 2px solid var(--nc, var(--line-strong)); font-family: var(--font-text); font-weight: 700; font-size: 18px; box-shadow: 0 3px 0 color-mix(in srgb, var(--nc, #888) 60%, #000); }

.xylo { --kh: 120px; position: relative; display: flex; align-items: center; justify-content: center; gap: 6px; height: calc(var(--kh) + 8px); width: 100%; max-width: 640px; margin: 0 auto; }
.xylo::before, .xylo::after { content: ""; position: absolute; left: 0; right: 0; height: 12px; border-radius: 6px; background: var(--frame); box-shadow: 0 3px 0 color-mix(in srgb, var(--frame) 60%, #000); z-index: 0; }
.xylo::before { top: 34%; }
.xylo::after { top: 64%; }
[data-mode="mic"] .xylo { display: none; }
.key {
  position: relative; z-index: 1;
  flex: 1 1 0; min-width: 0; max-width: 64px;
  height: calc(var(--kh) * var(--k));
  border: 0; border-radius: 12px;
  background: var(--nc); color: var(--nt);
  display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
  padding: 0 0 9px;
  cursor: pointer; touch-action: manipulation; user-select: none; -webkit-user-select: none;
  box-shadow: 0 5px 0 color-mix(in srgb, var(--nc) 58%, #000), 0 9px 14px rgba(0, 0, 0, .16);
  transition: transform .07s, box-shadow .07s;
}
.key::before, .key::after { content: ""; position: absolute; left: 50%; width: 7px; height: 7px; margin-left: -3.5px; border-radius: 50%; background: color-mix(in srgb, var(--nc) 55%, #000); opacity: .55; }
.key::before { top: 9px; }
.key::after { bottom: 36px; }
.key .kn { position: relative; font-weight: 700; font-size: 15px; line-height: 1; }
.key .kn.low::after { content: ""; position: absolute; left: 50%; bottom: -7px; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: currentColor; }
.key .kn.high::before { content: ""; position: absolute; left: 50%; top: -8px; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: currentColor; }
.key .kk { display: none; margin-top: 8px; font-size: 11px; opacity: .75; font-weight: 700; }
@media (hover: hover) and (pointer: fine) { .key .kk { display: block; } }
.key.is-down { transform: translateY(4px); box-shadow: 0 1px 0 color-mix(in srgb, var(--nc) 58%, #000), 0 3px 6px rgba(0, 0, 0, .18); }
.key.is-wrong, .heard.is-wrong { animation: wobble .4s; }
.key.is-good, .heard.is-good { animation: glow .6s; }
.key.is-hint { animation: beckon 1.1s ease-in-out infinite; }
@keyframes wobble { 0%, 100% { translate: 0 0; } 25% { translate: -6px 0; } 75% { translate: 6px 0; } }
@keyframes glow { 0% { filter: brightness(1.5); } 100% { filter: brightness(1); } }
@keyframes beckon { 0%, 100% { translate: 0 0; filter: brightness(1); } 50% { translate: 0 -8px; filter: brightness(1.25); } }

/* le micro */
.ear-off { display: grid; gap: 10px; justify-items: center; text-align: center; padding: 2px 0 4px; }
.ear-text { margin: 0; color: var(--text-soft); font-size: 15px; max-width: 34em; }
.ear-row { justify-self: stretch; display: flex; gap: 10px 14px; justify-content: center; align-items: flex-end; }
.inst-pick { flex: 0 1 330px; display: grid; gap: 3px; font-size: 13px; color: var(--text-soft); font-weight: 700; text-align: left; min-width: 0; }
.inst-pick select { font-size: 15px; font-weight: 400; color: var(--text); background: var(--panel); border: 2px solid var(--line-strong); border-radius: 12px; height: 46px; padding: 0 10px; width: 100%; min-width: 0; text-overflow: ellipsis; }
#mic-on { flex: none; }
.ear-off.is-blocked .ear-row, .ear-off.is-blocked .ear-text { display: none; }
.dock:has(.ear-msg:not([hidden])) .hint { display: none; }
.ear-msg { max-width: 38em; display: grid; gap: 8px; justify-items: center; padding: 10px 14px; border-radius: 14px; background: var(--panel); border: 2px solid var(--line); font-size: 15px; }
.ear-msg p { margin: 0; }
.ear-msg a { font-weight: 700; }
.ear-on { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 4px 2px 6px; }
.heard {
  --lvl: 0;
  width: 92px; height: 92px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--nc, var(--panel)); color: var(--nt, var(--text-soft));
  border: 3px dashed var(--line-strong);
  box-shadow: 0 0 0 calc(3px + var(--lvl) * 14px) color-mix(in srgb, var(--nc, var(--accent)) 22%, transparent);
  transition: background-color .15s, box-shadow .08s, opacity .2s;
}
.heard[data-l] { border: 3px solid color-mix(in srgb, var(--nc) 60%, #000); }
.heard.is-wait { opacity: .45; }
.heard-n { font-family: var(--font-display); font-weight: 800; font-size: 27px; line-height: 1; }
.ear-mid { min-width: 0; }
.ear-cap { margin: 0; font-weight: 700; font-size: 16px; }
.tuner { position: relative; height: 40px; margin-top: 6px; }
.tuner::before { content: ""; position: absolute; left: 0; right: 0; top: 9px; height: 8px; border-radius: 4px; background: var(--line); }
.tuner .tz { position: absolute; left: 35%; width: 30%; top: 7px; height: 12px; border-radius: 6px; background: color-mix(in srgb, #4CAF5A 55%, transparent); }
.tuner .needle { position: absolute; top: 0; left: calc(50% + var(--c, 0) * 1%); width: 6px; margin-left: -3px; height: 26px; border-radius: 3px; background: var(--text); transition: left .12s; }
.tuner .needle.off { opacity: .2; }
.tuner span { position: absolute; top: 24px; font-size: 12px; color: var(--text-soft); }
.tuner .t-lo { left: 0; }
.tuner .t-mid { left: 50%; transform: translateX(-50%); }
.tuner .t-hi { right: 0; }
.ear-side { display: grid; gap: 8px; justify-items: end; }
.mini { height: 36px; padding: 0 12px; border-radius: 999px; border: 2px solid var(--line-strong); background: var(--panel); color: var(--text); font-weight: 700; font-size: 13px; cursor: pointer; white-space: nowrap; }

.seg { align-self: center; display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--panel); border: 2px solid var(--line); }
.seg button { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border: 0; border-radius: 999px; background: none; color: var(--text-soft); font-weight: 700; font-size: 14px; cursor: pointer; }
.seg button svg { width: 18px; height: 18px; }
.seg button[aria-checked="true"] { background: var(--text); color: var(--panel); }

.flyer { position: fixed; z-index: 45; left: 0; top: 0; width: 28px; height: 28px; margin: -14px 0 0 -14px; border-radius: 50%; background: var(--nc); box-shadow: 0 0 0 3px rgba(255, 255, 255, .85), 0 6px 14px rgba(0, 0, 0, .2); pointer-events: none; }
.confetti { position: fixed; z-index: 44; top: -20px; width: 10px; height: 16px; border-radius: 3px; pointer-events: none; animation: confetti-fall var(--t, 2.6s) cubic-bezier(.3, .1, .7, 1) forwards; }
@keyframes confetti-fall { to { transform: translate(var(--dx, 0px), 110vh) rotate(var(--rot, 540deg)); } }

/* bureau : la carte et le xylophone grandissent avec la hauteur de l'écran */
@media (min-width: 900px) {
  .card { padding: clamp(14px, 2vh, 22px) clamp(16px, 1.6vw, 24px) clamp(18px, 2.4vh, 26px); gap: clamp(12px, 1.7vh, 18px); }
  .pill { width: clamp(34px, 4.2vh, 40px); height: clamp(34px, 4.2vh, 40px); font-size: 15px; }
  .count { font-size: 15px; }
  .panel { grid-template-columns: clamp(46px, 5.8vh, 56px) minmax(0, 1fr); gap: clamp(10px, 1.6vh, 16px) 14px; }
  .ph-play { width: clamp(46px, 5.8vh, 56px); height: clamp(46px, 5.8vh, 56px); }
  .ph-lyric { font-size: clamp(19px, 2.65vh, 26px); }
  .beads { --stp: clamp(8px, 1.3vh, 13px); --bs: clamp(32px, 4.5vh, 46px); gap: clamp(4px, .6vh, 7px); }
  .bead { font-size: clamp(13px, 1.65vh, 16px); }
  .xylo { --kh: clamp(100px, 13.4vh, 140px); }
}

/* bureau étroit (tablette à l'horizontale, petit portable) : plus de place pour le jeu */
@media (min-width: 900px) and (max-width: 1180px) {
  .song { grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); }
  .btn-big { height: 46px; font-size: 16px; padding-right: 16px; }
  .btn-big .ic { width: 34px; height: 34px; }
  .btn { height: 42px; padding: 0 12px; font-size: 14px; }
  .btn.icon { width: 42px; padding: 0; justify-content: center; }
  .btn.icon .lbl { display: none; }
}

/* l'explication du micro disparaît quand la place manque */
@media (max-width: 899px), (max-height: 820px) {
  .ear-text { display: none; }
}

/* écrans peu hauts : on resserre */
@media (min-width: 900px) and (max-height: 820px) {
  .play { gap: 10px; padding-block: 16px 8px; }
  .play-head h1 { font-size: clamp(28px, 3vw, 40px); }
  .play-head .instr { display: none; }
  .xylo { --kh: 100px; }
  .hint { min-height: 34px; font-size: 19px; }
}

@media (min-width: 900px) and (max-height: 660px) {
  .play { gap: 8px; padding-block: 12px 6px; }
  .play-head .kicker { display: none; }
  .play-head h1 { font-size: clamp(24px, 2.2vw, 30px); }
  .xylo { --kh: 86px; }
  .hint { min-height: 30px; font-size: 18px; }
  .dock { gap: 4px; padding-block: 6px 8px; }
  .seg button { height: 30px; }
  .heard { width: 76px; height: 76px; }
}

/* ---------- téléphone / tablette : un seul écran, empilé ---------- */
@media (max-width: 899px) {
  .song { display: flex; flex-direction: column; }
  .stage { flex: 1 1 0; min-height: 120px; }
  .play { flex: 0 1 auto; gap: 10px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); padding-block: 10px 6px; }
  .dock { flex: none; padding-block: 6px calc(8px + env(safe-area-inset-bottom, 0px)); gap: 4px; }
  .play-head, .play-foot { display: none; }
  .stage-title { display: block; }
  .listen { gap: 8px; }
  .btn-big { height: 46px; font-size: 16px; padding-right: 16px; }
  .btn-big .ic { width: 34px; height: 34px; }
  .btn { height: 42px; padding: 0 12px; font-size: 14px; }
  .btn.icon { width: 42px; padding: 0; justify-content: center; }
  .btn.icon .lbl { display: none; }
  .card { padding: 10px 12px 12px; gap: 8px; border-radius: 20px; }
  .panel { grid-template-columns: 40px minmax(0, 1fr); gap: 8px 10px; }
  .ph-play { width: 40px; height: 40px; }
  .ph-lyric { font-size: 17px; }
  .beads { --stp: 6px; --bs: 28px; gap: 3px; }
  .bead { font-size: 12px; }
  .pill { width: 30px; height: 30px; font-size: 13px; }
  .hint { font-size: 18px; min-height: 34px; }
  .nchip { min-width: 44px; height: 32px; font-size: 16px; }
  .xylo { --kh: 98px; gap: 4px; }
  .key { border-radius: 10px; padding-bottom: 7px; }
  .key .kn { font-size: 14px; }
  .key::after { bottom: 30px; }
  .seg button { height: 32px; padding: 0 12px; font-size: 13px; }
  .heard { width: 76px; height: 76px; }
  .heard-n { font-size: 23px; }
  .ear-on { grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px 12px; padding: 2px 0 4px; }
  .ear-side { gap: 6px; justify-items: stretch; }
  .ear-side .mini { height: 34px; padding: 0 10px; }
  .lbl-l { display: none; }
  .ear-cap { font-size: 15px; line-height: 1.2; }
  .tuner { margin-top: 4px; }
  .ear-row { gap: 8px; }
  .inst-pick > span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .inst-pick select { font-size: 14px; }
  #mic-on { height: 46px; font-size: 15px; padding-right: 14px; }
  #mic-on .ic { width: 34px; height: 34px; }
  .ear-msg { font-size: 14px; padding: 8px 12px; gap: 6px; }
  .medals { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 40px 12px; }
  .home-head { grid-template-columns: minmax(0, 1fr); }
  .home-title { font-size: clamp(48px, 14.5vw, 96px); }
  .howto { grid-template-columns: minmax(0, 1fr); }
}
@media (min-width: 700px) and (max-width: 1099px) { .medals { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 380px) {
  .btn-big .lbl { font-size: 15px; }
  .beads { --bs: 26px; }
  .xylo { --kh: 90px; gap: 3px; }
  .key .kn { font-size: 13px; }
}

/* jouer la comptine : phrase par phrase, ou toute la comptine d'un coup (puis les phrases à revoir) */
.card .seg-play { align-self: stretch; display: flex; }
.seg-play button { flex: 1 1 0; justify-content: center; min-width: 0; white-space: nowrap; }
.pill.is-redo { outline: 3px dashed #E5484D; outline-offset: 2px; }
/* « À toi de jouer ! » proposé (phrases à revoir) : le bouton respire doucement */
.btn-big.is-ready { animation: go-ready 1.6s ease-in-out infinite; }
@keyframes go-ready { 0%, 100% { box-shadow: 0 4px 0 color-mix(in srgb, var(--accent) 62%, #000), 0 0 0 0 color-mix(in srgb, var(--accent) 45%, transparent); } 50% { box-shadow: 0 4px 0 color-mix(in srgb, var(--accent) 62%, #000), 0 0 0 9px color-mix(in srgb, var(--accent) 0%, transparent); } }
@media (prefers-reduced-motion: reduce) { .btn-big.is-ready { animation: none; } }
/* libellé double (« Tout écouter » / « Arrêter ») : le bouton a la largeur du plus long, rien ne se décale */
.lbl2 { display: inline-grid; }
.lbl2 > span { grid-area: 1 / 1; text-align: center; }
.lbl2 .l-busy, .is-on > .lbl2 .l-idle { visibility: hidden; }
.is-on > .lbl2 .l-busy { visibility: visible; }

/* ============ barre du décor : retour, instrument, comptine suivante ============ */
.stage-bar {
  position: absolute; z-index: 4;
  top: calc(14px + env(safe-area-inset-top, 0px));
  left: max(14px, env(safe-area-inset-left, 0px));
  right: max(14px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 10px;
  pointer-events: none;
}
.stage-bar > * { pointer-events: auto; }
.stage-bar .back, .stage-bar .next-song { position: static; flex: none; }
.stage-bar .next-song { margin-left: auto; }
.inst-pill {
  position: relative; display: inline-flex; align-items: center; gap: 6px;
  height: 42px; min-width: 0; padding-left: 12px; border-radius: 999px;
  background: var(--paper); color: var(--ink); box-shadow: 0 4px 0 rgba(0, 0, 0, .16);
}
.inst-pill > svg:first-child { width: 20px; height: 20px; flex: none; }
.inst-pill select, .home-select select {
  appearance: none; -webkit-appearance: none;
  border: 0; background: transparent; color: inherit;
  font: inherit; font-weight: 700; cursor: pointer;
  min-width: 0; text-overflow: ellipsis;
}
.inst-pill select { height: 100%; font-size: 15px; padding: 0 34px 0 2px; border-radius: 999px; }
.inst-pill select:focus-visible, .home-select select:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.inst-pill .chev, .home-select .chev { position: absolute; right: 10px; top: 50%; width: 18px; height: 18px; margin-top: -9px; pointer-events: none; }
.inst-pill select option, .home-select select option { color: #1D2350; background: #FFFFFF; }

/* ============ niveau et façon de jouer, sous le xylophone ============ */
.dock-bar { align-self: stretch; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px 10px; }
.dock-bar .seg { align-self: auto; }
.seg .lv { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; font-size: 12px; line-height: 1; background: var(--line); color: inherit; }
.seg button[aria-checked="true"] .lv { background: var(--accent); color: var(--accent-ink); }
.seg .short { display: none; }
/* libellés longs seulement quand la colonne de jeu est assez large */
@media (max-width: 1359px) {
  .seg .long { display: none; }
  .seg .short { display: inline; }
}

/* ============ niveau 2 : décompte, jeu, verdict ============ */
.cin { display: inline-flex; gap: 12px; }
.cin b { display: inline-grid; place-items: center; width: 1.9em; height: 1.9em; border-radius: 50%; border: 2px solid var(--text-soft); color: var(--text); transition: transform .12s, background-color .12s; }
.cin b.past { background: color-mix(in srgb, var(--accent) 32%, transparent); border-color: transparent; }
.cin b.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); transform: scale(1.3); box-shadow: 0 3px 0 color-mix(in srgb, var(--accent) 60%, #000); }
.hint.go { color: var(--accent); font-size: 26px; }
.card.beat { animation: card-beat .24s ease-out; }
@keyframes card-beat { from { box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 55%, transparent); } to { box-shadow: 0 0 0 0 transparent; } }
.is-taking .listen .btn, .is-taking .strip, .is-taking .ph-play, .is-taking .ph-to, .is-taking .dock-bar { opacity: .45; pointer-events: none; }

/* verdict de chaque note : un anneau autour de la perle */
.bead.r-ok, .bead.r-near, .bead.r-far, .bead.r-wrong, .bead.r-miss { outline-offset: 2px; }
.bead.r-ok { outline: 3px solid #2FA35A; }
.bead.r-near { outline: 3px solid #F0A020; }
.bead.r-far { outline: 3px solid #E5484D; }
.bead.r-wrong { outline: 3px dashed #E5484D; }
.bead.r-miss { outline: 3px dotted var(--line-strong); }

/* bande du rythme : un trait par note attendue, un point par note jouée */
.rstrip { grid-column: 1 / -1; position: relative; height: 18px; max-width: 760px; margin-top: -4px; }
.rstrip .rline { position: absolute; left: 0; right: 0; top: 8px; height: 2px; border-radius: 1px; background: var(--line-strong); }
.rstrip .tk { position: absolute; top: 3px; width: 2px; height: 12px; margin-left: -1px; border-radius: 1px; background: var(--text-soft); }
.rstrip .dot { position: absolute; top: 3px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; box-shadow: 0 0 0 2px var(--panel-2); }
.rstrip .dot.ok { background: #2FA35A; }
.rstrip .dot.near { background: #F0A020; }
.rstrip .dot.far { background: #E5484D; }
.rstrip .dot.bad { background: #E5484D; border-radius: 2px; transform: rotate(45deg) scale(.85); }
.rstrip .dot.extra { top: 5px; width: 8px; height: 8px; margin-left: -4px; background: var(--text-soft); }

/* ============ accueil : liste des instruments, niveau ============ */
.home-select { position: relative; display: flex; align-items: center; gap: 8px; height: 50px; padding-left: 14px; margin: 0 0 10px; border-radius: 14px; border: 2px solid var(--ink); background: #FFF3C9; color: var(--ink); }
.home-select > svg:first-child { width: 22px; height: 22px; flex: none; }
.home-select select { flex: 1; height: 100%; font-size: 17px; padding: 0 40px 0 0; }
.home-select .chev { right: 14px; }
.legend p.inst-note { margin: 0; font-size: 14px; }
.legend .inst-opts { clear: both; }
.level-set .inst-card b { font-family: var(--font-display); }
.medal-r2 { display: inline-flex; align-items: center; gap: 1px; margin-left: 6px; color: #B9800F; font-size: 12px; letter-spacing: -.02em; }
.medal-r2 svg { width: 13px; height: 13px; margin-right: 2px; color: var(--ink-soft); }

/* ============ tailles d'écran ============ */
/* xylophone ou micro en icônes quand la colonne de jeu n'est pas très large : la barre des réglages tient sur une ligne */
@media (max-width: 1499px) {
  .seg-mode button span { display: none; }
  .seg-mode button { padding: 0 12px; }
}
@media (max-width: 899px) {
  .seg .long { display: none; }
  .seg .short { display: inline; }
  .seg .lv { width: 18px; height: 18px; font-size: 11px; }
  .rstrip { height: 16px; }
  .hint.go { font-size: 22px; }
  .cin { gap: 9px; }
}
@media (max-width: 520px) {
  .stage-bar { gap: 8px; }
  .stage-bar .back { width: 42px; padding: 0; }
  .stage-bar .back span { display: none; }
  .inst-pill select { font-size: 14px; padding-right: 30px; }
}
/* Le titre de la comptine : dans le pupitre sur grand écran ; sur téléphone et
   tablette, dans la barre du haut, entre l'instrument et « suivante », pour ne
   rien cacher du décor. */
.stage-bar .stage-title { display: none; }
@media (max-width: 899px) {
  .stage-bar .stage-title {
    display: flex; position: static; flex: 1 1 auto; min-width: 0; max-width: none;
    flex-direction: column; justify-content: center; height: 42px; padding: 0 16px;
    border-radius: 999px; box-shadow: 0 4px 0 rgba(0, 0, 0, .16);
  }
  .stage-bar .stage-title span { font-size: 10px; line-height: 1.1; letter-spacing: .08em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stage-bar .stage-title b { font-size: 16px; line-height: 1.12; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* les mots à trait d'union du titre (span.nw) restent dans la ligne du titre */
  .stage-bar .stage-title b span { display: inline; font: inherit; letter-spacing: normal; text-transform: none; color: inherit; }
  .stage-bar .next-song { margin-left: 0; }
}
/* téléphone : l'instrument devient un bouton rond (le menu s'ouvre toujours au toucher) */
@media (max-width: 560px) {
  .inst-pill { flex: none; width: 42px; padding: 0; justify-content: center; }
  .inst-pill > svg:first-child { width: 21px; height: 21px; }
  .inst-pill select { position: absolute; inset: 0; width: 100%; height: 100%; padding: 0; opacity: 0; font-size: 16px; }
  .inst-pill .chev { display: none; }
  .stage-bar .stage-title { padding: 0 14px; }
  /* téléphone : le titre en entier (sur deux lignes s'il le faut), sans la ligne « Comptine n · niveau » */
  .stage-bar .stage-title > span { display: none; }
  .stage-bar .stage-title b { font-size: 15px; line-height: 1.04; white-space: normal; text-wrap: balance; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; }
}
@media (max-width: 359px) { .stage-bar .stage-title b { font-size: 14px; } .stage-bar .stage-title { padding: 0 11px; } }
.cin b.bar { margin-left: 8px; }

/* petits téléphones (iPhone SE…) : on gagne quelques pixels pour garder le décor */
@media (max-width: 899px) and (max-height: 700px) {
  .xylo { --kh: 84px; }
  .rstrip { height: 14px; margin-top: -6px; }
  .rstrip .rline { top: 6px; }
  .rstrip .tk, .rstrip .dot { top: 1px; }
  .rstrip .dot.extra { top: 3px; }
  .ear-msg { font-size: 13px; padding: 6px 10px; }
}
/* bureau très bas : la bande du rythme se fait discrète */
@media (min-width: 900px) and (max-height: 660px) {
  .rstrip { height: 14px; margin-top: -6px; }
  .rstrip .rline { top: 6px; }
  .rstrip .tk, .rstrip .dot { top: 1px; }
  .rstrip .dot.extra { top: 3px; }
  .card { gap: 8px; padding-top: 10px; padding-bottom: 12px; }
}

.listen .btn .ic { display: inline-grid; place-items: center; }

/* carte de fin : jouer toute la comptine d'un coup, et son bilan */
.full-ask { margin: 0; font-weight: 700; color: var(--text); }
.full-res { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 12px; border-radius: 14px; background: var(--panel); border: 2px solid var(--line); }
.full-res.is-ok { border-color: #2FA35A; }
.full-res p { margin: 0; flex: 1 1 16em; color: var(--text); }
.full-ph { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 5px; }
.full-ph li { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; font-size: 13px; font-weight: 700; color: #fff; }
.full-ph li.ok { background: #2FA35A; }
.full-ph li.near { background: #F0A020; }
.full-ph li.bad { background: #E5484D; }
@media (max-width: 899px) {
  .done-card { gap: 8px; padding: 12px 14px 14px; }
  .done-card .done-stars svg { width: 30px; height: 30px; }
  .done-actions { gap: 8px; }
  .done-actions .btn { height: 40px; }
}

/* carte de fin, plus compacte : étoiles et titre sur une ligne, boutons resserrés */
.done-card { gap: 10px; padding: 14px 18px 16px; }
.done-head { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 12px; }
.done-card h2 { font-size: clamp(22px, 2.1vw, 28px); }
.done-card .done-stars svg { width: 28px; height: 28px; }
.done-actions { gap: 8px; }
.done-actions .btn { height: 40px; padding: 0 14px; font-size: 14px; }
.done-actions .btn-big { height: 46px; font-size: 16px; padding-right: 16px; }
.done-actions .btn-big .ic { width: 34px; height: 34px; }
@media (max-width: 899px) {
  .done-card h2 { font-size: 20px; }
  .done-card .done-stars svg { width: 24px; height: 24px; }
  .done-card > p { font-size: 15px; }
  .full-res, .full-ask { font-size: 15px; }
}

/* carte de fin affichée : l'indication du bas (redite du titre) et le pied de page s'effacent ;
   s'il manque encore de la place, le xylophone (ou le micro) se replie jusqu'à ce qu'on rejoue */
.song:has(#done:not([hidden])) .dock > .hint,
.song:has(#done:not([hidden])) .play-foot { display: none; }
.song.tight:has(#done:not([hidden])) .dock > .xylo,
.song.tight:has(#done:not([hidden])) .dock > .ear { display: none; }
.done-actions .short { display: none; }
@media (max-width: 899px) {
  .done-actions .long { display: none; }
  .done-actions .short { display: inline; }
  .done-actions #d-again { width: 40px; padding: 0; justify-content: center; }
}
/* niveau 2, carte de fin : son grand bouton remplace « À toi » (qui revient en « Arrêter » pendant la prise) */
.song:has(#done:not([hidden])) #b-go { display: none; }

/* ============ rangement : la phrase et ses écoutes, les réglages en bas ============
   carte : ▶ (la phrase) | paroles | ? (jusqu'à la note, niveau 1) ;
   sous le xylophone : niveau · xylophone ou micro · lentement */
.ph-play { grid-column: 1; grid-row: 1; }
.ph-lyric { grid-column: 2; grid-row: 1; }
.ph-to { grid-column: 3; grid-row: 1; height: 42px; padding: 0 14px 0 8px; font-size: 14px; }
.ph-to .q { display: grid; place-items: center; }
.ph-to .q svg { width: 12px; height: 12px; }
.song[data-level="1"] .panel { grid-template-columns: 46px minmax(0, 1fr) auto; }
.seg-slow button { padding: 0 12px; }
.seg-slow button svg { width: 22px; height: 22px; }
.seg button[aria-pressed="true"] { background: var(--text); color: var(--panel); }
@media (min-width: 900px) {
  .song[data-level="1"] .panel { grid-template-columns: clamp(46px, 5.8vh, 56px) minmax(0, 1fr) auto; }
}
@media (max-width: 1359px) {
  .ph-to .lbl { display: none; }
  .ph-to { width: 42px; padding: 0; justify-content: center; border-radius: 50%; }
}
@media (max-width: 899px) {
  .song[data-level="1"] .panel { grid-template-columns: 40px minmax(0, 1fr) auto; }
  .ph-to { width: 40px; height: 40px; }
  /* une seule rangée d'actions : « À toi de jouer ! » prend la place qui reste */
  .listen { flex-wrap: nowrap; }
  .listen .btn-big { flex: 1 1 auto; min-width: 0; justify-content: center; padding-left: 7px; }
  .listen .btn-big .ic { margin-right: auto; }
  .listen .btn-big .lbl2 { margin-right: auto; }
  .listen .btn { flex: none; }
  .dock-bar { gap: 6px 8px; }
  .seg-level button, .seg-slow button { padding: 0 10px; }
}
@media (max-width: 380px) {
  .listen .btn { padding: 0 10px; }
  .listen .btn .ic svg { width: 16px; height: 16px; }
  .seg button, .seg-level button, .seg-slow button, .seg-mode button { padding: 0 8px; }
  .dock-bar { gap: 6px; }
}
/* diagnostic du micro (?diag) */
.ear-diag { position: fixed; right: 8px; bottom: 8px; z-index: 2147483646; max-width: 70vw; padding: 6px 9px; border-radius: 10px; background: rgba(0, 0, 0, .78); color: #fff; font: 11px/1.4 ui-monospace, Menlo, Consolas, monospace; pointer-events: none; }

/* ================================ DÉCORS ================================ */
.sc .sc-text { font-family: var(--font-display); font-weight: 800; }
.sc .pl { transform: translate(calc(var(--mx2, 0) * var(--d, 0) * 16px), calc(var(--my2, 0) * var(--d, 0) * 9px)); transition: transform .7s cubic-bezier(.2, .7, .2, 1); }
.sc .fl { transition: opacity .6s; }
.sc .fl-in { animation: fl-bob 5s ease-in-out infinite alternate; }
.sc .fl.gone { opacity: 0; }
@keyframes fl-bob { from { transform: translate(-12px, 10px) rotate(-10deg); } to { transform: translate(12px, -14px) rotate(10deg); } }
@keyframes hop { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-34px); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes bob { from { transform: translateY(0); } to { transform: translateY(-14px); } }

/* confiserie */
.sc-bonbons .bb-fill { transform: translateY(calc((1 - var(--p, 0)) * 340px)); transition: transform .9s cubic-bezier(.3, 1.4, .5, 1); }
.sc-bonbons .bb-lolly { transform-box: view-box; animation: sway 4s ease-in-out infinite alternate; }
.sc-bonbons .bb-l1 { transform-origin: 230px 795px; }
.sc-bonbons .bb-l2 { transform-origin: 790px 795px; animation-delay: -2s; }
.sc-bonbons .bb-jar { transform-box: view-box; transform-origin: 500px 790px; }
.react .sc-bonbons .bb-jar { animation: jiggle .5s; }
.sc-bonbons .bb-rain { display: none; }
.is-done .sc-bonbons .bb-rain { display: block; }
.sc-bonbons .rain-c { animation: candy-fall 2.8s linear infinite; animation-delay: var(--d); transform: translate(var(--x), -80px); }
@keyframes candy-fall { from { transform: translate(var(--x), -80px) rotate(var(--r)); } to { transform: translate(var(--x), 1080px) rotate(calc(var(--r) + 300deg)); } }
@keyframes sway { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
@keyframes jiggle { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-3deg); } 60% { transform: rotate(2.5deg); } }

/* aube */
.sc-aube .au-night { opacity: calc(1 - var(--p, 0) * 1.15); transition: opacity 1.4s; }
.sc-aube .au-sun { transform: translateY(calc((1 - var(--p, 0)) * 270px)); transition: transform 1.4s cubic-bezier(.3, 1, .4, 1); }
.sc-aube .au-bell { transform-box: view-box; transform-origin: 635px 372px; }
.react .sc-aube .au-bell { animation: bell .9s ease-out; }
.is-done .sc-aube .au-bell { animation: bell-big 1.1s ease-in-out infinite alternate; }
.sc-aube .au-awake, .sc-aube .au-ding { opacity: 0; transition: opacity .5s; }
.is-done .sc-aube .au-awake, .is-done .sc-aube .au-ding { opacity: 1; }
.is-done .sc-aube .au-asleep, .is-done .sc-aube .au-zzz { opacity: 0; }
.sc-aube .au-zzz text { animation: zzz 3s ease-in-out infinite; }
.sc-aube .au-zzz text:nth-child(2) { animation-delay: -1s; }
.sc-aube .au-zzz text:nth-child(3) { animation-delay: -2s; }
.is-done .sc-aube .au-ding text { animation: ding 1.1s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
.is-done .sc-aube .au-ding text:nth-child(2) { animation-delay: -.4s; }
.is-done .sc-aube .au-ding text:nth-child(3) { animation-delay: -.8s; }
@keyframes bell { 0% { transform: rotate(0); } 25% { transform: rotate(14deg); } 55% { transform: rotate(-9deg); } 80% { transform: rotate(4deg); } 100% { transform: rotate(0); } }
@keyframes bell-big { from { transform: rotate(-22deg); } to { transform: rotate(22deg); } }
@keyframes zzz { 0%, 100% { opacity: 0; transform: translateY(10px); } 40%, 70% { opacity: 1; transform: translateY(-6px); } }
@keyframes ding { from { transform: scale(.85) rotate(-6deg); } to { transform: scale(1.1) rotate(6deg); } }

/* lune */
.sc-lune .lu-star { opacity: .13; transition: opacity .8s; }
.sc-lune .lu-star.on { opacity: 1; animation: twinkle 3s ease-in-out infinite; }
.sc-lune .lu-star.on:nth-child(3n) { animation-delay: -1s; }
.sc-lune .lu-star.on:nth-child(3n+1) { animation-delay: -2s; }
.sc-lune .lu-smile, .sc-lune .lu-happy, .sc-lune .lu-flame, .sc-lune .lu-lit, .sc-lune .lu-door { opacity: 0; transition: opacity 1.2s; }
.is-done .sc-lune .lu-smile, .is-done .sc-lune .lu-happy, .is-done .sc-lune .lu-flame, .is-done .sc-lune .lu-lit, .is-done .sc-lune .lu-door { opacity: 1; }
.is-done .sc-lune .lu-sleep, .is-done .sc-lune .lu-sad { opacity: 0; }
.sc-lune .lu-flame { animation: flicker .25s ease-in-out infinite alternate; }
.react .sc-lune .lu-moon { animation: moon-glow .7s; }
@keyframes twinkle { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
@keyframes flicker { from { opacity: .85; } to { opacity: 1; } }
@keyframes moon-glow { 0%, 100% { filter: brightness(1); } 40% { filter: brightness(1.25); } }

/* prairie */
.sc-prairie .pr-sun { transform-box: view-box; transform-origin: 830px 200px; animation: spin 50s linear infinite; }
.sc-prairie .pr-sirs { animation: bob 3.2s ease-in-out infinite alternate; }
.sc-prairie .pr-mouse-pos { transform: translate(var(--mx, 300px), 818px); transition: transform .55s cubic-bezier(.4, 1.3, .5, 1); }
.pr-hop .sc-prairie .pr-mouse { animation: hop .55s ease-out; }
.sc-prairie .pr-snail, .sc-prairie .pr-puff { opacity: 0; }
.is-done .sc-prairie .pr-mouse { opacity: 0; transition: opacity .2s .35s; }
.is-done .sc-prairie .pr-snail { opacity: 1; transition: opacity .4s .55s; }
.is-done .sc-prairie .pr-puff { animation: puff 1s ease-out forwards; transform-box: fill-box; transform-origin: center; }
.sc-prairie .pr-steam path { animation: steam 2.2s ease-in-out infinite; }
.sc-prairie .pr-steam path:nth-child(2) { animation-delay: -.7s; }
.sc-prairie .pr-steam path:nth-child(3) { animation-delay: -1.4s; }
@keyframes puff { 0% { opacity: 0; transform: scale(.3); } 30% { opacity: 1; transform: scale(1.1); } 100% { opacity: 0; transform: scale(1.5); } }
@keyframes steam { 0% { opacity: 0; transform: translateY(16px); } 50% { opacity: .9; } 100% { opacity: 0; transform: translateY(-26px); } }

/* forêt */
.sc-foret .fo-wolf-wrap { transform: translate(708px, 560px); transition: transform .8s cubic-bezier(.3, 1.4, .5, 1); }
[data-wolf="1"] .sc-foret .fo-wolf-wrap { transform: translate(684px, 560px); }
[data-wolf="2"] .sc-foret .fo-wolf-wrap { transform: translate(656px, 556px); }
[data-wolf="3"] .sc-foret .fo-wolf-wrap { transform: translate(622px, 552px); }
[data-wolf="out"] .sc-foret .fo-wolf-wrap { transform: translate(480px, 590px) scale(1.12); }
[data-wolf="out"] .sc-foret .fo-wolf { animation: hop .7s ease-out 2; }
.sc-foret .fo-hat, .sc-foret .fo-shirt, .sc-foret .fo-pants, .sc-foret .fo-boots, .sc-foret .fo-arms { opacity: 0; transition: opacity .4s; }
[data-wolf="2"] .sc-foret .fo-hat, [data-wolf="3"] .sc-foret .fo-hat, [data-wolf="out"] .sc-foret .fo-hat,
[data-wolf="out"] .sc-foret .fo-shirt, [data-wolf="out"] .sc-foret .fo-pants, [data-wolf="out"] .sc-foret .fo-boots, [data-wolf="out"] .sc-foret .fo-arms { opacity: 1; }
.sc-foret .fo-kid { animation: walk .5s ease-in-out infinite alternate; }
.sc-foret .fo-run { transition: transform 1.6s ease-in; }
.is-done .sc-foret .fo-run { transform: translateX(-420px); }
.is-done .sc-foret .fo-bubble-kids { opacity: 0; transition: opacity .3s; }
.sc-foret .fo-bubble-wolf { transform-box: fill-box; transform-origin: 80% 100%; }
.react .sc-foret .fo-bubble-wolf { animation: bubble .5s cubic-bezier(.3, 1.6, .5, 1); }
.react .sc-foret .fo-rays { animation: rays .8s; }
@keyframes walk { from { transform: translateY(0); } to { transform: translateY(-5px); } }
@keyframes bubble { from { transform: scale(.6); } to { transform: scale(1); } }
@keyframes rays { 50% { opacity: .4; } }

/* provence */
.sc-provence .pv-sun { transform-box: view-box; transform-origin: 800px 220px; animation: spin 60s linear infinite; }
.sc-provence .pv-waves { animation: waves 3s ease-in-out infinite alternate; }
.sc-provence .pv-dancer { opacity: 0; transition: opacity .5s; }
.sc-provence .pv-dancer.on { opacity: 1; }
.sc-provence .pv-dancer-in { transform-box: fill-box; transform-origin: 50% 100%; }
.react .sc-provence .pv-dancer.on .pv-dancer-in { animation: hop .5s; }
.is-done .sc-provence .pv-dancer-in { animation: dance .9s ease-in-out infinite alternate; animation-delay: calc(var(--i) * -.22s); }
@keyframes waves { from { transform: translateX(-24px); } to { transform: translateX(24px); } }
@keyframes dance { from { transform: translateY(0) rotate(-12deg); } to { transform: translateY(-22px) rotate(12deg); } }

/* château */
.sc-chateau .dg-culotte { transform-box: view-box; transform-origin: 500px 766px; transform: rotate(180deg); transition: transform 1.2s cubic-bezier(.5, 1.7, .4, 1); }
.is-done .sc-chateau .dg-culotte { transform: rotate(0deg); }
.sc-chateau .dg-crown { transform-box: fill-box; transform-origin: 50% 100%; }
.react .sc-chateau .dg-crown { animation: crown .55s cubic-bezier(.3, 1.6, .5, 1); }
.sc-chateau .dg-point { transform-box: fill-box; transform-origin: 100% 50%; animation: point 1.4s ease-in-out infinite alternate; }
.is-done .sc-chateau .dg-point { animation: none; opacity: 0; }
.sc-chateau .dg-ok { opacity: 0; transition: opacity .6s .9s; }
.is-done .sc-chateau .dg-ok { opacity: 1; }
@keyframes crown { 0% { transform: translateY(0); } 40% { transform: translateY(-26px) rotate(-8deg); } 100% { transform: translateY(0); } }
@keyframes point { from { transform: rotate(-4deg); } to { transform: rotate(6deg); } }

/* fontaine */

/* ---------- analyse : partitions → événements datés ---------- */
const NOTE_PC = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
const NOTE_STEP = { C: 0, D: 1, E: 2, F: 3, G: 4, A: 5, B: 6 };
const NOTE_FR = { C: 'Do', D: 'Ré', E: 'Mi', F: 'Fa', G: 'Sol', A: 'La', B: 'Si' };
const PC_FR = ['Do', 'Do♯', 'Ré', 'Mi♭', 'Mi', 'Fa', 'Fa♯', 'Sol', 'Sol♯', 'La', 'Si♭', 'Si'];
const PC_LETTER = ['C', null, 'D', null, 'E', 'F', null, 'G', null, 'A', null, 'B'];
const DUR = { w: 4, h: 2, q: 1, e: 0.5, s: 0.25 };

function parsePitch(p) {
  const m = /^([A-G])(\d)$/.exec(p);
  if (!m) throw new Error('Hauteur illisible : ' + p);
  const L = m[1], o = +m[2];
  return { name: p, letter: L, fr: NOTE_FR[L], midi: 12 * (o + 1) + NOTE_PC[L], step: o * 7 + NOTE_STEP[L], octave: o };
}

function parseDur(d) {
  const dotted = d.endsWith('.');
  const base = DUR[dotted ? d.slice(0, -1) : d];
  if (base == null) throw new Error('Durée illisible : ' + d);
  return dotted ? base * 1.5 : base;
}

function splitSyllables(text) {
  const words = text.split(' ');
  const out = [];
  words.forEach((w, wi) => {
    const parts = w.split('|');
    parts.forEach((p, pi) => {
      let s = p.replace(/_/g, ' ');
      if (pi === parts.length - 1 && wi < words.length - 1) s += ' ';
      out.push(s);
    });
  });
  return out;
}

function buildSong(src) {
  const song = Object.assign({}, src);
  const beatsPerBar = src.meter[0] * (4 / src.meter[1]);
  song.barBeats = beatsPerBar;
  song.events = [];
  song.notes = [];
  song.phrases = [];
  let t = 0;
  src.phrases.forEach(([text, seq], pi) => {
    const syl = splitSyllables(text);
    const ph = { index: pi, text, syllables: syl, events: [], notes: [], start: t };
    let si = 0;
    seq.trim().split(/\s+/).forEach((tok) => {
      const [p, d] = tok.split('/');
      const dur = parseDur(d);
      const ev = { t, dur, phrase: pi };
      if (p === 'r') {
        ev.rest = true;
      } else {
        Object.assign(ev, parsePitch(p));
        ev.n = song.notes.length;
        ev.syl = syl[si];
        ev.sylIndex = si;
        si++;
        song.notes.push(ev);
        ph.notes.push(ev.n);
      }
      // accent : premier temps de mesure (et 2e pulsation en 6/8)
      const pos = ((t - src.pickup) % beatsPerBar + beatsPerBar) % beatsPerBar;
      ev.accent = pos < 1e-6 ? 1 : (src.meter[1] === 8 && Math.abs(pos - 1.5) < 1e-6 ? 0.6 : 0);
      song.events.push(ev);
      ph.events.push(ev);
      t += dur;
    });
    ph.end = t;
    ph.sylCount = syl.length;
    ph.noteCount = si;
    song.phrases.push(ph);
  });
  song.total = t;
  // la première note de chaque phrase est donnée (mais il faut la jouer)
  song.given = new Set(song.phrases.map((ph) => ph.notes[0]));
  song.minStep = Math.min(...song.notes.map((n) => n.step));
  song.maxStep = Math.max(...song.notes.map((n) => n.step));
  song.minMidi = Math.min(...song.notes.map((n) => n.midi));
  song.maxMidi = Math.max(...song.notes.map((n) => n.midi));
  return song;
}

    pizz:      { kind: 'ks', rev: 0.22, gain: 0.56, seconds: 1.2, bright: 0.55, damp: 0.993, lp: 2600, tail: 0.18 },
    harp:      { kind: 'ks', rev: 0.34, gain: 0.5, seconds: 2.6, bright: 0.2, damp: 0.9985, lp: 3600, tail: 0.9 },
    harpsi:    { kind: 'ks', rev: 0.24, gain: 0.34, seconds: 1.6, bright: 1, damp: 0.997, lp: 6500, tail: 0.25, octave: 0.32 },

    accordion: { kind: 'reed', rev: 0.2, gain: 0.15, attack: 0.03, release: 0.08, detune: 4, lp: 3200 },

    flute:     { kind: 'sust', rev: 0.28, gain: 0.26, attack: 0.06, release: 0.09, wave: [1, 0.22, 0.07, 0.03, 0.012],

                 vibrato: [5.2, 0.0035, 0.25], breath: 0.04, noise: [3, 1], lp: [3, 6.5, 0.08] },
    trumpet:   { kind: 'sust', rev: 0.22, gain: 0.2, attack: 0.03, release: 0.06, wave: [1, 0.95, 0.9, 0.75, 0.6, 0.48, 0.36, 0.27, 0.2, 0.14, 0.1, 0.07, 0.05],
                 vibrato: [5.5, 0.002, 0.3], breath: 0.015, noise: [4, 1], lp: [2.5, 9, 0.06] },
    trombone:  { kind: 'sust', rev: 0.24, gain: 0.24, attack: 0.045, release: 0.08, wave: [1, 0.85, 0.7, 0.55, 0.42, 0.32, 0.24, 0.17, 0.12, 0.08],
                 vibrato: [5, 0.0015, 0.3], breath: 0.012, noise: [4, 1], lp: [2, 7, 0.08] },
