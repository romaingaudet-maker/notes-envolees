                 vibrato: [4.8, 0.0012, 0.3], breath: 0.008, noise: [3, 1], lp: [2, 4.2, 0.1] },
    violin:    { kind: 'sust', rev: 0.3, gain: 0.2, attack: 0.08, release: 0.13, wave: Array.from({ length: 16 }, (_, k) => Math.pow(k + 1, -0.85)),
                 vibrato: [5.6, 0.0045, 0.22], breath: 0.03, noise: [6, 0.7], lp: [14, 14, 0.01, 7000], body: [[450, 3], [2600, 4]] },
    viola:     { kind: 'sust', rev: 0.3, gain: 0.22, attack: 0.09, release: 0.14, wave: Array.from({ length: 14 }, (_, k) => Math.pow(k + 1, -0.95)),
                 vibrato: [5.3, 0.004, 0.25], breath: 0.03, noise: [5, 0.7], lp: [12, 12, 0.01, 5000], body: [[350, 3], [1600, 3]] },
    cello:     { kind: 'sust', rev: 0.3, gain: 0.24, attack: 0.1, release: 0.16, wave: Array.from({ length: 14 }, (_, k) => Math.pow(k + 1, -0.9)),
                 vibrato: [5, 0.0035, 0.28], breath: 0.025, noise: [5, 0.7], lp: [12, 12, 0.01, 4000], body: [[220, 3], [1200, 2]] },
  };
  Object.keys(VOICES).forEach((k) => { VOICES[k].id = k; });

  const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);
  const voiceOf = (id) => VOICES[id] || VOICES.metallo;
  function tailOf(v) {
    if (v.kind === 'add') return v.ring * 1.7 + 0.35;
    if (v.kind === 'ks') return v.tail + 0.6;
    return v.release + 0.35;
  }
  function mark(v, midi, t, dur, bus) {
    quietUntil = Math.max(quietUntil, t + dur - Math.min(EARLY, dur * 0.5));
    lastConcert = midi;
    const now = ctx ? ctx.currentTime : 0;
    if (recent.length > 40) recent = recent.filter((r) => r.until > now);
    recent.push({ pc: ((midi % 12) + 12) % 12, start: t, end: t + dur, until: t + dur + tailOf(v), bus });
  }
  /* Ce que la page fait encore entendre : pcs = hauteurs (classes de notes,
     son réel) qui résonnent, body = une note de la page n'est pas finie */
  function ringing(now) {
    let pcs = null, body = false;
    for (const r of recent) {
      if (r.start > now + 0.02 || r.until <= now) continue;
      (pcs || (pcs = new Set())).add(r.pc);
      if (now < r.end) body = true;
    }
    return pcs ? { pcs, body } : null;
  }

  function ensure() {
    if (!AC) return null;
    if (!ctx) {
      try { if (navigator.audioSession && navigator.audioSession.type === 'auto') navigator.audioSession.type = 'playback'; } catch (e) { /* facultatif */ }
      ctx = new AC({ latencyHint: 'interactive' });
      master = ctx.createGain();
      master.gain.value = 0.85;
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -16; comp.knee.value = 12; comp.ratio.value = 3.5;
      comp.attack.value = 0.004; comp.release.value = 0.25;
      master.connect(comp);
      comp.connect(ctx.destination);
      const conv = ctx.createConvolver();
      conv.buffer = impulse(2.4, 3.2);
      revIn = ctx.createGain();
      revIn.connect(conv);
      conv.connect(master);
      noise = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const nd = noise.getChannelData(0);
      for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
      packs.forEach((k) => decode(k)); // sons arrivés avant (navigateur sans contexte hors ligne)
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  function impulse(sec, decay) {
    const rate = ctx.sampleRate, len = Math.floor(rate * sec);
    const buf = ctx.createBuffer(2, len, rate);
    for (let c = 0; c < 2; c++) {
      const d = buf.getChannelData(c);
      for (let i = 0; i < len; i++) {
        const fadeIn = i < rate * 0.012 ? i / (rate * 0.012) : 1;
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay) * fadeIn;
      }
    }
    return buf;
  }

  function makeBus(voice) {
    const g = ctx.createGain();
    g.connect(master);
    const s = ctx.createGain();
    // les enregistrements ont déjà leur salle : moins de réverbération ajoutée
    s.gain.value = packReady(voice.id) ? SAMPLED[voice.id].rev : voice.rev;
    g.connect(s);
    s.connect(revIn);
    return g;
  }

  /* --- synthèse additive (cloches, boîte à musique, lames, piano…) --- */
  function addNote(v, dest, midi, t, dur, vel) {
    const f = hz(midi);
    const out = ctx.createGain();
    out.connect(dest);
    const peak = v.gain * vel;
    out.gain.setValueAtTime(0.0001, t);
    out.gain.linearRampToValueAtTime(peak, t + v.attack);
    const dampAt = t + dur + v.ring * 0.35;
    out.gain.setTargetAtTime(0, dampAt, v.ring * 0.22);
    const hardStop = dampAt + v.ring * 1.4;
    v.partials.forEach(([r, a, d]) => {
      const fr = f * r;
      if (fr > 15000) return;
      const o = ctx.createOscillator();
      o.frequency.value = fr;
      const g = ctx.createGain();
      g.gain.setValueAtTime(a, t);
      g.gain.exponentialRampToValueAtTime(0.0006, t + d);
      o.connect(g);
      g.connect(out);
      o.start(t);
      o.stop(Math.min(t + d + 0.05, hardStop));
    });
  }

  /* --- cordes pincées : Karplus-Strong (violon pincé, harpe, guitare…) --- */
  function ksBuffer(v, midi) {
    const key = v.id + ':' + midi;
    if (ksCache.has(key)) return ksCache.get(key);
    const rate = ctx.sampleRate, f = hz(midi);
    const N = Math.max(2, Math.round(rate / f - 0.5));
    const fAct = rate / (N + 0.5);
    const len = Math.floor(rate * v.seconds);
    const buf = ctx.createBuffer(1, len, rate);
    const d = buf.getChannelData(0);
    const ring = new Float32Array(N);
    for (let i = 0; i < N; i++) ring[i] = Math.random() * 2 - 1;
    const passes = Math.round((1 - v.bright) * 6);
    for (let p = 0; p < passes; p++) {
      let prev = ring[N - 1];
      for (let i = 0; i < N; i++) { const cur = ring[i]; ring[i] = 0.5 * (cur + prev); prev = cur; }
    }
    let mean = 0;
    for (let i = 0; i < N; i++) mean += ring[i];
    mean /= N;
    for (let i = 0; i < N; i++) ring[i] -= mean;
    let idx = 0, peak = 0;
    for (let i = 0; i < len; i++) {
      const a = ring[idx], b = ring[(idx + 1) % N];
      d[i] = a;
      ring[idx] = v.damp * 0.5 * (a + b);
      idx = (idx + 1) % N;
      const abs = Math.abs(a);
      if (abs > peak) peak = abs;
    }
    const fade = Math.floor(rate * 0.04);
    for (let i = 0; i < fade; i++) d[len - 1 - i] *= i / fade;
    const k = 1 / (peak || 1);
    for (let i = 0; i < len; i++) d[i] *= k;
    const res = { buf, rate: f / fAct };
    ksCache.set(key, res);
    return res;
  }

  function ksNote(v, dest, midi, t, dur, vel) {
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = v.lp;
    lp.Q.value = 0.5;
    const g = ctx.createGain();
    g.gain.setValueAtTime(v.gain * vel, t);
    const dampAt = t + Math.max(dur, 0.12) + v.tail;
    g.gain.setTargetAtTime(0, dampAt, 0.07);
    lp.connect(g);
    g.connect(dest);
    const strings = [[midi, 1, 0]];
    if (v.octave) strings.push([midi + 12, v.octave, 0.004]);
    strings.forEach(([m, amp, delay]) => {
      const { buf, rate } = ksBuffer(v, m);
      const src = ctx.createBufferSource();
      src.buffer = buf;
      src.playbackRate.value = rate;
      const sg = ctx.createGain();
      sg.gain.value = amp;
      src.connect(sg);
      sg.connect(lp);
      src.start(t + delay);
      src.stop(Math.min(t + buf.duration / rate, dampAt + 0.6));
    });
  }

  /* --- vents : galoubet, pipeau, ocarina, clarinette --- */
  function windNote(v, dest, midi, t, dur, vel) {
    const f = hz(midi);
    let wave = waves.get(v.id);
    if (!wave) {
      const imag = new Float32Array([0].concat(v.wave));
      wave = ctx.createPeriodicWave(new Float32Array(imag.length), imag);
      waves.set(v.id, wave);
    }
    const end = t + Math.max(0.08, dur * 0.93);
    const peak = v.gain * vel;
    const o = ctx.createOscillator();
    o.setPeriodicWave(wave);
    o.frequency.value = f;
    const lfo = ctx.createOscillator();
    lfo.frequency.value = v.vibrato[0];
    const lg = ctx.createGain();
    lg.gain.setValueAtTime(0, t);
    lg.gain.linearRampToValueAtTime(f * v.vibrato[1], t + Math.min(0.35, dur * 0.6) + 0.01);
    lfo.connect(lg);
    lg.connect(o.frequency);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, t + v.attack);
    g.gain.setValueAtTime(peak, end);
    g.gain.setTargetAtTime(0, end, v.release / 3);
    o.connect(g);
    g.connect(dest);
    const n = ctx.createBufferSource();
    n.buffer = noise;
    n.loop = true;
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = f * 2;
    bp.Q.value = 1.2;
    const ng = ctx.createGain();
    ng.gain.setValueAtTime(0, t);
    ng.gain.linearRampToValueAtTime(v.breath * vel, t + 0.02);
    ng.gain.setTargetAtTime(v.breath * 0.3 * vel, t + 0.05, 0.05);
    ng.gain.setTargetAtTime(0, end, 0.03);
    n.connect(bp);
    bp.connect(ng);
    ng.connect(dest);
    const stop = end + 0.4;
    o.start(t); lfo.start(t); n.start(t, Math.random() * 0.5);
    o.stop(stop); lfo.stop(stop); n.stop(stop);
  }

  /* --- instruments tenus de l'élève : flûte, saxophone, cuivres, cordes frottées --- */
  function sustNote(v, dest, midi, t, dur, vel) {
    const f = hz(midi);
    let wave = waves.get(v.id);
    if (!wave) {
      const imag = new Float32Array([0].concat(v.wave));
      wave = ctx.createPeriodicWave(new Float32Array(imag.length), imag);
      waves.set(v.id, wave);
    }
    const end = t + Math.max(0.08, dur * 0.94);
    const peak = v.gain * vel;
    const o = ctx.createOscillator();
    o.setPeriodicWave(wave);
    o.frequency.value = f;
    // vibrato qui arrive après l'attaque
    const lfo = ctx.createOscillator();
    lfo.frequency.value = v.vibrato[0];
    const lg = ctx.createGain();
    const vd = Math.min(v.vibrato[2], dur * 0.5);
    lg.gain.setValueAtTime(0, t);
    lg.gain.setValueAtTime(0, t + vd);
    lg.gain.linearRampToValueAtTime(f * v.vibrato[1], t + vd + 0.25);
    lfo.connect(lg);
    lg.connect(o.frequency);
    // filtre : s'ouvre à l'attaque (éclat des cuivres), plafonné pour les cordes
    const [lp0, lp1, lpT, lpMax = 12000] = v.lp;
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.Q.value = 0.7;
    lp.frequency.setValueAtTime(Math.min(lpMax, f * lp0), t);
    lp.frequency.linearRampToValueAtTime(Math.min(lpMax, f * lp1), t + lpT);
    o.connect(lp);
    let last = lp;
    (v.body || []).forEach(([fr, db]) => {
      const pk = ctx.createBiquadFilter();
      pk.type = 'peaking'; pk.frequency.value = fr; pk.Q.value = 1.1; pk.gain.value = db;
      last.connect(pk); last = pk;
    });
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, t + v.attack);
    g.gain.setValueAtTime(peak, end);
    g.gain.setTargetAtTime(0, end, v.release / 3);
    last.connect(g);
    g.connect(dest);
    // souffle (vents) ou frottement de l'archet (cordes)
    const n = ctx.createBufferSource();
    n.buffer = noise;
    n.loop = true;
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = Math.min(9000, f * v.noise[0]);
    bp.Q.value = v.noise[1];
    const ng = ctx.createGain();
    ng.gain.setValueAtTime(0, t);
    ng.gain.linearRampToValueAtTime(v.breath * vel, t + Math.min(0.03, v.attack));
    ng.gain.setTargetAtTime(v.breath * 0.35 * vel, t + v.attack, 0.06);
    ng.gain.setTargetAtTime(0, end, 0.03);
    n.connect(bp);
    bp.connect(ng);
    ng.connect(dest);
    const stop = end + v.release + 0.4;
    o.start(t); lfo.start(t); n.start(t, Math.random() * 0.5);
    o.stop(stop); lfo.stop(stop); n.stop(stop);
  }

  /* --- accordéon (anches légèrement désaccordées : effet musette) --- */
  function reedNote(v, dest, midi, t, dur, vel) {
    const f = hz(midi);
    const end = t + Math.max(0.08, dur * 0.95);
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = Math.min(v.lp, f * 9);
    lp.Q.value = 0.6;
    const g = ctx.createGain();
    const peak = v.gain * vel;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, t + v.attack);
    g.gain.setValueAtTime(peak, end);
    g.gain.setTargetAtTime(0, end, v.release / 3);
    [-v.detune, 0, v.detune].forEach((c, i) => {
      const o = ctx.createOscillator();
      o.type = i === 1 ? 'square' : 'sawtooth';
      o.frequency.value = f;
      o.detune.value = c;
      const og = ctx.createGain();
      og.gain.value = i === 1 ? 0.32 : 0.6;
      o.connect(og);
      og.connect(lp);
      o.start(t);
      o.stop(end + 0.4);
    });
    lp.connect(g);
    g.connect(dest);
  }

  /* --- sons enregistrés de l'instrument choisi (dossier sons/, chargés à la demande) ---
     Chaque fichier sons/<voix>.js apporte un MP3 où quelques notes du vrai
     instrument sont mises bout à bout (une tous les 2 à 5 demi-tons), avec leur
     hauteur exacte et, pour les sons tenus, une boucle pour durer autant qu'il
     faut. Une note est jouée à partir de l'enregistrement le plus proche, un peu
     accéléré ou ralenti. Tant que le son n'est pas prêt (ou s'il manque, page
     ouverte seule), c'est le timbre synthétisé qui joue. */
  const SAMPLED = {
    piano:    { gain: 0.97, rev: 0.12, ring: 0.18, damp: 0.12 },
    xylo:     { gain: 0.89, rev: 0.1,  ring: 0.12, damp: 0.1 },
    flute:    { gain: 0.98, rev: 0.14, release: 0.12 },
    clarinet: { gain: 0.91, rev: 0.12, release: 0.1 },
    sax:      { gain: 0.97, rev: 0.1,  release: 0.1 },
    trumpet:  { gain: 1.16, rev: 0.1,  release: 0.1 },
    horn:     { gain: 0.97, rev: 0.12, release: 0.14 },
    trombone: { gain: 1.05, rev: 0.1,  release: 0.12 },
    violin:   { gain: 0.98, rev: 0.12, release: 0.16 },
    viola:    { gain: 0.82, rev: 0.12, release: 0.16 },
    cello:    { gain: 0.92, rev: 0.12, release: 0.18 },
  };
  const packs = new Map(); // voix → { state: loading | data | decoding | ready | error, zones, buffer, delay }
  let sampledVoice = null; // seule la voix de l'instrument choisi joue ses enregistrements
  let dctx = null;

  function receive(p) {
    if (!p || !SAMPLED[p.id]) return;
    const k = Object.assign(packs.get(p.id) || {}, { id: p.id, state: 'data', zones: p.zones.slice().sort((a, b) => a.m - b.m), mark: p.mark, mp3: p.mp3 });
    packs.set(p.id, k);
    decode(k);
  }
  const queued = window.NotesSons;
  window.NotesSons = { push: receive };
  if (Array.isArray(queued)) queued.forEach(receive);

  function loadPack(id) {
    if (!SAMPLED[id] || packs.has(id) || typeof document === 'undefined') return;
    packs.set(id, { id, state: 'loading' });
    const s = document.createElement('script');
    s.src = (window.SONS_BASE || 'sons/') + id + '.js';
    s.async = true;
    s.onerror = () => { const k = packs.get(id); if (k && k.state === 'loading') k.state = 'error'; };
    (document.head || document.documentElement).appendChild(s);
  }

  // décodage sans attendre le premier geste de l'élève (contexte hors ligne)
  function decoder() {
    if (ctx) return ctx;
    if (!dctx) {
      const O = window.OfflineAudioContext || window.webkitOfflineAudioContext;
      try { if (O) dctx = new O(1, 1, 44100); } catch (e) { dctx = null; }
    }
    return dctx;
  }
  function decode(k) {
    const c = decoder();
    if (!c || k.state !== 'data') return;
    k.state = 'decoding';
    let bytes;
    try {
      const bin = atob(k.mp3);
      bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    } catch (e) { k.state = 'error'; return; }
    k.mp3 = null;
    const ok = (buf) => { if (k.state !== 'decoding') return; k.buffer = buf; k.delay = decoderDelay(buf, k.zones, k.mark); k.state = 'ready'; };
    const ko = () => { if (k.state === 'decoding') k.state = 'error'; };
    try {
      const pr = c.decodeAudioData(bytes.buffer, ok, ko);
      if (pr && pr.catch) pr.catch(ko);
    } catch (e) { ko(); }
  }
  /* Le décodeur MP3 décale tout le fichier de quelques millisecondes (25 ms
     environ). Un repère (une seule impulsion, dans le silence du début) donne
     ce décalage à l'échantillon près ; à défaut, on retrouve l'attaque de chaque
     note (même mesure qu'à la fabrication : enveloppe sur 3 ms, -38 dB sous la
     crête) et on garde l'écart médian. */
  function decoderDelay(buf, zones, mark) {
    const d = buf.getChannelData(0), sr = buf.sampleRate, h = Math.max(1, Math.round(sr * 0.0015));
    if (mark != null) {
      let best = 0, at = -1;
      const end = Math.min(d.length, Math.floor((mark + 0.065) * sr));
      for (let i = 0; i < end; i++) if (Math.abs(d[i]) > best) { best = Math.abs(d[i]); at = i; }
      if (best > 0.05) {
        // sommet entre deux échantillons (parabole)
        let f = 0;
        if (at > 0 && at < d.length - 1) {
          const a = Math.abs(d[at - 1]), b = best, c = Math.abs(d[at + 1]), den = a - 2 * b + c;
          if (den < 0) f = 0.5 * (a - c) / den;
        }
        return Math.max(-0.02, Math.min(0.08, (at + f) / sr - mark));
      }
    }
    const ds = [];
    zones.forEach((z) => {
      const a = Math.max(0, Math.floor((z.s - 0.03) * sr)), b = Math.min(d.length, Math.floor((z.s + z.n) * sr));
      if (b - a < 4 * h) return;
      // énergie sur une fenêtre de 3 ms centrée (sommes cumulées)
      const lo = Math.max(0, a - h), hi = Math.min(d.length, b + h + 1);
      const P = new Float64Array(hi - lo + 1);
      for (let i = lo; i < hi; i++) P[i - lo + 1] = P[i - lo] + d[i] * d[i];
      const en = (i) => P[Math.min(hi, i + h + 1) - lo] - P[Math.max(lo, i - h) - lo];
      let mx = 0;
      for (let i = a; i < b; i++) mx = Math.max(mx, en(i));
      const thr = mx * Math.pow(10, -38 / 10); // -38 dB sous la crête
      let i0 = a;
      while (i0 < b && en(i0) <= thr) i0++;
      if (i0 < b) ds.push(i0 / sr - (z.s + z.r));
    });
    if (!ds.length) return 0;
    ds.sort((x, y) => x - y);
    return Math.max(-0.02, Math.min(0.08, ds[ds.length >> 1]));
  }
  const packReady = (id) => {
    const k = id === sampledVoice ? packs.get(id) : null;
    return k && k.state === 'ready' ? k : null;
  };

  function smpNote(k, dest, midi, t, dur, vel) {
    const P = SAMPLED[k.id];
    let z = k.zones[0];
    for (const c of k.zones) if (Math.abs(c.m - midi) < Math.abs(z.m - midi)) z = c;
    const rate = Math.pow(2, (midi - z.m) / 12);
    const src = ctx.createBufferSource();
    src.buffer = k.buffer;
    src.playbackRate.value = rate;
    const off = Math.max(0, z.s + k.delay);
    // attaque lente (archet, souffle) : la note part un peu avant, pour être entendue sur le temps ;
    // si c'est déjà passé (touche frappée à l'instant), on saute le début de l'attaque
    let ts = t - (z.a || 0) / rate, skip = 0;
    const now = ctx.currentTime;
    if (ts < now) { skip = (now - ts) * rate; ts = now; }
    const g = ctx.createGain();
    const peak = P.gain * vel;
    g.gain.setValueAtTime(peak, ts);
    let stop;
    if (z.l) {
      // son tenu : la boucle prend le relais après l'attaque, puis on relâche
      src.loop = true;
      src.loopStart = off + z.l[0];
      src.loopEnd = off + z.l[1];
      const end = t + Math.max(0.08, dur * 0.94);
      g.gain.setValueAtTime(peak, end);
      g.gain.setTargetAtTime(0, end, P.release / 3);
      stop = end + P.release * 2.5 + 0.05;
    } else {
      // son frappé : il s'éteint tout seul, on l'étouffe un peu après la fin de la note
      const dampAt = t + Math.max(dur, 0.1) + P.ring;
      g.gain.setValueAtTime(peak, dampAt);
      g.gain.setTargetAtTime(0, dampAt, P.damp);
      stop = Math.min(ts + (z.n - skip - 0.005) / rate, dampAt + P.damp * 7); // jamais au-delà de sa note dans le MP3
    }
    src.connect(g);
    g.connect(dest);
    src.start(ts, off + skip);
    src.stop(Math.max(ts + 0.05, stop));
  }

  let lastVoice = null;
  function note(voiceId, dest, midi, t, dur, vel) {
    const v = voiceOf(voiceId);
    lastVoice = v.id;
    const m = midi + transpose;
    mark(v, m, t, dur, dest);
    const k = ctx && packReady(v.id);
    if (k) smpNote(k, dest, m, t, dur, vel);
    else if (v.kind === 'add') addNote(v, dest, m, t, dur, vel);
    else if (v.kind === 'ks') ksNote(v, dest, m, t, dur, vel);
    else if (v.kind === 'wind') windNote(v, dest, m, t, dur, vel);
    else if (v.kind === 'sust') sustNote(v, dest, m, t, dur, vel);
    else reedNote(v, dest, m, t, dur, vel);
  }

  /* Une note isolée (lame du xylophone, perle touchée) */
  function tap(voiceId, midi, dur = 0.55) {
    if (!ensure()) return;
    const key = voiceId + (packReady(voiceId) ? ':enr' : '');
    let b = tapBuses.get(key);
    if (!b) { b = makeBus(voiceOf(voiceId)); tapBuses.set(key, b); }
    note(voiceId, b, midi, ctx.currentTime + 0.008, dur, 1);
  }

  /* Une suite de notes datées en secondes ; renvoie de quoi l'arrêter */
  function sequence(voiceId, items, lead = 0.08) {
    if (!ensure()) return null;
    const bus = makeBus(voiceOf(voiceId));
    const t0 = ctx.currentTime + lead;
    items.forEach((it) => note(voiceId, bus, it.midi, t0 + it.start, it.dur, it.vel));
    return {
      t0,
      stop() {
        const now = ctx.currentTime;
        bus.gain.cancelScheduledValues(now);
        bus.gain.setValueAtTime(bus.gain.value, now);
        bus.gain.linearRampToValueAtTime(0, now + 0.06);
        quietUntil = Math.min(quietUntil, now + 0.45);
        recent.forEach((r) => { if (r.bus === bus) { r.until = r.start > now ? 0 : Math.min(r.until, now + 0.3); r.end = Math.min(r.end, now + 0.06); } });
        setTimeout(() => { try { bus.disconnect(); } catch (e) { /* déjà débranché */ } }, 250);
      },
    };
  }

  /* Pulsation du décompte : un « toc » de bois, bruit filtré sans hauteur
     nette (le micro ne le prend pas pour une note, et il ne coupe pas l'écoute) */
  let clickBuf = null;
  function clickAt(t, accent) {
    if (!ensure()) return null;
    if (!clickBuf) {
      const n = Math.floor(ctx.sampleRate * 0.05);
      clickBuf = ctx.createBuffer(1, n, ctx.sampleRate);
      const d = clickBuf.getChannelData(0);
      let seed = 3;
      for (let i = 0; i < n; i++) {
        seed = (seed * 16807) % 2147483647;
        d[i] = ((seed / 2147483647) * 2 - 1) * Math.pow(1 - i / n, 5);
      }
    }
    const src = ctx.createBufferSource();
    src.buffer = clickBuf;
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = accent ? 2400 : 1600;
    bp.Q.value = 1.4;
    const g = ctx.createGain();
    g.gain.value = accent ? 2.6 : 1.8;
    src.connect(bp); bp.connect(g); g.connect(master);
    src.start(Math.max(t, ctx.currentTime));
    return src;
  }

  /* Petite fanfare de fin : Do Mi Sol Do */
  function flourish(voiceId) {
    return sequence(voiceId, [60, 64, 67, 72].map((m, i) => ({ midi: m, start: i * 0.11, dur: i === 3 ? 0.6 : 0.16, vel: 0.8 })));
  }

  return {
    ensure, tap, sequence, flourish, clickAt,
    now: () => (ctx ? ctx.currentTime : 0),
    // délai entre l'instant programmé et le son dans le haut-parleur
    outLatency: () => (ctx ? (ctx.outputLatency || 0) + (ctx.baseLatency || 0) : 0),
    quietAt: () => quietUntil,
    ringing, EARLY,
    lastConcert: () => lastConcert,
    lastVoice: () => lastVoice,
    hasVoice: (id) => !!VOICES[id],
    setTranspose: (n) => { transpose = n | 0; },
    // l'instrument choisi joue avec ses enregistrements (chargés à la demande) ; null : timbres synthétisés
    useSamples: (id) => { sampledVoice = SAMPLED[id] ? id : null; if (sampledVoice) loadPack(id); },
    samplesState: (id) => { const k = packs.get(id); return k ? k.state : 'none'; },
    samplesInfo: (id) => { const k = packs.get(id); return k ? { state: k.state, delay: k.delay, zones: k.zones, rate: k.buffer && k.buffer.sampleRate } : null; },
    available: !!AC,
  };
})();

/* ------------------------------------------------------------------
   L'oreille : écoute un instrument réel au micro et reconnaît les notes
   - détection de hauteur par l'algorithme YIN (de Cheveigné & Kawahara)
   - suivi des notes : une note est « jouée » quand sa hauteur reste stable
     ~90 ms ; une note répétée est reconnue à sa nouvelle attaque
     (creux puis remontée du volume) ou après un court silence.
   - pendant que la page joue elle-même de la musique, l'écoute est coupée
     pour ne pas confondre le haut-parleur avec l'instrument (en tenant
     compte du retard du haut-parleur, grand sur les téléphones).
   - le son du micro est recueilli dans le fil audio (AudioWorklet), morceau
     par morceau, avec l'instant exact de chaque morceau : même quand la page
     est occupée (décor 3D, téléphone lent), aucune trame n'est perdue et
     l'instant de chaque note reste juste. Sans AudioWorklet, on lit le son
     toutes les 28 ms (AnalyserNode), comme avant.
------------------------------------------------------------------- */
const PitchKit = (() => {
  const FMIN = 50, FMAX = 2800, TH = 0.15;
  let dp = null;

  /* Renvoie { f, clarity } ou null si le son n'a pas de hauteur nette */
  function yin(x, sr, fmin = FMIN, fmax = FMAX) {
    const N = x.length, W = Math.floor(N / 2);
    const tauMin = Math.max(2, Math.floor(sr / fmax));
    const tauMax = Math.min(W - 2, Math.ceil(sr / fmin));
    if (!dp || dp.length < tauMax + 2) dp = new Float32Array(tauMax + 2);
    dp[0] = 1;
    let sum = 0, best = -1, last = tauMax;
    for (let tau = 1; tau <= tauMax; tau++) {
      let s = 0;
      for (let j = 0; j < W; j++) { const d = x[j] - x[j + tau]; s += d * d; }
      sum += s;
      dp[tau] = sum > 0 ? (s * tau) / sum : 1;
      // premier minimum local sous le seuil
      if (tau - 1 > tauMin && dp[tau - 1] < TH && dp[tau] >= dp[tau - 1]) { best = tau - 1; last = tau; break; }
    }
    if (best < 0) {
      let mv = 1;
      for (let tau = tauMin + 1; tau < tauMax; tau++) if (dp[tau] < mv) { mv = dp[tau]; best = tau; }
      if (best < 0 || mv > 0.28) return null;
    }
    let t = best;
    if (best > 1 && best + 1 <= last) {
      const a = dp[best - 1], b = dp[best], c = dp[best + 1];
      const den = a - 2 * b + c;
      if (den > 1e-9) t = best + (0.5 * (a - c)) / den;
    }
    let f = sr / t;
    // lames de métallophone, glockenspiel, cloches : harmoniques non alignées,
    // on affine sur le pic du spectre autour de la fondamentale trouvée
    if (f > 300) f = refine(x, sr, f);
    return { f, clarity: 1 - dp[best] };
  }

  let hann = null;
  const SPAN = 80, STEP = 10;
  function refine(x, sr, f0) {
    const N = x.length;
    if (!hann || hann.length !== N) {
      hann = new Float32Array(N);
      for (let i = 0; i < N; i++) hann[i] = 0.5 - 0.5 * Math.cos((2 * Math.PI * i) / (N - 1));
    }
    const pw = [];
    for (let c = -SPAN; c <= SPAN; c += STEP) {
      const w = (2 * Math.PI * f0 * Math.pow(2, c / 1200)) / sr, k = 2 * Math.cos(w);
      let s1 = 0, s2 = 0;
      for (let i = 0; i < N; i++) { const s = x[i] * hann[i] + k * s1 - s2; s2 = s1; s1 = s; }
      pw.push(Math.max(1e-12, s1 * s1 + s2 * s2 - k * s1 * s2));
    }
    let b = 0;
    for (let i = 1; i < pw.length; i++) if (pw[i] > pw[b]) b = i;
    let off = 0;
    if (b > 0 && b < pw.length - 1) {
      const l = Math.log(pw[b - 1]), m = Math.log(pw[b]), r = Math.log(pw[b + 1]);
      const den = l - 2 * m + r;
      if (den < 0) off = (0.5 * (l - r)) / den;
    } else return f0; // pic au bord : on garde l'estimation de départ
    return f0 * Math.pow(2, (-SPAN + (b + off) * STEP) / 1200);
  }

  /* Suivi des notes. push() renvoie une note jouée { r, cents, f, t } ou null ;
     t = instant de la première trame de la note (pour juger le rythme).
     T.ring = { pcs, body } : ce que la page fait encore entendre. Tant qu'une
     note de la page n'est pas finie (body), et ensuite sur les hauteurs qui
     résonnent encore (pcs), seule une vraie attaque compte : le volume monte
     nettement au-dessus de ce qu'on entendait juste avant. Le haut-parleur
     qui s'éteint, ou le mélange de deux notes, ne passent pas pour une note. */
  function makeTracker() {
    const T = { cand: null, held: null, silent: 0, tune: 0, expectPc: null, ring: null, hist: [] };
    const ATK = 2, HIST = 10;
    const remember = (rms) => { T.hist.push(rms); if (T.hist.length > HIST) T.hist.shift(); };
    T.push = (res, rms, gate, now = 0) => {
      const floor = T.hist.length ? Math.min(...T.hist) : 0;
      remember(rms);
      // attaque : le volume dépasse nettement le plus faible des ~280 ms précédentes
      const rise = rms > floor * ATK && rms > gate * 1.3;
      if (res && res.f >= FMIN && res.f <= FMAX) {
        const m = 69 + 12 * Math.log2(res.f / 440) - T.tune / 100;
        const r = Math.round(m), cents = (m - r) * 100;
        T.silent = 0;
        // même nom de note, même à l'octave près : le micro d'un téléphone rend mal les graves,
        // et la hauteur saute parfois d'une octave d'une trame à l'autre (seul le nom compte)
        if (T.cand && (((T.cand.r - r) % 12) + 12) % 12 === 0) {
          T.cand.n++; T.cand.c = T.cand.c * 0.6 + cents * 0.4;
          if (rise) T.cand.atk = true;
        } else T.cand = { r, n: 1, c: cents, t: now, atk: rise };
        const pc = ((r % 12) + 12) % 12;
        const need = T.expectPc == null || pc === T.expectPc ? 3 : 5;
        if (T.cand.n < need) return null;
        const masked = T.ring && !T.cand.atk && (T.ring.body || T.ring.pcs.has(pc));
        if (masked && (!T.held || T.held.pc !== pc)) T.held = { pc, peak: rms, min: rms, armed: false, ring: true };
        const h = T.held;
        if (!h || h.pc !== pc) {
          T.held = { pc, peak: rms, min: rms, armed: false };
          return { r, cents: T.cand.c, f: res.f, t: T.cand.t };
        }
        if (h.ring && !masked && T.cand.atk) {
          // l'instrument attaque par-dessus ce que la page fait encore résonner
          T.held = { pc, peak: rms, min: rms, armed: false };
          return { r, cents: T.cand.c, f: res.f, t: now };
        }
        h.peak = Math.max(h.peak, rms);
        if (!h.armed && rms < h.peak * 0.55) { h.armed = true; h.min = rms; }
        if (h.armed) {
          h.min = Math.min(h.min, rms);
          if (rms > h.min * 1.8 && rms > gate * 1.3) {
            T.held = { pc, peak: rms, min: rms, armed: false };
            return { r, cents: T.cand.c, f: res.f, t: now };
          }
        }
        return null;
      }
      T.silent++;
      const h = T.held;
      if (h) {
        if (!h.armed && rms < h.peak * 0.55) { h.armed = true; h.min = rms; }
        else if (h.armed) h.min = Math.min(h.min, rms);
      }
      if (T.silent >= 3) { T.held = null; T.cand = null; }
      return null;
    };
    T.hold = (pc, rms) => { remember(rms); T.held = pc == null ? null : { pc, peak: rms, min: rms, armed: false }; T.cand = null; T.silent = 0; };
    T.nudge = (cents) => { T.tune = Math.max(-45, Math.min(45, T.tune + cents * 0.3)); };
    return T;
  }

  return { yin, makeTracker, FMIN, FMAX };
})();

const Ear = (() => {
  const FRAME_MS = 28, N = 2048;
  const S = {
    on: false, stream: null, nodes: [], an: null, buf: null, timer: 0, sr: 48000, nf: 0.003, gated: false, lastUi: 0, T: PitchKit.makeTracker(),
    mode: '', ring: null, fill: 0, tok: 0,
    // pour le diagnostic (?diag) : traitements du micro, trames par seconde, retard du traitement
    dg: { proc: null, frames: 0, since: 0, fps: 0, lag: 0, lagMax: 0, rms: 0, f: 0 },
  };
  let onNote = null, onFrame = null, onEnded = null;

  /* Le morceau de code qui tourne dans le fil audio : il découpe le son du micro
     en morceaux d'environ 28 ms et les envoie avec l'instant de leur dernier échantillon. */
  const WORKLET = `class NeEar extends AudioWorkletProcessor {
  constructor(o) { super(); this.hop = o.processorOptions.hop; this.b = new Float32Array(this.hop); this.n = 0; }
  process(inputs) {
    const ch = inputs[0] && inputs[0][0];
    if (!ch) return true;
    for (let i = 0; i < ch.length;) {
      const k = Math.min(ch.length - i, this.hop - this.n);
      this.b.set(ch.subarray(i, i + k), this.n);
      this.n += k; i += k;
      if (this.n === this.hop) {
        this.port.postMessage({ x: this.b, t: currentTime + i / sampleRate }, [this.b.buffer]);
        this.b = new Float32Array(this.hop); this.n = 0;
      }
    }
    return true;
  }
}
registerProcessor('ne-ear', NeEar);`;
  let mod = null; // { ctx, p } : le module chargé une fois par contexte audio
  async function workletNode(ctx) {
    if (!ctx.audioWorklet || typeof AudioWorkletNode === 'undefined') return null;
    try {
      if (!mod || mod.ctx !== ctx) {
        const url = URL.createObjectURL(new Blob([WORKLET], { type: 'application/javascript' }));
        mod = { ctx, p: ctx.audioWorklet.addModule(url) };
      }
      await mod.p;
      const hop = 128 * Math.max(1, Math.round((FRAME_MS / 1000) * ctx.sampleRate / 128));
      return new AudioWorkletNode(ctx, 'ne-ear', { numberOfInputs: 1, numberOfOutputs: 1, outputChannelCount: [1], channelCount: 1, channelCountMode: 'explicit', processorOptions: { hop } });
    } catch (e) {
      mod = null;
      return null; // page sans droit aux modules (bac à sable…) : on lit le son autrement
    }
  }

  const fail = (code, e) => Object.assign(new Error(code), { code, cause: e });
  function classify(e) {
    const n = (e && e.name) || '';
    if (/NotAllowed|PermissionDenied|Security/.test(n)) return 'denied';
    if (/NotFound|DevicesNotFound|Overconstrained/.test(n)) return 'nomic';
    if (/NotReadable|TrackStart|Abort/.test(n)) return 'busy';
    return 'other';
  }
  function session(type) { try { if (navigator.audioSession) navigator.audioSession.type = type; } catch (e) { /* facultatif */ } }

  // le son brut de l'instrument : sans annulation d'écho, réduction de bruit ni gain automatique
  // (ces traitements, faits pour la voix, écrasent les notes tenues et les attaques)
  const RAW = { echoCancellation: false, noiseSuppression: false, autoGainControl: false, voiceIsolation: false };

  async function start(handlers) {
    onNote = handlers.onNote; onFrame = handlers.onFrame; onEnded = handlers.onEnded;
    if (S.on) return;
    const md = navigator.mediaDevices;
    if (!md || !md.getUserMedia) throw fail('unsupported');
    const ctx = Sound.ensure();
    if (!ctx) throw fail('noaudio');
    const tok = ++S.tok;
    session('play-and-record');
    let stream;
    try {
      stream = await md.getUserMedia({ audio: Object.assign({ channelCount: { ideal: 1 } }, RAW) });
    } catch (e) {
      session('playback');
      throw fail(classify(e), e);
    }
    const track = stream.getAudioTracks()[0];
    const settingsOf = () => { try { return track.getSettings ? track.getSettings() : {}; } catch (e) { return {}; } };
    let st = settingsOf();
    // un navigateur qui a gardé un traitement : on redemande
    if (st.echoCancellation || st.noiseSuppression || st.autoGainControl) {
      try { await track.applyConstraints(RAW); st = settingsOf(); } catch (e) { /* il le garde */ }
    }
    S.dg.proc = { ec: st.echoCancellation, ns: st.noiseSuppression, agc: st.autoGainControl, sr: st.sampleRate, label: track.label || '' };
    try { if (ctx.state !== 'running') await ctx.resume(); } catch (e) { /* reprise plus tard */ }
    const src = ctx.createMediaStreamSource(stream);
    const mute = ctx.createGain();
    mute.gain.value = 0;
    const node = await workletNode(ctx);
    if (tok !== S.tok) { stream.getTracks().forEach((t) => t.stop()); return; } // arrêté pendant la mise en route
    if (node) {
      node.port.onmessage = (ev) => feed(ev.data.x, ev.data.t);
      src.connect(node);
      node.connect(mute);
      Object.assign(S, { mode: 'worklet', nodes: [src, node, mute], an: null, ring: new Float32Array(N), fill: 0 });
    } else {
      const an = ctx.createAnalyser();
      an.fftSize = N;
      an.smoothingTimeConstant = 0;
      src.connect(an);
      an.connect(mute);
      Object.assign(S, { mode: 'analyser', nodes: [src, an, mute], an, buf: new Float32Array(N) });
      S.timer = setInterval(analyze, FRAME_MS);
    }
    mute.connect(ctx.destination);
    Object.assign(S, { on: true, stream, sr: ctx.sampleRate, nf: 0.003, gated: false });
    Object.assign(S.dg, { frames: 0, since: performance.now(), fps: 0, lag: 0, lagMax: 0 });
    S.T.hold(null, 0);
    stream.getAudioTracks().forEach((t) => t.addEventListener('ended', () => { stop(); if (onEnded) onEnded(); }));
  }

  function stop() {
    S.tok++;
    if (!S.on) return;
    clearInterval(S.timer);
    S.nodes.forEach((n) => { try { n.disconnect(); } catch (e) { /* déjà débranché */ } });
    if (S.mode === 'worklet' && S.nodes[1]) S.nodes[1].port.onmessage = null;
    S.stream.getTracks().forEach((t) => t.stop());
    Object.assign(S, { on: false, stream: null, nodes: [], an: null, ring: null });
    session('playback');
  }

  // un morceau de son arrive du fil audio (t : instant de son dernier échantillon)
  function feed(x, t) {
    if (!S.on || !S.ring) return;
    const r = S.ring, hop = x.length;
    if (hop >= N) r.set(x.subarray(hop - N));
    else { r.copyWithin(0, hop); r.set(x, N - hop); }
    S.fill += hop;
    if (S.fill < N) return;
    const lag = Sound.now() - t;
    S.dg.lag = lag;
    if (lag > S.dg.lagMax) S.dg.lagMax = lag;
    analyzeFrame(r, t);
  }

  function analyze() {
    if (!S.on) return;
    S.an.getFloatTimeDomainData(S.buf);
    analyzeFrame(S.buf, Sound.now());
  }

  function analyzeFrame(x, now) {
    let ss = 0;
    for (let i = 0; i < x.length; i++) ss += x[i] * x[i];
    const rms = Math.sqrt(ss / x.length);
    S.dg.frames++;
    S.dg.rms = rms;
    // ce que le micro entend à cet instant, la page l'a programmé un peu plus tôt :
    // le son met outLatency à sortir du haut-parleur (jusqu'à 0,2 s sur certains téléphones)
    const heard = now - Math.min(0.3, Sound.outLatency ? Sound.outLatency() : 0);
    if (heard < Sound.quietAt()) {
      S.gated = true;
      S.T.hold(null, rms);
      frame(rms, null, true);
      return;
    }
    if (S.gated) {
      // l'écoute reprend un peu avant la fin de la dernière note de la page :
      // ce qui résonne encore n'est pris que sur une vraie attaque (voir T.ring)
      S.gated = false;
      S.T.hold(null, rms);
    }
    S.T.ring = Sound.ringing ? Sound.ringing(heard) : null;
    const gate = Math.max(0.0025, S.nf * 2.5);
    const res = rms > gate ? PitchKit.yin(x, S.sr) : null;
    S.dg.f = res ? res.f : 0;
    if (!res) {
      if (rms < S.nf) S.nf = S.nf * 0.9 + rms * 0.1;
      else S.nf = Math.min(0.05, S.nf * 0.997 + rms * 0.003);
    }
    const hit = S.T.push(res, rms, gate, now);
    if (hit && onNote) onNote(hit);
    frame(rms, res, false);
  }

  function frame(rms, res, gated) {
    const t = performance.now();
    if (!onFrame || t - S.lastUi < 50) return;
    S.lastUi = t;
    const c = S.T.cand;
    const db = 20 * Math.log10(rms + 1e-9);
    onFrame({
      level: Math.max(0, Math.min(1, (db + 62) / 50)),
      note: !gated && res && c && c.n >= 2 ? c.r : null,
      cents: c ? c.c : 0,
      gated,
    });
  }

  function diag() {
    const d = S.dg, t = performance.now();
    if (t - d.since > 1000) { d.fps = (d.frames * 1000) / (t - d.since); d.frames = 0; d.since = t; d.lagMax = d.lag; }
    return { on: S.on, mode: S.mode, sr: S.sr, fps: d.fps, lag: d.lag, lagMax: d.lagMax, proc: d.proc, db: 20 * Math.log10(d.rms + 1e-9), nf: 20 * Math.log10(S.nf + 1e-9), f: d.f, out: Sound.outLatency ? Sound.outLatency() : 0 };
  }

  return {
    start, stop, diag,
    active: () => S.on,
    expect: (pc) => { S.T.expectPc = pc; },
    nudge: (c) => S.T.nudge(c),
  };
})();

/* ------------------------------------------------------------------
   Le rythme : compare une phrase jouée à la phrase attendue
   - les notes jouées sont associées aux notes attendues dans l'ordre
     (programmation dynamique : hauteur + écart de temps, notes oubliées
     ou en trop permises) ;
   - on retire le décalage d'ensemble (latence du son ou du micro, départ
     un peu tardif) et, sur les phrases assez longues, le tempo réellement
     tenu s'il reste proche du décompte (± 12 %) : un léger ralenti régulier
     ne fait pas « tomber » toutes les notes de la fin ;
   - écarts exprimés en pulsations : ≤ 0,25 en place, ≤ 0,45 un peu tôt ou
     un peu tard, au-delà nettement en avance ou en retard ;
   - indulgence qui grandit avec la longueur : sur une longue phrase, une
     note nettement à côté est pardonnée ; sur toute une comptine, quelques
     fausses notes aussi.
------------------------------------------------------------------- */
const Rhythm = (() => {
  const OK = 0.25, NEAR = 0.45;

  const median = (a) => {
    const s = [...a].sort((x, y) => x - y), n = s.length;
    return n ? (n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2) : 0;
  };

  // exp, got : [{ t (secondes) , … }] ; same(e, g) : bonne hauteur ?
  // modèle de temps : une note attendue à t doit sonner à off + k·t
  function align(exp, got, same, off, k, win) {
    const n = exp.length, m = got.length;
    // une fausse note coûte plus qu'un écart de temps, même grand :
    // on associe d'abord les bonnes hauteurs, dans l'ordre
    const MISS = 1.5, EXTRA = 1.1, WRONG = 2.2;
    const D = Array.from({ length: n + 1 }, () => new Float64Array(m + 1));
    const B = Array.from({ length: n + 1 }, () => new Int8Array(m + 1));
    for (let i = 1; i <= n; i++) { D[i][0] = i * MISS; B[i][0] = 1; }
    for (let j = 1; j <= m; j++) { D[0][j] = j * EXTRA; B[0][j] = 2; }
    for (let i = 1; i <= n; i++) {
      for (let j = 1; j <= m; j++) {
        const dt = (got[j - 1].t - off - k * exp[i - 1].t) / win;
        let best = D[i - 1][j - 1] + (same(exp[i - 1], got[j - 1]) ? 0 : WRONG) + Math.min(2, dt * dt), b = 0;
        if (D[i - 1][j] + MISS < best) { best = D[i - 1][j] + MISS; b = 1; }
        if (D[i][j - 1] + EXTRA < best) { best = D[i][j - 1] + EXTRA; b = 2; }
        D[i][j] = best; B[i][j] = b;
      }
    }
    const pairs = new Array(n).fill(-1), extra = [];
    let i = n, j = m;
    while (i > 0 || j > 0) {
      const b = B[i][j];
      if (b === 0 && i > 0 && j > 0) { pairs[i - 1] = j - 1; i--; j--; } else if (b === 1) i--; else { extra.push(j - 1); j--; }
    }
    return { pairs, extra: extra.reverse() };
  }

  /* exp : notes attendues { t } (t en secondes, la première à 0)
     got : notes jouées { t } (même origine : l'instant où la phrase devait commencer)
     beat : durée d'une pulsation (s) ; same(e, g) : la hauteur est-elle juste ?
     mic : notes venues du micro (une note répétée peut lui échapper) */
  function evaluate({ exp, got, beat, same, mic = false }) {
    const n = exp.length;
    const win = Math.max(0.12, beat * 0.5);
    let off = got.length && same(exp[0], got[0]) && Math.abs(got[0].t) < beat * 1.5 ? got[0].t : 0;
    let k = 1, raw = 1;
    let A = align(exp, got, same, off, k, win);
    const rightPairs = () => A.pairs.map((j, i) => [i, j]).filter(([i, j]) => j >= 0 && same(exp[i], got[j]));
    let rp = rightPairs();
    if (rp.length) { off = median(rp.map(([i, j]) => got[j].t - exp[i].t)); A = align(exp, got, same, off, k, win); rp = rightPairs(); }
    // tempo réellement tenu (phrases assez longues seulement : sinon on effacerait les erreurs de rythme)
    for (let it = 0; it < 2 && rp.length >= 5; it++) {
      const xs = rp.map(([i]) => exp[i].t), ys = rp.map(([, j]) => got[j].t);
      const mx = xs.reduce((a, v) => a + v, 0) / xs.length, my = ys.reduce((a, v) => a + v, 0) / ys.length;
      let sxy = 0, sxx = 0;
      xs.forEach((x, q) => { sxy += (x - mx) * (ys[q] - my); sxx += (x - mx) * (x - mx); });
      if (sxx < (3 * beat) * (3 * beat)) break;
      raw = sxy / sxx;
      k = Math.max(0.88, Math.min(1.12, raw));
      off = median(rp.map(([i, j]) => got[j].t - k * exp[i].t));
      A = align(exp, got, same, off, k, win);
      rp = rightPairs();
    }

    const notes = exp.map((e, i) => {
      const j = A.pairs[i];
      if (j < 0) return { i, kind: 'missed' };
      const g = got[j];
      const dev = (g.t - off - k * e.t) / beat;
      const a = Math.abs(dev);
      const timing = a <= OK ? 'ok' : a <= NEAR ? (dev < 0 ? 'early' : 'late') : (dev < 0 ? 'early!' : 'late!');
      return { i, j, kind: same(e, g) ? 'right' : 'wrong', dev, timing };
    });
    const right = notes.filter((x) => x.kind === 'right');
    const missed = notes.filter((x) => x.kind === 'missed').length;
    const wrong = n - right.length - missed;
    const inPlace = right.filter((x) => x.timing === 'ok').length;
    const farOff = right.filter((x) => x.timing.endsWith('!')).length;
    const drift = raw > 1.1 ? 'slower' : raw < 0.9 ? 'faster' : null;
    const tempoOk = raw >= 0.86 && raw <= 1.14;

    // indulgence selon la longueur
    const okWrong = n >= 20 ? Math.floor(n / 20) : 0;
    const okMissed = (mic && n >= 8 ? 1 : 0) + (n >= 20 ? Math.floor(n / 20) : 0);
    const okFar = (n >= 10 ? 1 : 0) + (n >= 24 ? Math.floor((n - 10) / 12) : 0);
    const okExtra = 1 + Math.floor(n / 8);
    const pitchOk = wrong <= okWrong && missed <= okMissed;
    const rhythmOk = tempoOk && farOff <= okFar && inPlace >= Math.ceil(0.6 * right.length);
    return {
      notes, extra: A.extra, off, k, slope: raw, entry: off / beat, drift,
      right: right.length, wrong, missed, inPlace, farOff, total: n,
      pitchOk, rhythmOk, pass: pitchOk && rhythmOk && A.extra.length <= okExtra,
      perfect: right.length === n && inPlace === n && !A.extra.length,
      played: got.length,
    };
  }

  /* Phrase courte pour l'enfant */
  function verdict(r, ordinal) {
    if (!r.played) return { text: 'Je n’ai rien entendu… Recommence après le décompte.', mood: 'down' };
    if (r.pass) return r.perfect ? { text: 'Parfait : juste et en rythme !', mood: 'ok' } : { text: 'Bravo, c’est réussi !', mood: 'ok' };
    if (!r.pitchOk) {
      if (r.missed === r.total) return { text: 'Je n’ai pas reconnu la phrase. Écoute l’exemple.', mood: 'down' };
      if (!r.wrong) return { text: r.missed === 1 ? 'Presque ! Il manque une note.' : `Il manque ${r.missed} notes.`, mood: 'down' };
      if (!r.missed) return { text: r.wrong === 1 ? 'Presque ! Une note n’est pas la bonne.' : `${r.wrong} notes ne sont pas les bonnes.`, mood: 'down' };
      return { text: `${r.wrong + r.missed} notes ne sont pas les bonnes.`, mood: 'down' };
    }
    if (r.drift === 'faster') return { text: 'Les notes sont justes, mais tu as accéléré.', mood: 'up' };
    if (r.drift === 'slower') return { text: 'Les notes sont justes, mais tu as ralenti.', mood: 'up' };
    const worst = r.notes.filter((x) => x.kind === 'right' && x.timing !== 'ok').sort((a, b) => Math.abs(b.dev) - Math.abs(a.dev))[0];
    if (worst) {
      const where = ordinal ? ordinal(worst.i) : `La ${worst.i ? worst.i + 1 + 'e' : '1re'} note`;
      return { text: `Notes justes ! ${where} arrive ${worst.dev < 0 ? 'trop tôt' : 'trop tard'}.`, mood: 'up' };
    }
    return { text: 'Les notes sont justes. Attention aux notes en trop.', mood: 'up' };
  }

  return { evaluate, verdict, align, OK, NEAR };
})();

/* ------------------------------------------------------------------
   Les décors en papier découpé (SVG 1000 × 1000, rognés à l'écran)
   Zone sûre : x 150–850, y 170–830.
------------------------------------------------------------------- */
const Scenes = (() => {
  function rng(seed) {
    let s = seed >>> 0;
    return () => {
      s = (s + 0x6d2b79f5) >>> 0;
      let t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const starPath = (r) => {
    let d = '';
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + (i * Math.PI) / 5;
      const rr = i % 2 ? r * 0.45 : r;
      d += (i ? 'L' : 'M') + (Math.cos(a) * rr).toFixed(1) + ' ' + (Math.sin(a) * rr).toFixed(1);
    }
    return d + 'Z';
  };
  const sparkle = (r) => `M0 ${-r} L${r * 0.22} ${-r * 0.22} L${r} 0 L${r * 0.22} ${r * 0.22} L0 ${r} L${-r * 0.22} ${r * 0.22} L${-r} 0 L${-r * 0.22} ${-r * 0.22}Z`;
  const cloud = (x, y, s, fill) =>
    `<g transform="translate(${x} ${y}) scale(${s})"><circle cx="-40" cy="8" r="34" fill="${fill}"/><circle cx="0" cy="-10" r="46" fill="${fill}"/><circle cx="46" cy="6" r="36" fill="${fill}"/><rect x="-74" y="8" width="150" height="34" rx="17" fill="${fill}"/></g>`;

  /* --- « notes envolées » : petites formes qui flottent dans le décor --- */
  function floaters(world, n, seed) {
    const r = rng(seed);
    const [x0, y0, x1, y1] = world.area;
    let out = '<g class="floaters">';
    for (let i = 0; i < n; i++) {
      const x = Math.round(x0 + r() * (x1 - x0));
      const y = Math.round(y0 + r() * (y1 - y0));
      const dl = (r() * -6).toFixed(2), du = (4.5 + r() * 3).toFixed(2), rot = Math.round(r() * 50 - 25);
      out += `<g class="fl" style="transform:translate(${x}px,${y}px)"><g class="fl-in" style="animation-delay:${dl}s;animation-duration:${du}s"><g transform="rotate(${rot})">${world.floater}</g></g></g>`;

      const r = rng(7);

      let candies = '';

            ? `<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="19" fill="${col}"/><circle cx="${(x - 6).toFixed(0)}" cy="${(y - 6).toFixed(0)}" r="5" fill="#fff" opacity=".55"/>`
            : `<g transform="translate(${x.toFixed(0)} ${y.toFixed(0)}) rotate(${Math.round(r() * 60 - 30)})"><path d="M-12 0 L-24 -10 L-24 10Z M12 0 L24 -10 L24 10Z" fill="${col}"/><ellipse rx="15" ry="12" fill="${col}"/><ellipse rx="15" ry="12" fill="#fff" opacity=".18"/></g>`;
        }

      let rain = '';
      for (let i = 0; i < 18; i++) {

        rain += `<g class="rain-c" style="--x:${x}px;--d:${(r() * 1.6).toFixed(2)}s;--r:${Math.round(r() * 360)}deg"><path d="M-10 0 L-21 -9 L-21 9Z M10 0 L21 -9 L21 9Z" fill="${col}"/><ellipse rx="12" ry="10" fill="${col}"/></g>`;
      }

/* ------------------------------------------------------------------
   Les Notes Envolées — suivi des parties, pour le professeur

   Le jeu envoie au Worker du professeur (suivi/worker.js) le déroulé des
   parties : comptine, niveau, instrument choisi, xylophone ou micro,
   étoiles, erreurs, durée. Pas de compte : chaque navigateur reçoit un
   identifiant tiré au hasard, gardé sur l'appareil ; le Worker y ajoute
   l'adresse IP de la connexion. Le son du micro n'est jamais envoyé.
   Tant que SUIVI_URL est vide, rien ne part.
------------------------------------------------------------------- */
const Suivi = (() => {
  // adresse du Worker Cloudflare, sans « / » à la fin (vide : suivi coupé)
  // (la version de qualification passe window.NE_SUIVI_URL = '' : ses essais ne partent pas dans le suivi)
  const W = typeof window !== 'undefined' ? window : {};
  const SUIVI_URL = W.NE_SUIVI_URL != null ? W.NE_SUIVI_URL : 'https://notes-envolees-suivi.romain-gaudet.workers.dev';
  const NS = W.NE_NS || ''; // préfixe des clés du stockage local (qualification : 'qualif-')
  const ID_KEY = NS + 'notes-envolees-id';       // identifiant de ce navigateur
  const OFF_KEY = NS + 'notes-envolees-suivi-off'; // '1' : appareil du professeur, à ne pas suivre

  const get = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const put = (k, v) => { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { /* stockage indisponible */ } };

  let memo = null;
  function id() {
    const v = get(ID_KEY);
    if (v && /^[a-z0-9]{6,32}$/.test(v)) return v;
    if (!memo) {
      const abc = 'abcdefghijkmnpqrstuvwxyz23456789', a = new Uint8Array(12);
      crypto.getRandomValues(a);
      memo = Array.from(a, (x) => abc[x % abc.length]).join('');
    }
    put(ID_KEY, memo);
    return memo;
  }

  // temps passé page visible (ms) : la durée d'une partie ne compte pas l'onglet caché
  let shown = 0, since = document.hidden ? null : performance.now();
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { if (since != null) { shown += performance.now() - since; since = null; } }
    else if (since == null) since = performance.now();
  });
  const clock = () => shown + (since != null ? performance.now() - since : 0);

  const excluded = () => get(OFF_KEY) === '1';
  const active = () => !!SUIVI_URL && !excluded();

  function send(type, data) {
    if (!active()) return;
    const body = JSON.stringify(Object.assign({ e: id(), y: type, v: 1 }, data));
    const url = SUIVI_URL + '/e';
    try { if (navigator.sendBeacon && navigator.sendBeacon(url, body)) return; } catch (e) { /* on essaie autrement */ }
    try { fetch(url, { method: 'POST', body, keepalive: true, mode: 'no-cors' }).catch(() => {}); } catch (e) { /* tant pis */ }
  }

  function device() {
    const coarse = window.matchMedia && matchMedia('(pointer: coarse)').matches;
    const small = Math.min(screen.width || 0, screen.height || 0) < 600;
    return coarse ? (small ? 'telephone' : 'tablette') : 'ordinateur';
  }

  return {
    url: SUIVI_URL,
    configured: !!SUIVI_URL,
    active, send, clock, device,
    id: () => get(ID_KEY),
    excluded,
    exclude: (on) => put(OFF_KEY, on ? '1' : null),
  };
})();

  let medalRO = null;

  function drawStaff(score) {
    const svg = score.querySelector('.staff');
    const box = score.getBoundingClientRect();
    const pts = [...score.querySelectorAll('.medal')]
      .sort((a, b) => a.dataset.i - b.dataset.i)
      .map((li) => { const r = li.querySelector('.medal-disc').getBoundingClientRect(); return [r.left + r.width / 2 - box.left, r.top + r.height / 2 - box.top]; });
    if (pts.length < 2) return;
    const first = pts[0], last = pts[pts.length - 1];
    const lead = Math.min(160, box.width * 0.18);
    const P = [[first[0] - lead, first[1] + 34], ...pts, [last[0] + (last[0] > box.width / 2 ? lead : -lead), last[1] - 26]];
    let d = `M${P[0][0].toFixed(1)} ${P[0][1].toFixed(1)}`;
    for (let i = 0; i < P.length - 1; i++) {
      const p0 = P[i - 1] || P[i], p1 = P[i], p2 = P[i + 1], p3 = P[i + 2] || p2;
      const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
      const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
      d += ` C${c1[0].toFixed(1)} ${c1[1].toFixed(1)} ${c2[0].toFixed(1)} ${c2[1].toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
    }
    const W = box.width, H = box.height;
    svg.setAttribute('viewBox', `0 0 ${W.toFixed(0)} ${H.toFixed(0)}`);
    svg.innerHTML = `<defs><mask id="staff-mask" maskUnits="userSpaceOnUse" x="-300" y="-300" width="${W + 600}" height="${H + 600}"><g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="${d}" stroke="#fff" stroke-width="64"/><path d="${d}" stroke="#000" stroke-width="60"/>
      <path d="${d}" stroke="#fff" stroke-width="34"/><path d="${d}" stroke="#000" stroke-width="30"/>
      <path d="${d}" stroke="#fff" stroke-width="3"/></g></mask></defs>
      <rect class="ink" x="-300" y="-300" width="${W + 600}" height="${H + 600}" mask="url(#staff-mask)"/>`;
  }

  /* ================================ COMPTINE ================================ */
  const wOf = (d) => (d <= 0.25 ? 0.8 : d <= 0.5 ? 0.9 : d <= 0.75 ? 0.95 : d <= 1 ? 1 : d <= 1.5 ? 1.25 : d <= 2 ? 1.45 : 1.7);

  function keysFor(song) {
    const lo = Math.max(25, song.minStep - 1), hi = Math.min(35, song.maxStep + 1);
    const out = [];
    for (let s = lo; s <= hi; s++) out.push(parsePitch('CDEFGAB'[s % 7] + Math.floor(s / 7)));
    return out;
  }

      passed: new Set(), fails: 0, tries: song.phrases.map(() => 0), take: null, results: [], moveTo: null, keepMic: false, fullRes: null,
