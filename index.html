/* Layout : couverture safran pour l'accueil, chemin de portée qui relie les comptines.
   Chaque comptine tient sur un seul écran comme une double page d'album en papier découpé :
   décor animé à gauche (en haut sur téléphone), pupitre à droite avec la phrase en cours
   mise en avant, et en bas l'écoute du micro. Le décor reste
   toujours visible pendant le jeu. Chaque comptine a sa propre palette (pas de variante
   sombre/claire : un seul univers visuel par page, par choix). */
:root {
  --cover: #F6C744;
  --ink: #1D2350;
  --ink-soft: #464C7C;
  --paper: #FFFBF0;
  --red: #E5484D;
  --font-display: 'Gluten', 'Trebuchet MS', 'Comic Sans MS', cursive;
  --font-text: 'Andika', 'Verdana', 'Segoe UI', sans-serif;
  /* code couleur des notes, le même partout */
  --n-do: #E5484D;
  --n-re: #F2803C;
  --n-mi: #F5C32C;
  --n-fa: #4CAF5A;
  --n-sol: #1FA7A0;
  --n-la: #3E6FD8;
  --n-si: #8B57C9;
  --n-ink-light: #FFFFFF;
  --n-ink-dark: #2A1E06;
  /* tokens de page (accueil) ; chaque monde les redéfinit */
  --bg: var(--cover);
  --panel: #FFFBF0;
  --panel-2: #FFF1D6;
  --text: #1D2350;
  --text-soft: #5A5F86;
  --accent: #D93D43;
  --accent-ink: #FFFFFF;
  --line: rgba(29, 35, 80, 0.16);
  --line-strong: rgba(29, 35, 80, 0.38);
  --frame: #6B3E2E;
  --stage-bg: #F6C744;
  --iris: #F6C744;
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
.nw { white-space: nowrap; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-text);
  font-size: 17px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

/* papier : grain léger posé sur les décors */
.grain::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 2;
  opacity: .2;
  mix-blend-mode: multiply;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .42  0 0 0 0 .36  0 0 0 0 .3  0 0 0 .5 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
.iris { position: fixed; inset: 0; z-index: 60; background: var(--iris); pointer-events: none; }

/* couleurs des notes */
[data-l="C"] { --nc: var(--n-do); --nt: var(--n-ink-light); }
[data-l="D"] { --nc: var(--n-re); --nt: var(--n-ink-dark); }
[data-l="E"] { --nc: var(--n-mi); --nt: var(--n-ink-dark); }
[data-l="F"] { --nc: var(--n-fa); --nt: var(--n-ink-light); }
[data-l="G"] { --nc: var(--n-sol); --nt: var(--n-ink-light); }
[data-l="A"] { --nc: var(--n-la); --nt: var(--n-ink-light); }
[data-l="B"] { --nc: var(--n-si); --nt: var(--n-ink-light); }

/* ================================ ACCUEIL ================================ */
.home { background: var(--cover); color: var(--ink); position: relative; overflow: hidden; min-height: 100%; }
.home.grain::after { opacity: .16; }
.home-in {
  max-width: 1240px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 56px;
  position: relative;
  z-index: 3;
}
.home-head { display: grid; grid-template-columns: minmax(0, 1fr) minmax(240px, 26em); gap: 14px 48px; align-items: end; }
.eyebrow { grid-column: 1 / -1; margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); }
.home-title { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: clamp(52px, 8.4vw, 128px); line-height: .86; letter-spacing: -.01em; color: var(--ink); }
.home-title .w { display: block; width: fit-content; position: relative; white-space: nowrap; }
.home-title .lift { display: inline-block; transform: translate(var(--tx, 0), var(--ty, 0)) rotate(var(--rot, 0deg)); animation: drift 4.5s ease-in-out infinite alternate; animation-delay: var(--dl, 0s); }
.home-title .lift.c1 { --ty: -.06em; --rot: -4deg; --dl: -.4s; }
.home-title .lift.c2 { --ty: -.16em; --rot: 6deg; --dl: -1.2s; color: var(--red); }
.home-title .lift.c3 { --ty: -.3em; --rot: 14deg; --dl: -2s; }
.home-title .flyaway { position: absolute; left: 100%; top: -.05em; margin-left: .06em; display: flex; gap: .06em; }
.home-title .flyaway i { width: .2em; height: .2em; border-radius: 50%; display: inline-block; background: var(--c); animation: drift 3.6s ease-in-out infinite alternate; animation-delay: var(--dl); }
/* le titre chante : chaque lettre joue sa note, et une petite note s'en envole ; les trois petites notes du bout du
   titre (le « Start » du code secret du professeur) sautillent */
.home-title { -webkit-user-select: none; user-select: none; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.home-title .nl { position: relative; cursor: pointer; }
.home-title .nl::after { content: ""; position: absolute; left: 50%; top: 45%; width: .24em; height: .24em; margin: -.12em 0 0 -.12em; border-radius: 50%; background: var(--nc); box-shadow: 0 0 0 .025em var(--ink); opacity: 0; pointer-events: none; }
.home-title .nl.sing::after { animation: nl-fly .9s ease-out; }
@keyframes nl-fly { from { opacity: 1; transform: translate(0, 0) scale(.5); } to { opacity: 0; transform: translate(.3em, -.85em) scale(1); } }
.home-title .flyaway { cursor: pointer; }
.home-title .flyaway::before { content: ""; position: absolute; inset: -.3em -.2em; }
.home-title .flyaway.sing { animation: fly-hop .5s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes fly-hop { 40% { transform: translateY(-.12em) rotate(-6deg); } }
@keyframes drift { from { translate: 0 0; } to { translate: .04em -.12em; } }
.home-lede { margin: 0 0 10px; font-size: clamp(17px, 1.6vw, 20px); max-width: 36em; color: var(--ink); }
.home-lede strong { font-weight: 700; }

.score { position: relative; margin-top: 46px; }
.staff { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: visible; }
.staff .ink { fill: var(--ink); opacity: .82; }
.medals { list-style: none; margin: 0; padding: 30px 0 10px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 44px 18px; position: relative; z-index: 1; }
.medal { display: flex; justify-content: center; }
.medal-link { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: var(--ink); transform: translateY(var(--off, 0px)); border-radius: 24px; outline-offset: 6px; }
.medal-disc { position: relative; width: clamp(104px, 11vw, 140px); aspect-ratio: 1; max-width: 100%; border-radius: 50%; background: var(--c); display: grid; place-items: center; box-shadow: 0 7px 0 rgba(29, 35, 80, .2), 0 16px 28px rgba(29, 35, 80, .2); transition: transform .3s cubic-bezier(.3, 1.5, .5, 1); }
.medal-disc > svg:not(.medal-ring) { width: 64%; height: 64%; }
.medal-ring { position: absolute; inset: -9px; width: calc(100% + 18px); height: calc(100% + 18px); }
.medal-ring .trk { fill: none; stroke: rgba(255, 251, 240, .7); stroke-width: 5; }
.medal.is-won .medal-ring .trk { stroke: var(--ink); }
.medal-num { position: absolute; top: -6px; left: -6px; width: 36px; height: 36px; border-radius: 50%; background: var(--paper); color: var(--ink); font: 800 18px/38px var(--font-display); text-align: center; box-shadow: 0 3px 0 rgba(29, 35, 80, .18); }
.medal-badge { position: absolute; bottom: -6px; right: -10px; display: flex; gap: 1px; padding: 4px 7px; border-radius: 999px; background: var(--paper); box-shadow: 0 3px 0 rgba(29, 35, 80, .18); }
.medal-badge svg { width: 15px; height: 15px; }
.medal-title { margin-top: 16px; padding: 0 10px; border-radius: 10px; background: var(--cover); font-family: var(--font-display); font-weight: 700; font-size: clamp(18px, 1.8vw, 23px); line-height: 1.12; text-align: center; text-wrap: balance; max-width: 12em; }
.medal-meta { margin-top: 4px; padding: 0 8px; border-radius: 8px; background: var(--cover); font-size: 14px; color: var(--ink-soft); text-align: center; }
.medal-link:hover .medal-disc, .medal-link:focus-visible .medal-disc { transform: translateY(-6px) rotate(-3deg) scale(1.04); }
.medal-link:active .medal-disc { transform: translateY(2px) scale(.98); }

.inst-online { margin: 12px 0 0; padding: 10px 14px; border-radius: 14px; background: #FFF3C9; color: var(--ink); font-size: 15px; }
.inst-online a { color: var(--ink); font-weight: 700; }
.home-foot { margin-top: 44px; display: flex; flex-wrap: wrap; gap: 6px 26px; font-size: 15px; }
.home-foot a { color: var(--ink); font-weight: 700; text-decoration-thickness: 2px; text-underline-offset: 3px; }
.home-foot a:hover { color: var(--red); }

/* ================================ COMPTINE ================================ */
:root[data-view="song"], :root[data-view="song"] body, :root[data-view="song"] #app { height: 100%; }
:root[data-view="song"] body { overflow: hidden; }
.song {
  height: 100%;
  display: grid;
  grid-template-columns: minmax(0, 1.08fr) minmax(400px, 1fr);
  grid-template-rows: minmax(0, 1fr) auto;
  grid-template-areas: "stage play" "stage dock";
  background: var(--panel);
  color: var(--text);
}
.stage { grid-area: stage; position: relative; overflow: hidden; background: var(--stage-bg); isolation: isolate; min-height: 0; }
.stage .sc { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.back, .next-song {
  position: absolute; z-index: 4;
  top: calc(14px + env(safe-area-inset-top, 0px));
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 42px; border-radius: 999px;
  background: var(--paper); color: var(--ink);
  text-decoration: none; font-weight: 700; font-size: 15px;
  box-shadow: 0 4px 0 rgba(0, 0, 0, .16);
}
.back { left: max(14px, env(safe-area-inset-left, 0px)); padding: 0 16px 0 10px; }
.next-song { right: 14px; width: 42px; }
.back svg, .next-song svg { width: 22px; height: 22px; }
.back:hover, .next-song:hover { transform: translateY(-1px); }
.stage-title { display: none; position: absolute; z-index: 4; left: max(12px, env(safe-area-inset-left, 0px)); bottom: 10px; max-width: calc(100% - 24px); padding: 6px 12px 7px; border-radius: 14px; background: var(--paper); color: var(--ink); box-shadow: 0 4px 0 rgba(0, 0, 0, .14); }
.stage-title span { display: block; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); }
.stage-title b { display: block; font-family: var(--font-display); font-weight: 800; font-size: 21px; line-height: 1.05; }

.play {
  grid-area: play;
  min-height: 0;
  overflow-y: auto;
  display: flex; flex-direction: column; gap: 14px;
  padding-left: 22px;
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  padding-block: 24px 12px;
}
.play-head .kicker { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text-soft); }
.play-head h1 { margin: 4px 0 0; font-family: var(--font-display); font-weight: 800; font-size: clamp(32px, 3.6vw, 52px); line-height: .98; text-wrap: balance; }
.play-head .instr { margin: 6px 0 0; color: var(--text-soft); font-size: 15px; }

.btn-big {
  display: inline-flex; align-items: center; gap: 10px;
  height: 52px; padding: 0 20px 0 7px;
  border: 0; border-radius: 999px;
  background: var(--accent); color: var(--accent-ink);
  font-weight: 700; font-size: 17px; cursor: pointer; text-decoration: none;
  box-shadow: 0 4px 0 color-mix(in srgb, var(--accent) 62%, #000);
  transition: transform .08s;
}
.btn-big .ic { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--accent-ink) 22%, transparent); }
.btn-big svg, .btn svg { width: 20px; height: 20px; }
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  height: 46px; padding: 0 16px;
  border-radius: 999px; border: 2px solid var(--line-strong);
  background: var(--panel); color: var(--text);
  font-weight: 700; font-size: 15px; cursor: pointer; text-decoration: none;
  transition: transform .08s, background-color .2s;
}
.btn .q { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; border: 2px dashed currentColor; font-size: 14px; }
.btn[aria-pressed="true"] { background: var(--text); color: var(--panel); border-color: var(--text); }
.btn-big:active, .btn:active { transform: translateY(2px); }
.btn:disabled { opacity: .45; cursor: default; }

/* la phrase en cours */
.card { background: var(--panel-2); border-radius: 24px; padding: 14px 16px 18px; display: flex; flex-direction: column; gap: 12px; }
.card-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.strip { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.pill { position: relative; overflow: hidden; width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--line-strong); background: var(--panel); color: var(--text); font-weight: 700; font-size: 14px; cursor: pointer; padding: 0; }
.pill::before { content: ""; position: absolute; inset: 0; background: var(--accent); opacity: .3; transform: translateY(calc((1 - var(--f, 0)) * 100%)); transition: transform .5s cubic-bezier(.3, 1.3, .5, 1); }
.pill.is-done { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.pill.is-done::before { opacity: 0; }
.pill.is-view { box-shadow: 0 0 0 3px var(--panel-2), 0 0 0 5px var(--text); }
.count { margin: 0; font-size: 14px; color: var(--text-soft); font-variant-numeric: tabular-nums; white-space: nowrap; }
.count b { color: var(--text); }
.panel { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.ph-lyric { margin: 0; font-size: 19px; line-height: 1.3; color: var(--text-soft); min-width: 0; }
.syl { border-radius: 5px; transition: background-color .12s, color .12s; }
.syl.is-on { color: var(--text); background: color-mix(in srgb, var(--accent) 24%, transparent); }
.syl.is-cur { color: var(--text); text-decoration: underline wavy var(--accent) 2px; text-underline-offset: 5px; }
.beads { grid-column: 1 / -1; --stp: 8px; --bs: 32px; display: grid; grid-template-columns: var(--cols); gap: 4px; max-width: 760px; }
.bc { position: relative; min-width: 0; height: calc(var(--span) * var(--stp) + var(--bs)); }
.bead {
  position: absolute; left: 0; right: 0;
  top: calc(var(--y) * var(--stp));
  height: var(--bs);
  border-radius: 999px;
  border: 2px dashed var(--line-strong);
  background: transparent;
  color: var(--text-soft);
  font-size: 13px; font-weight: 700; line-height: 1;
  padding: 0; cursor: pointer;
  display: grid; place-items: center;
  transition: top .45s cubic-bezier(.3, 1.5, .5, 1), background-color .25s, transform .12s, box-shadow .2s;
}
.bead > span { position: relative; }
.bead.is-found { border: 0; background: var(--nc); color: var(--nt); box-shadow: 0 2px 0 color-mix(in srgb, var(--nc) 60%, #000); }
.bead.is-given { border: 3px solid var(--nc); background: var(--panel); color: var(--text); }
.bead.low > span::after { content: ""; position: absolute; left: 50%; bottom: -6px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: currentColor; }
.bead.high > span::before { content: ""; position: absolute; left: 50%; top: -6px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: currentColor; }
.bead.is-cursor { animation: cursor-pulse 1.4s ease-in-out infinite; }
.bead.is-cursor:not(.is-given) { border: 3px solid var(--accent); color: var(--accent); background: var(--panel); }
.bead.is-on { transform: scale(1.16); }
.bead.is-on:not(.is-found) { background: var(--accent); color: var(--accent-ink); border-style: solid; border-color: var(--accent); }
.bead.pop { animation: bead-pop .5s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes cursor-pulse { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 50%, transparent); } 50% { box-shadow: 0 0 0 8px color-mix(in srgb, var(--accent) 0%, transparent); } }
@keyframes bead-pop { 0% { transform: scale(.4); } 60% { transform: scale(1.25); } 100% { transform: scale(1); } }

.done-card { display: grid; gap: 12px; padding: 18px 20px 20px; border-radius: 24px; background: var(--panel-2); }
.done-card h2 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: clamp(26px, 3vw, 34px); line-height: 1.05; }
.done-card p { margin: 0; color: var(--text-soft); }
.done-stars { display: flex; gap: 6px; color: var(--text-soft); }
.done-actions { display: flex; flex-wrap: wrap; gap: 10px; }

.play-foot { margin-top: auto; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 14px; }
.play-foot a, .play-foot button { display: inline-flex; align-items: center; gap: 6px; color: var(--text-soft); text-decoration: none; background: none; border: 0; padding: 6px 0; cursor: pointer; font-weight: 700; font-size: 14px; }
.play-foot svg { width: 16px; height: 16px; }
.play-foot a:hover, .play-foot button:hover { color: var(--text); }

/* la consigne (dans le pupitre, en bas : voir _controls.css) */
.hint { min-height: 40px; margin: 0; display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 6px 10px; text-align: center; font-family: var(--font-display); font-weight: 700; font-size: 21px; line-height: 1.1; color: var(--text); }
.hint small { font-family: var(--font-text); font-weight: 400; font-size: 14px; color: var(--text-soft); }
.hint svg { width: 30px; height: 30px; }
.hint.ok { color: var(--accent); }
.hint.pop { animation: hint-pop .35s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes hint-pop { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.nchip { display: inline-grid; place-items: center; min-width: 50px; height: 36px; padding: 0 10px; border-radius: 10px; background: var(--nc, var(--panel)); color: var(--nt, var(--text)); border: 2px solid var(--nc, var(--line-strong)); font-family: var(--font-text); font-weight: 700; font-size: 18px; box-shadow: 0 3px 0 color-mix(in srgb, var(--nc, #888) 60%, #000); }

.heard.is-wrong { animation: wobble .4s; }
.heard.is-good { animation: glow .6s; }
@keyframes wobble { 0%, 100% { translate: 0 0; } 25% { translate: -6px 0; } 75% { translate: 6px 0; } }
@keyframes glow { 0% { filter: brightness(1.5); } 100% { filter: brightness(1); } }

/* la note entendue (au centre du pupitre, pendant le jeu) */
.heard {
  --lvl: 0;
  width: 92px; height: 92px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--nc, var(--panel)); color: var(--nt, var(--text-soft));
  border: 3px dashed var(--line-strong);
  box-shadow: 0 0 0 calc(3px + var(--lvl) * 14px) color-mix(in srgb, var(--nc, var(--accent)) 22%, transparent);
  transition: background-color .15s, box-shadow .08s, opacity .2s;
}
.heard[data-l] { border: 3px solid color-mix(in srgb, var(--nc) 60%, #000); }
.heard.is-wait { opacity: .45; }
.heard-n { font-family: var(--font-display); font-weight: 800; font-size: 27px; line-height: 1; }
.mini { height: 36px; padding: 0 12px; border-radius: 999px; border: 2px solid var(--line-strong); background: var(--panel); color: var(--text); font-weight: 700; font-size: 13px; cursor: pointer; white-space: nowrap; }

.seg { align-self: center; display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--panel); border: 2px solid var(--line); }
.seg button { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border: 0; border-radius: 999px; background: none; color: var(--text-soft); font-weight: 700; font-size: 14px; cursor: pointer; }
.seg button svg { width: 18px; height: 18px; }
.seg button[aria-checked="true"] { background: var(--text); color: var(--panel); }

.flyer { position: fixed; z-index: 45; left: 0; top: 0; width: 28px; height: 28px; margin: -14px 0 0 -14px; border-radius: 50%; background: var(--nc); box-shadow: 0 0 0 3px rgba(255, 255, 255, .85), 0 6px 14px rgba(0, 0, 0, .2); pointer-events: none; }
.confetti { position: fixed; z-index: 44; top: -20px; width: 10px; height: 16px; border-radius: 3px; pointer-events: none; animation: confetti-fall var(--t, 2.6s) cubic-bezier(.3, .1, .7, 1) forwards; }
@keyframes confetti-fall { to { transform: translate(var(--dx, 0px), 110vh) rotate(var(--rot, 540deg)); } }

/* bureau : la carte grandit avec la hauteur de l'écran, et se place au milieu de la colonne (le pupitre est en bas) */
@media (min-width: 900px) {
  .card { padding: clamp(16px, 2.6vh, 28px) clamp(18px, 1.8vw, 28px) clamp(18px, 3vh, 30px); gap: clamp(12px, 2vh, 20px); }
  .play > .card, .play > .done-card { margin-block: auto; }
  .pill { width: clamp(34px, 5.4vh, 50px); height: clamp(34px, 5.4vh, 50px); font-size: clamp(15px, 2vh, 18px); }
  .count { font-size: clamp(15px, 2vh, 18px); }
  .panel { gap: clamp(8px, 1.6vh, 16px); }
  .ph-lyric { font-size: clamp(20px, 3.6vh, 34px); }
  .beads { --stp: clamp(8px, 2vh, 18px); --bs: clamp(34px, 6.4vh, 62px); gap: clamp(4px, .8vh, 8px); }
  .bead { font-size: clamp(13px, 2.2vh, 19px); }
}

/* bureau étroit (tablette à l'horizontale, petit portable) : plus de place pour le jeu */
@media (min-width: 900px) and (max-width: 1180px) {
  .song { grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); }
  .btn-big { height: 46px; font-size: 16px; padding-right: 16px; }
  .btn-big .ic { width: 34px; height: 34px; }
  .btn { height: 42px; padding: 0 12px; font-size: 14px; }
  .btn.icon { width: 42px; padding: 0; justify-content: center; }
  .btn.icon .lbl { display: none; }
}

/* écrans peu hauts : on resserre */
@media (min-width: 900px) and (max-height: 820px) {
  .play { gap: 10px; padding-block: 16px 8px; }
  .play-head h1 { font-size: clamp(28px, 3vw, 40px); }
  .play-head .instr { display: none; }
}

@media (min-width: 900px) and (max-height: 660px) {
  .play { gap: 8px; padding-block: 12px 6px; }
  .play-head .kicker { display: none; }
  .play-head h1 { font-size: clamp(24px, 2.2vw, 30px); }
  .seg button { height: 30px; }
}

/* ---------- téléphone / tablette : un seul écran, empilé ---------- */
@media (max-width: 899px) {
  .song { display: flex; flex-direction: column; }
  .stage { flex: 1 1 0; min-height: 120px; }
  .play { flex: 0 1 auto; gap: 10px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); padding-block: 10px; }
  .play-head, .play-foot { display: none; }
  .stage-title { display: block; }
  .btn-big { height: 46px; font-size: 16px; padding-right: 16px; }
  .btn-big .ic { width: 34px; height: 34px; }
  .btn { height: 42px; padding: 0 12px; font-size: 14px; }
  .btn.icon { width: 42px; padding: 0; justify-content: center; }
  .btn.icon .lbl { display: none; }
  .card { padding: 10px 12px 12px; gap: 8px; border-radius: 20px; }
  .panel { gap: 6px; }
  .ph-lyric { font-size: 17px; }
  .beads { --stp: 6px; --bs: 28px; gap: 3px; }
  .bead { font-size: 12px; }
  .pill { width: 30px; height: 30px; font-size: 13px; }
  .nchip { min-width: 44px; height: 32px; font-size: 16px; }
  .seg button { height: 32px; padding: 0 12px; font-size: 13px; }
  .medals { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 52px 12px; }
  /* sur deux colonnes, la vague des médaillons est adoucie : sinon un titre sur trois lignes passe sous le médaillon suivant */
  .medal-link { transform: translateY(calc(var(--off, 0px) * .45)); }
  .home-head { grid-template-columns: minmax(0, 1fr); }
  .home-title { font-size: clamp(48px, 14.5vw, 96px); }
}
@media (min-width: 700px) and (max-width: 1099px) { .medals { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 380px) {
  .btn-big .lbl { font-size: 15px; }
  .beads { --bs: 26px; }
}

/* après la comptine entière : les phrases à corriger, entourées de rouge */
.pill.is-redo { outline: 3px dashed #E5484D; outline-offset: 2px; }
/* « Régler ma voix » pas encore fait (dans les réglages) : le bouton respire doucement */
.rg-voice.is-ready { color: var(--accent); border-color: var(--accent); animation: mini-ready 1.6s ease-in-out infinite; }
@keyframes mini-ready { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 45%, transparent); } 50% { box-shadow: 0 0 0 7px color-mix(in srgb, var(--accent) 0%, transparent); } }
@media (prefers-reduced-motion: reduce) { .rg-voice.is-ready { animation: none; } }

/* ============ l'élève : la première visite (deux écrans), puis le rappel en haut de l'accueil ============ */
.home-eleve { grid-column: 1 / -1; display: grid; gap: 10px; margin-top: 18px; position: relative; z-index: 2; }
.eleve-card {
  --ec-bg: var(--paper); --ec-ink: var(--ink); --ec-soft: var(--ink-soft); --ec-on: #FFF3C9; --ec-accent: var(--ink);
  position: relative; max-width: 560px; background: var(--ec-bg); color: var(--ec-ink); border-radius: 22px; padding: 10px 14px 10px 10px; box-shadow: 0 6px 0 rgba(29, 35, 80, .12);
}
.ec-sum { display: flex; align-items: center; gap: 12px; }
.ec-pic { flex: none; width: 54px; height: 54px; border-radius: 16px; background: var(--ec-on); display: grid; place-items: center; }
.ec-pic svg { width: 46px; height: 46px; }
.ec-txt { display: grid; gap: 4px; min-width: 0; }
/* le prénom en entier : la ligne passe à la suivante s'il le faut, rien n'est coupé */
.ec-hello { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 21px; line-height: 1.12; overflow-wrap: anywhere; text-wrap: balance; }
.ec-row { margin: 0; display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; }
.ec-inst { font-weight: 700; font-size: 15px; color: var(--ec-soft); }
.ec-edit { flex: none; height: 32px; padding: 0 13px; border-radius: 999px; border: 2px solid var(--ec-accent); background: transparent; color: inherit; font-weight: 700; font-size: 14px; cursor: pointer; }

/* les cartes à dessin des instruments (première visite, réglages d'une comptine) */
.ic-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.ic-card {
  display: grid; justify-items: center; align-content: start; gap: 2px; min-width: 0; min-height: 114px; padding: 10px 4px;
  border: 0; border-radius: 18px; background: #FFFBF0; color: #1D2350; box-shadow: 0 4px 0 rgba(29, 35, 80, .2);
  font: inherit; text-align: center; cursor: pointer; transition: transform .1s, box-shadow .1s;
}
.ic-pic { width: 64px; height: 64px; display: grid; place-items: center; }
.ic-pic svg { width: 100%; height: 100%; }
.ic-card b { font-size: 15.5px; line-height: 1.1; }
.ic-card small { font-size: 12.5px; line-height: 1.1; opacity: .72; }
.ic-card:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(29, 35, 80, .2); }
.ic-card:focus-visible { outline: 3px solid #1D2350; outline-offset: 3px; }
.ic-card[aria-pressed="true"] { box-shadow: 0 0 0 4px #1D2350, 0 4px 0 rgba(29, 35, 80, .2); }
.ic-card.is-picked { animation: ic-pick .34s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes ic-pick { 45% { transform: scale(1.08); } }
@media (hover: hover) { .ic-card:hover { transform: translateY(-2px); } }
@media (min-width: 600px) { .ic-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); } }

/* la première visite : en plein écran sur téléphone, au milieu de la page sur ordinateur */
html.onb-open, html.onb-open body { overflow: hidden; }
.onb {
  --onb-bg: #F6C744; --onb-ink: #1D2350; --onb-title: #1D2350; --onb-soft: rgba(29, 35, 80, .78); --onb-btn: #E5484D; --onb-btn-ink: #FFFFFF; --onb-field: #FFFBF0;
  position: fixed; inset: 0; z-index: 60; display: grid; overflow-y: auto; overscroll-behavior: contain;
  background: var(--onb-bg); color: var(--onb-ink); font-family: var(--font-text);
  animation: onb-in .25s ease-out;
}
.onb.is-out { animation: onb-out .22s ease-in forwards; }
@keyframes onb-in { from { opacity: 0; } }
@keyframes onb-out { to { opacity: 0; } }
.onb-in {
  width: 100%; max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(18px, env(safe-area-inset-right, 0px)) max(28px, env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
}
.onb-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 32px; }
.onb-brand { font-family: var(--font-display); font-weight: 800; font-size: 16px; }
.onb-dots { display: flex; gap: 6px; }
.onb-dots i { width: 10px; height: 10px; border-radius: 6px; background: currentColor; opacity: .25; transition: width .25s, opacity .25s; }
.onb-dots i.on { width: 28px; opacity: 1; }
.onb-step { display: flex; flex-direction: column; gap: 14px; }
.onb-step[hidden] { display: none; }
.onb-t { margin: 8px 0 2px; font-family: var(--font-display); font-weight: 800; font-size: clamp(32px, 7.4vw, 50px); line-height: 1.04; color: var(--onb-title); text-wrap: balance; outline: none; }
.onb-t span { display: block; }
.onb-name { width: 100%; max-width: 520px; height: 64px; padding: 0 20px; border-radius: 20px; border: 3px solid var(--onb-ink); background: var(--onb-field); color: #1D2350; font: 700 26px var(--font-text); }
.onb-name::placeholder { color: rgba(29, 35, 80, .42); }
.onb-name:focus { outline: 4px solid color-mix(in srgb, var(--onb-btn) 55%, transparent); outline-offset: 2px; }
.onb-why, .onb-sub { margin: 0; font-size: 16px; color: var(--onb-soft); }
.onb .btn-big { align-self: flex-start; height: 58px; padding: 0 22px 0 30px; gap: 8px; background: var(--onb-btn); color: var(--onb-btn-ink); font-family: var(--font-display); font-weight: 800; font-size: 21px; box-shadow: 0 5px 0 color-mix(in srgb, var(--onb-btn) 55%, #000); }
.onb .btn-big svg { width: 22px; height: 22px; }
.onb-next { margin-top: 6px; }
.onb-back { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; margin-top: 2px; padding: 8px 4px; border: 0; background: none; color: inherit; font: 700 16px var(--font-text); cursor: pointer; }
.onb-back svg { width: 18px; height: 18px; }
@media (max-width: 599px) {
  .onb .btn-big { align-self: stretch; justify-content: center; }
  .ic-card { min-height: 104px; padding-top: 8px; }
  .ic-pic { width: 56px; height: 56px; }
  .ic-card b { font-size: 14.5px; }
  .eleve-card { padding: 8px 12px 8px 8px; }
  .ec-pic { width: 50px; height: 50px; }
  .ec-pic svg { width: 42px; height: 42px; }
  .ec-hello { font-size: 19px; }
}
/* ordinateur : au milieu de la page, devant l'accueil ou la comptine assombris */
@media (min-width: 900px) and (min-height: 600px) {
  .onb { background: rgba(12, 10, 30, .55); padding: 24px; }
  .onb-in { margin: auto; width: min(820px, 100%); border-radius: 28px; background: var(--onb-bg); padding: 22px 30px 30px; box-shadow: 0 30px 70px rgba(0, 0, 0, .35); }
}

/* texte lu seulement par les lecteurs d'écran */
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* ============ les modes de jeu ============ */
/* Aventure, sur le chemin : une comptine fermée (grisée, un cadenas), la prochaine à jouer (« À toi ! ») */
.medal.is-locked .medal-disc { background: #DCD6C6; box-shadow: 0 7px 0 rgba(29, 35, 80, .12), 0 16px 28px rgba(29, 35, 80, .1); }
.medal.is-locked .medal-disc > svg:not(.medal-ring) { opacity: .26; filter: grayscale(1); }
.medal.is-locked .medal-ring .trk { stroke: rgba(255, 251, 240, .55); stroke-dasharray: 3 9; }
.medal.is-locked .medal-title, .medal.is-locked .medal-meta { opacity: .6; }
.medal-lock { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink); pointer-events: none; }
.medal-lock svg { width: 34%; height: 34%; }
.medal.is-next .medal-disc { animation: medal-next 1.8s ease-in-out infinite; }
@keyframes medal-next {
  0%, 100% { box-shadow: 0 7px 0 rgba(29, 35, 80, .2), 0 16px 28px rgba(29, 35, 80, .2), 0 0 0 0 rgba(229, 72, 77, .5); }
  50% { box-shadow: 0 7px 0 rgba(29, 35, 80, .2), 0 16px 28px rgba(29, 35, 80, .2), 0 0 0 16px rgba(229, 72, 77, 0); }
}
.medal-next { position: absolute; top: -12px; right: -18px; padding: 3px 11px 2px; border-radius: 999px; background: var(--red); color: #FFFFFF; font: 800 15px/1.3 var(--font-display); box-shadow: 0 3px 0 rgba(29, 35, 80, .25); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { .medal.is-next .medal-disc { animation: none; box-shadow: 0 7px 0 rgba(29, 35, 80, .2), 0 0 0 6px rgba(229, 72, 77, .55); } }

/* le rappel de l'accueil : le mode de jeu à côté de l'instrument ; en Défi, le score */
.ec-jeu { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; font-size: 15px; color: var(--ec-soft); }
.ec-jeu svg { width: 17px; height: 17px; }
.ec-defi { margin: 0; font-size: 14px; font-weight: 700; color: var(--ec-soft); }

/* la première visite, troisième écran : le mode de jeu (trois cartes) et, en Défi, l'accord pour le tableau d'honneur */
.jeu-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.jeu-card {
  display: grid; align-content: start; justify-items: start; gap: 6px; min-width: 0; padding: 16px 16px 18px;
  border: 0; border-radius: 20px; background: var(--onb-field, #FFFBF0); color: #1D2350; box-shadow: 0 4px 0 rgba(29, 35, 80, .2);
  font: inherit; text-align: left; cursor: pointer; transition: transform .1s, box-shadow .1s;
}
.jeu-card[aria-checked="true"] { box-shadow: 0 0 0 4px #1D2350, 0 4px 0 rgba(29, 35, 80, .2); }
.jeu-ic { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; background: #FFF3C9; color: #1D2350; }
.jeu-card[aria-checked="true"] .jeu-ic { background: #E5484D; color: #FFFFFF; }
.jeu-ic svg { width: 28px; height: 28px; }
.jeu-card b { display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px 8px; font-family: var(--font-display); font-weight: 800; font-size: 21px; line-height: 1.1; }
.jeu-card b small { font-family: var(--font-text); font-size: 12.5px; font-weight: 700; opacity: .7; }
.jeu-d { font-size: 14.5px; line-height: 1.35; color: rgba(29, 35, 80, .82); }
.jeu-card:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(29, 35, 80, .2); }
.jeu-card:focus-visible { outline: 3px solid #1D2350; outline-offset: 3px; }
@media (hover: hover) { .jeu-card:hover { transform: translateY(-2px); } }
.onb-defi, .rg-defi { display: flex; align-items: flex-start; gap: 10px; max-width: 640px; font-size: 15px; font-weight: 700; line-height: 1.35; cursor: pointer; }
.onb-defi input, .rg-defi input { flex: none; width: 22px; height: 22px; margin: 0; accent-color: #E5484D; }
.onb-defi.is-off, .rg-defi.is-off { cursor: default; font-weight: 400; }
.onb-defi.is-off input, .rg-defi.is-off input { display: none; }
@media (max-width: 599px) {
  .jeu-grid { grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .jeu-card { grid-template-columns: 46px minmax(0, 1fr); column-gap: 12px; row-gap: 2px; align-items: center; padding: 12px 14px; }
  .jeu-ic { grid-row: span 2; align-self: center; }
  .jeu-card b, .jeu-d { grid-column: 2; }
  .jeu-card b { font-size: 19px; }
  .jeu-d { font-size: 14px; }
}

/* Aventure : une comptine pas encore ouverte (touchée sur le chemin, ou ouverte par un lien) */
.locked { min-height: 100dvh; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top, 0px)) 16px 24px; background: var(--bg); color: var(--text); font-family: var(--font-text); }
.lk-card { width: min(560px, 100%); display: grid; justify-items: center; gap: 12px; padding: 30px 24px 26px; border-radius: 28px; background: var(--panel); box-shadow: 0 8px 0 var(--line), 0 24px 50px rgba(0, 0, 0, .12); text-align: center; }
.lk-ic { width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; background: var(--panel-2); color: var(--text); }
.lk-ic svg { width: 40px; height: 40px; }
.lk-k { margin: 4px 0 0; font-size: 13.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--text-soft); }
.lk-t { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: clamp(30px, 6vw, 44px); line-height: 1.05; text-wrap: balance; }
.lk-p { margin: 0; max-width: 30em; font-size: 17px; line-height: 1.45; color: var(--text-soft); }
.lk-act { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: center; margin-top: 6px; }
.lk-back { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; color: var(--text); }
.lk-back svg { width: 18px; height: 18px; }
.lk-free { margin: 12px 0 0; display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; justify-content: center; font-size: 14.5px; color: var(--text-soft); }
.lk-disc { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 999px; border: 2px solid var(--line-strong); background: transparent; color: var(--text); font: 700 14.5px var(--font-text); cursor: pointer; }
.lk-disc svg { width: 17px; height: 17px; }
@media (max-width: 599px) { .lk-act { flex-direction: column; } .lk-go { max-width: 100%; } .lk-go span:last-child { white-space: normal; text-align: left; } }

/* Aventure : la flèche vers la comptine suivante, tant que celle-ci est fermée */
.next-song > span:not([hidden]) { display: grid; place-items: center; }
.next-song.is-locked { color: var(--ink-soft); }
.next-song.is-locked svg { width: 19px; height: 19px; }

/* le tableau d'honneur du Défi, sur l'accueil */
.defi-board { margin-top: 54px; max-width: 760px; padding: 22px 22px 24px; border-radius: 26px; background: var(--paper); box-shadow: 0 6px 0 rgba(29, 35, 80, .12); }
.db-t { margin: 0; display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 800; font-size: clamp(24px, 2.8vw, 32px); line-height: 1.1; }
.db-t svg { flex: none; width: 32px; height: 32px; color: #C8901A; }
.db-sub { margin: 6px 0 14px; font-size: 15px; color: var(--ink-soft); }
.db-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.db-row { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 8px 14px 8px 10px; border-radius: 16px; background: #FFF3C9; }
.db-row:nth-child(n+4) { background: transparent; box-shadow: inset 0 0 0 2px rgba(29, 35, 80, .08); }
.db-row.is-me { box-shadow: inset 0 0 0 3px var(--ink); }
.db-rank { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--paper); font: 800 17px/1 var(--font-display); }
.db-row:nth-child(1) .db-rank { background: #E0A92B; color: #2A1E06; }
.db-row:nth-child(2) .db-rank { background: #B9BCC8; color: #1D2350; }
.db-row:nth-child(3) .db-rank { background: #C9814A; color: #FFFFFF; }
.db-who { display: flex; align-items: baseline; flex-wrap: wrap; gap: 0 8px; min-width: 0; }
.db-name { font-family: var(--font-display); font-weight: 800; font-size: 19px; line-height: 1.15; overflow-wrap: anywhere; }
.db-inst { font-size: 13.5px; color: var(--ink-soft); }
.db-score { display: grid; justify-items: end; font-size: 15px; line-height: 1.15; color: var(--ink-soft); font-variant-numeric: tabular-nums; white-space: nowrap; }
.db-score b { font-family: var(--font-display); font-size: 22px; color: var(--ink); }
.db-score small { font-size: 12.5px; }
.db-empty { margin: 0; font-size: 15.5px; color: var(--ink-soft); }

/* ============ le Défi, sur l'accueil : la course des 20 comptines, dans l'ordre ============
   Une carte de nuit aux reflets dorés, à la place du chemin : la règle, l'étape du moment (son décor, « Commencer »
   ou « Continuer »), la course (cases réussies aux couleurs des décors, la case du moment en or avec l'instrument
   de l'élève pour pion, le drapeau du record), le numéro du départ et le record. */
.dh {
  --dh-ink: #FFF7E6; --dh-soft: rgba(255, 247, 230, .78); --dh-gold: #F6C744; --dh-bg: #1D2350; --dh-cell: rgba(255, 247, 230, .08); --dh-line: rgba(255, 247, 230, .16);
  position: relative; margin-top: 40px; max-width: 980px; padding: 24px 24px 22px; border-radius: 28px;
  background: var(--dh-bg); color: var(--dh-ink); box-shadow: 0 8px 0 rgba(29, 35, 80, .28), 0 22px 40px rgba(29, 35, 80, .22);
}
.dh-head { display: grid; gap: 8px; }
.dh-t { margin: 0; display: flex; align-items: center; gap: 12px; font-family: var(--font-display); font-weight: 800; font-size: clamp(32px, 4.4vw, 48px); line-height: 1; color: var(--dh-gold); }
.dh-t svg { flex: none; width: .95em; height: .95em; }
.dh-rule { margin: 0; max-width: 44em; font-size: 16px; line-height: 1.45; color: var(--dh-soft); }
.dh-msg { margin: 16px 0 0; padding: 9px 14px; border-radius: 14px; font-weight: 700; font-size: 15.5px; }
.dh-msg.is-fail { background: rgba(229, 72, 77, .22); color: #FFC9CB; }
.dh-msg.is-ok { background: rgba(76, 175, 90, .22); color: #BDEFC6; }
.dh-now { margin-top: 18px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 14px 18px; padding: 16px 18px; border-radius: 22px; background: #FFFBF0; color: #1D2350; }
.dh-now.is-fini { background: #FFF3C9; }
.dh-disc { width: 86px; height: 86px; border-radius: 50%; background: var(--c, var(--dh-gold)); display: grid; place-items: center; box-shadow: 0 5px 0 rgba(29, 35, 80, .2); }
.dh-disc > svg { width: 64%; height: 64%; }
.dh-cup { color: #1D2350; }
.dh-cup > svg { width: 54%; height: 54%; }
.dh-k { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #A87410; }
.dh-title { margin: 3px 0 0; font-family: var(--font-display); font-weight: 800; font-size: clamp(23px, 3vw, 32px); line-height: 1.06; text-wrap: balance; }
.dh-meta { margin: 3px 0 0; font-size: 14.5px; color: #464C7C; }
.dh-go { justify-self: end; }
.dh-board { margin-top: 20px; }
.dh-end { margin: 0; display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 13px; letter-spacing: .07em; text-transform: uppercase; color: var(--dh-gold); }
.dh-end svg { width: 17px; height: 17px; }
.dh-start { margin-bottom: 8px; }
.dh-finish { justify-content: flex-end; margin-top: 8px; }
.dh-track { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 8px; }
.dh-case {
  position: relative; aspect-ratio: 1; border-radius: 14px; display: grid; place-items: center;
  background: var(--dh-cell); box-shadow: inset 0 0 0 2px var(--dh-line); color: rgba(255, 247, 230, .55);
  font: 800 clamp(15px, 1.8vw, 20px)/1 var(--font-display);
}
.dh-case.is-done { background: var(--c); color: #1D2350; box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .16); }
.dh-case.is-done.is-dark { color: #FFF7E6; }
.dh-case.is-done .dh-n { display: grid; }
.dh-case.is-done .dh-n svg { width: 22px; height: 22px; }
/* la case du moment : en or, l'instrument de l'élève pour pion, son numéro dans le coin */
.dh-case.is-now { background: var(--dh-gold); color: #1D2350; box-shadow: 0 0 0 4px rgba(246, 199, 68, .32); animation: dh-now 1.8s ease-in-out infinite; }
.dh-case.is-now .dh-n { position: absolute; top: 4px; left: 6px; font-size: 12px; }
@keyframes dh-now { 50% { box-shadow: 0 0 0 10px rgba(246, 199, 68, 0); } }
.dh-pawn { width: 68%; height: 68%; display: grid; place-items: center; filter: drop-shadow(0 2px 1px rgba(0, 0, 0, .3)); }
.dh-pawn svg { width: 100%; height: 100%; }
.dh-rec { position: absolute; top: -9px; right: -7px; width: 22px; height: 22px; color: #E5484D; filter: drop-shadow(0 2px 1px rgba(0, 0, 0, .35)); }
.dh-rec svg { width: 100%; height: 100%; }
.dh-stats { margin: 18px 0 0; display: flex; flex-wrap: wrap; gap: 8px; }
.dh-stats span { padding: 5px 13px; border-radius: 999px; background: rgba(255, 247, 230, .1); font-weight: 700; font-size: 14.5px; }
@media (max-width: 599px) {
  .dh { margin-top: 30px; padding: 18px 14px 16px; border-radius: 24px; }
  .dh-rule { font-size: 15px; }
  .dh-now { grid-template-columns: auto minmax(0, 1fr); padding: 14px; gap: 12px 14px; }
  .dh-disc { width: 64px; height: 64px; }
  .dh-go { grid-column: 1 / -1; justify-self: stretch; justify-content: center; }
  .dh-track { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 7px; }
}
@media (prefers-reduced-motion: reduce) { .dh-case.is-now { animation: none; } }

/* ============ barre du décor : retour, instrument, comptine suivante ============ */
.stage-bar {
  position: absolute; z-index: 4;
  top: calc(14px + env(safe-area-inset-top, 0px));
  left: max(14px, env(safe-area-inset-left, 0px));
  right: max(14px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 10px;
  pointer-events: none;
}
.stage-bar > * { pointer-events: auto; }
.stage-bar .back, .stage-bar .next-song { position: static; flex: none; }
.stage-bar .next-song { margin-left: auto; }
.inst-pill {
  position: relative; display: inline-flex; align-items: center; gap: 6px;
  height: 42px; min-width: 0; padding: 0 32px 0 12px; border-radius: 999px; border: 0;
  background: var(--paper); color: var(--ink); box-shadow: 0 4px 0 rgba(0, 0, 0, .16);
  font: inherit; cursor: pointer;
}
.inst-pill > svg:first-child { width: 20px; height: 20px; flex: none; }
.inst-pill .ip-name { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 10em; }
.inst-pill .ip-slow { display: inline-grid; place-items: center; flex: none; }
.inst-pill .ip-slow[hidden] { display: none; }
.inst-pill .ip-slow svg { width: 22px; height: 22px; }
.inst-pill:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.inst-pill:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0, 0, 0, .16); }
.inst-pill select, .home-select select {
  appearance: none; -webkit-appearance: none;
  border: 0; background: transparent; color: inherit;
  font: inherit; font-weight: 700; cursor: pointer;
  min-width: 0; text-overflow: ellipsis;
}
.inst-pill select { position: absolute; inset: 0; width: 100%; height: 100%; padding: 0; border-radius: 999px; opacity: 0; font-size: 16px; }
.inst-pill select:focus-visible, .home-select select:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.inst-pill .chev, .home-select .chev { position: absolute; right: 10px; top: 50%; width: 18px; height: 18px; margin-top: -9px; pointer-events: none; }
.inst-pill select option, .home-select select option { color: #1D2350; background: #FFFFFF; }

/* ============ le niveau (en haut du pupitre, et dans les réglages) ============ */
.seg .lv { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; font-size: 12px; line-height: 1; background: var(--line); color: inherit; }
.seg button[aria-checked="true"] .lv { background: var(--accent); color: var(--accent-ink); }
.seg .short { display: none; }
/* libellés longs seulement quand la colonne de jeu est assez large */
@media (max-width: 1359px) {
  .seg .long { display: none; }
  .seg .short { display: inline; }
}

/* ============ niveau 2 : décompte, jeu, verdict ============ */
.cin { display: inline-flex; gap: 12px; }
.cin b { display: inline-grid; place-items: center; width: 1.9em; height: 1.9em; border-radius: 50%; border: 2px solid var(--text-soft); color: var(--text); transition: transform .12s, background-color .12s; }
.cin b.past { background: color-mix(in srgb, var(--accent) 32%, transparent); border-color: transparent; }
.cin b.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); transform: scale(1.3); box-shadow: 0 3px 0 color-mix(in srgb, var(--accent) 60%, #000); }
/* départ en levée : le décompte entier ; chaque bulle est la durée de son temps, pleine jusqu'au départ (--f : la part
   comptée), en pointillé après (l'élève joue déjà, sans clic) ; un petit trait au-dessus de la coupure ; la partie en
   pointillé se remplit (--w) pendant que l'élève joue (paintTake, dans app.js) */
.cin b.cut { position: relative; border: 0; background: none; }
.cin b.cut > i { position: absolute; inset: 0; border-radius: 50%; }
.cin b.cut .cg { border: 2px dashed var(--text-soft); opacity: .7; clip-path: inset(0 0 0 calc(var(--f) * 100%)); }
.cin b.cut .cw { opacity: 0; background: color-mix(in srgb, var(--accent) 30%, transparent); clip-path: inset(0 calc((1 - var(--w, 0)) * 100%) 0 calc(var(--f) * 100%)); }
.cin b.cut .cs { border: 2px solid var(--text-soft); clip-path: inset(0 calc((1 - var(--f)) * 100%) 0 0); transition: background-color .12s; }
.cin b.cut .cn { inset: auto; left: calc(var(--f) * 100% - 1px); top: -.42em; width: 2px; height: .3em; border-radius: 1px; background: var(--accent); }
.cin b.cut > span { position: relative; }
.cin b.cut.f0 > span { color: var(--text-soft); opacity: .65; }
.cin b.cut.s-on { transform: scale(1.3); }
.cin b.cut.s-on .cs { background: var(--accent); border-color: var(--accent); }
.cin b.cut.s-on > span { color: var(--accent-ink); text-shadow: 0 1px 2px rgba(0, 0, 0, .5); }
.cin b.cut.s-past .cs { background: color-mix(in srgb, var(--accent) 32%, transparent); border-color: transparent; }
.cin b.cut.g-on { transform: scale(1.12); }
.cin b.cut.g-on .cg, .cin b.cut.g-past .cg { border-color: var(--accent); opacity: 1; }
.cin b.cut.g-on .cw, .cin b.cut.g-past .cw { opacity: 1; }
.cin b.cut.f0.g-on > span, .cin b.cut.f0.g-past > span { color: var(--accent); opacity: 1; }
.hint.go { color: var(--accent); font-size: 26px; }
.card.beat { animation: card-beat .24s ease-out; }
@keyframes card-beat { from { box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 55%, transparent); } to { box-shadow: 0 0 0 0 transparent; } }
.is-taking .strip, .is-taking .inst-pill { opacity: .45; pointer-events: none; }

/* verdict de chaque note : un anneau autour de la perle */
.bead.r-ok, .bead.r-near, .bead.r-far, .bead.r-wrong, .bead.r-miss { outline-offset: 2px; }
.bead.r-ok { outline: 3px solid #2FA35A; }
.bead.r-near { outline: 3px solid #F0A020; }
.bead.r-far { outline: 3px solid #E5484D; }
.bead.r-wrong { outline: 3px dashed #E5484D; }
.bead.r-miss { outline: 3px dotted var(--line-strong); }

/* bande du rythme : un trait par note attendue, un point par note jouée */
.rstrip { grid-column: 1 / -1; position: relative; height: 18px; max-width: 760px; margin-top: -4px; }
.rstrip .rline { position: absolute; left: 0; right: 0; top: 8px; height: 2px; border-radius: 1px; background: var(--line-strong); }
.rstrip .tk { position: absolute; top: 3px; width: 2px; height: 12px; margin-left: -1px; border-radius: 1px; background: var(--text-soft); }
.rstrip .dot { position: absolute; top: 3px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; box-shadow: 0 0 0 2px var(--panel-2); }
.rstrip .dot.ok { background: #2FA35A; }
.rstrip .dot.near { background: #F0A020; }
.rstrip .dot.far { background: #E5484D; }
.rstrip .dot.bad { background: #E5484D; border-radius: 2px; transform: rotate(45deg) scale(.85); }
.rstrip .dot.extra { top: 5px; width: 8px; height: 8px; margin-left: -4px; background: var(--text-soft); }

/* ============ accueil : le record au niveau 2, sous un médaillon ============ */
.medal-r2 { display: inline-flex; align-items: center; gap: 1px; margin-left: 6px; color: #B9800F; font-size: 12px; letter-spacing: -.02em; }
.medal-r2 svg { width: 13px; height: 13px; margin-right: 2px; color: var(--ink-soft); }

/* ============ tailles d'écran ============ */
@media (max-width: 899px) {
  .seg .long { display: none; }
  .seg .short { display: inline; }
  .seg .lv { width: 18px; height: 18px; font-size: 11px; }
  .rstrip { height: 16px; }
  .hint.go { font-size: 22px; }
  .cin { gap: 9px; }
}
@media (max-width: 520px) {
  .stage-bar { gap: 8px; }
  .stage-bar .back { width: 42px; padding: 0; }
  .stage-bar .back span { display: none; }
}
/* Le titre de la comptine : dans le pupitre sur grand écran ; sur téléphone et
   tablette, dans la barre du haut, entre l'instrument et « suivante », pour ne
   rien cacher du décor. */
.stage-bar .stage-title { display: none; }
@media (max-width: 899px) {
  .stage-bar .stage-title {
    display: flex; position: static; flex: 1 1 auto; min-width: 0; max-width: none;
    flex-direction: column; justify-content: center; height: 42px; padding: 0 16px;
    border-radius: 999px; box-shadow: 0 4px 0 rgba(0, 0, 0, .16);
  }
  .stage-bar .stage-title span { font-size: 10px; line-height: 1.1; letter-spacing: .08em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stage-bar .stage-title b { font-size: 16px; line-height: 1.12; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* les mots à trait d'union du titre (span.nw) restent dans la ligne du titre */
  .stage-bar .stage-title b span { display: inline; font: inherit; letter-spacing: normal; text-transform: none; color: inherit; }
  .stage-bar .next-song { margin-left: 0; }
}
/* téléphone : l'instrument garde son nom (court), le titre prend le reste */
@media (max-width: 560px) {
  .inst-pill { flex: none; padding: 0 26px 0 10px; gap: 4px; }
  .inst-pill > svg:first-child { width: 18px; height: 18px; }
  .inst-pill .ip-name { font-size: 14px; max-width: 6.6em; }
  .inst-pill .chev { right: 7px; width: 15px; height: 15px; margin-top: -7.5px; }
  .stage-bar .stage-title { padding: 0 14px; }
  /* téléphone : le titre en entier (sur deux lignes s'il le faut), sans la ligne « Comptine n · niveau » */
  .stage-bar .stage-title > span { display: none; }
  .stage-bar .stage-title b { font-size: 15px; line-height: 1.04; white-space: normal; text-wrap: balance; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; }
}
@media (max-width: 359px) { .stage-bar .stage-title b { font-size: 14px; } .stage-bar .stage-title { padding: 0 11px; } }

/* petits téléphones (iPhone SE…) : on gagne quelques pixels pour garder le décor */
@media (max-width: 899px) and (max-height: 700px) {
  .rstrip { height: 14px; margin-top: -6px; }
  .rstrip .rline { top: 6px; }
  .rstrip .tk, .rstrip .dot { top: 1px; }
  .rstrip .dot.extra { top: 3px; }
}
/* bureau très bas : la bande du rythme se fait discrète */
@media (min-width: 900px) and (max-height: 660px) {
  .rstrip { height: 14px; margin-top: -6px; }
  .rstrip .rline { top: 6px; }
  .rstrip .tk, .rstrip .dot { top: 1px; }
  .rstrip .dot.extra { top: 3px; }
  .card { gap: 8px; padding-top: 10px; padding-bottom: 12px; }
}


/* carte de fin : jouer toute la comptine d'un coup, et son bilan */
.full-ask { margin: 0; font-weight: 700; color: var(--text); }
.full-res { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 12px; border-radius: 14px; background: var(--panel); border: 2px solid var(--line); }
.full-res.is-ok { border-color: #2FA35A; }
.full-res p { margin: 0; flex: 1 1 16em; color: var(--text); }
.full-ph { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 5px; }
.full-ph li { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; font-size: 13px; font-weight: 700; color: #fff; }
.full-ph li.ok { background: #2FA35A; }
.full-ph li.near { background: #F0A020; }
.full-ph li.bad { background: #E5484D; }
@media (max-width: 899px) {
  .done-card { gap: 8px; padding: 12px 14px 14px; }
  .done-card .done-stars svg { width: 30px; height: 30px; }
}

/* carte de fin, compacte : étoiles et titre sur une ligne ; la suite est dans le pupitre (l'autre niveau, rejouer, suivante) */
.done-card { gap: 10px; padding: 14px 18px 16px; }
.done-head { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 12px; }
.done-card h2 { font-size: clamp(22px, 2.1vw, 28px); }
.done-card .done-stars svg { width: 28px; height: 28px; }
@media (max-width: 899px) {
  .done-card h2 { font-size: 20px; }
  .done-card .done-stars svg { width: 24px; height: 24px; }
  .done-card > p { font-size: 15px; }
  .full-res, .full-ask { font-size: 15px; }
}

/* carte de fin affichée : le pied de page s'efface ; s'il manque encore de la place, son message aussi */
.song:has(#done:not([hidden])) .play-foot { display: none; }
.song.tight .done-card > p:not(.done-unlock) { display: none; }
.seg button[aria-pressed="true"] { background: var(--text); color: var(--panel); }
/* diagnostic du micro (?diag) */
.ear-diag { position: fixed; right: 8px; top: calc(76px + env(safe-area-inset-top, 0px)); z-index: 2147483646; max-width: 70vw; padding: 6px 9px; border-radius: 10px; background: rgba(0, 0, 0, .78); color: #fff; font: 11px/1.4 ui-monospace, Menlo, Consolas, monospace; pointer-events: none; }


/* ============ les réglages : le prénom, le mode de jeu, l'instrument (dans une comptine, aussi niveau et vitesse) ============
   Chaque zone garde sa taille quel que soit le choix, et la feuille tient dans l'écran, bouton OK compris : sur
   téléphone, une colonne serrée, en bas de l'écran ; sur un écran large, deux colonnes (à gauche le prénom, le mode,
   le niveau et la vitesse ; à droite l'instrument). Si l'écran reste trop petit : des tailles plus serrées (rg-fit1,
   puis rg-fit2, posées par la page). */
.ec-modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px; background: rgba(12, 10, 30, .55); }
.ec-sheet { width: min(980px, 100%); max-height: calc(100dvh - 32px); overflow-y: auto; border-radius: 24px; background: var(--panel); box-shadow: 0 24px 60px rgba(0, 0, 0, .35); }
.ec-sheet:focus { outline: none; }
.rg-in { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; padding: 16px 20px 18px; color: var(--text); }
.rg-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.rg-title { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: clamp(24px, 3vw, 30px); line-height: 1.05; }
.rg-x { flex: none; width: 42px; height: 42px; margin: -6px -8px -6px 0; border: 0; border-radius: 50%; background: transparent; color: inherit; display: grid; place-items: center; cursor: pointer; }
.rg-x svg { width: 24px; height: 24px; }
.rg-x:hover { background: var(--panel-2); }
.rg-col { display: grid; gap: 14px; align-content: start; min-width: 0; }
.rg-z { display: grid; gap: 6px; min-width: 0; }
.rg-lbl { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-soft); }
.rg-note { margin: 0; font-size: 14px; line-height: 1.35; color: var(--text-soft); }
/* les textes de tous les choix posés au même endroit : la zone a la hauteur du plus long, seul celui du choix se voit */
.rg-stack { display: grid; }
.rg-stack > * { grid-area: 1 / 1; }
.rg-stack > :not(.is-on) { visibility: hidden; }
/* le prénom : l'étiquette à gauche du champ */
.rg-z-name { grid-template-columns: auto minmax(0, 1fr); align-items: center; column-gap: 12px; }
.rg-name { width: 100%; height: 44px; padding: 0 14px; border-radius: 12px; border: 2px solid var(--line-strong); background: var(--panel-2); color: var(--text); font: 700 18px var(--font-text); }
.rg-name::placeholder { color: var(--text-soft); opacity: .75; font-weight: 400; }
.rg-name:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); }
/* le mode de jeu ; la case du tableau d'honneur garde sa place (deux lignes), même quand elle n'a pas lieu d'être */
.rg-seg { display: flex; width: 100%; }
.rg-seg button { flex: 1 1 0; min-width: 0; justify-content: center; gap: 6px; white-space: nowrap; }
.rg-seg button svg { flex: none; width: 20px; height: 20px; }
.rg-defi { max-width: none; min-height: 2.6em; font-size: 14px; line-height: 1.3; }
.rg-defi .defi-ok-t { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.rg-defi input { width: 20px; height: 20px; accent-color: var(--accent); }
.rg-defi.is-gone { visibility: hidden; }
/* le niveau et la vitesse, côte à côte ; grisés en Défi (niveau 2, vitesse normale) */
.rg-z-play { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); column-gap: 10px; }
.rg-pl { display: grid; gap: 6px; min-width: 0; }
.rg-z-play.is-off .seg { opacity: .42; }
.rg-z-play .seg button:disabled { cursor: default; }
.rg-lg { display: none; }
/* l'instrument : 5 colonnes, 3 rangées ; « Régler ma voix » à droite de l'étiquette (la voix seulement) */
.rg-lblrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 32px; }
.rg-voice { height: 32px; padding: 0 12px; gap: 6px; font-size: 13.5px; }
.rg-voice svg { width: 17px; height: 17px; }
.rg-voice.is-gone { visibility: hidden; }
.rg-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); grid-auto-rows: 1fr; gap: 8px; }
.rg-grid .ic-card { min-height: 0; align-content: center; gap: 1px; padding: 7px 3px 6px; border-radius: 14px; box-shadow: 0 0 0 2px rgba(29, 35, 80, .14); }
.rg-grid .ic-card[aria-pressed="true"] { box-shadow: 0 0 0 4px #1D2350; }
.rg-grid .ic-pic { width: 46px; height: 46px; }
.rg-grid .ic-card b { font-size: 13.5px; white-space: nowrap; }
.rg-grid .ic-card small { font-size: 11px; white-space: nowrap; }
.rg-foot { display: flex; justify-content: flex-end; }
.rg-ok { min-width: 160px; justify-content: center; padding: 0 28px; }
/* écran large : deux colonnes */
@media (min-width: 760px) {
  .rg-in { grid-template-columns: minmax(0, .82fr) minmax(0, 1.18fr); grid-template-areas: "head head" "a b" "foot foot"; column-gap: 28px; row-gap: 16px; padding: 20px 24px 22px; }
  .rg-head { grid-area: head; }
  .rg-col-a { grid-area: a; }
  .rg-col-b { grid-area: b; }
  .rg-foot { grid-area: foot; }
  /* le niveau et la vitesse, l'un sous l'autre, avec les noms entiers des niveaux */
  .rg-z-play { grid-template-columns: minmax(0, 1fr); row-gap: 14px; }
  .rg-lg { display: inline; }
  .rg-sh { display: none; }
}
/* téléphone : une colonne, en bas de l'écran, serrée */
@media (max-width: 599px) {
  .ec-modal { place-items: end stretch; padding: 0; }
  .ec-sheet { width: 100%; max-height: 100dvh; border-radius: 22px 22px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
  .rg-in, .rg-col { gap: 12px; }
  .rg-in { padding: 12px 14px 14px; }
  .rg-title { font-size: 24px; }
  .rg-note, .rg-defi { font-size: 13.5px; }
  .rg-seg button { padding: 0 6px; gap: 4px; font-size: 13.5px; }
  .rg-seg button svg { width: 17px; height: 17px; }
  .rg-grid { gap: 5px; }
  .rg-grid .ic-card { padding: 4px 1px 3px; border-radius: 12px; }
  .rg-grid .ic-pic { width: 34px; height: 34px; }
  .rg-grid .ic-card b { font-size: 11px; letter-spacing: -.01em; }
  .rg-grid .ic-card small { font-size: 9.5px; }
  .rg-foot .rg-ok { flex: 1; }
}
/* la feuille dépasse encore de l'écran (petit téléphone, écran couché) : plus serrée */
.rg-fit1 .rg-in, .rg-fit1 .rg-col { gap: 8px; }
.rg-fit1 .rg-in { padding-top: 8px; padding-bottom: 10px; }
.rg-fit1 .rg-z { gap: 4px; }
.rg-fit1 .rg-name { height: 38px; }
.rg-fit1 .seg button { height: 30px; }
.rg-fit1 .rg-grid .ic-pic { width: 28px; height: 28px; }
.rg-fit1 .btn-big.rg-ok { height: 44px; }
.rg-fit2 .rg-title { font-size: 20px; }
.rg-fit2 .rg-x { width: 34px; height: 34px; }
.rg-fit2 .rg-note, .rg-fit2 .rg-defi { font-size: 12.5px; }
.rg-fit2 .rg-grid .ic-pic { width: 22px; height: 22px; }
.rg-fit2 .rg-grid .ic-card b { font-size: 10px; }
.rg-fit2 .rg-grid .ic-card small { font-size: 8.5px; }
.rg-fit2 .btn-big.rg-ok { height: 40px; }

/* ============ le pupitre, en bas : deux étages de taille fixe ============
   En haut, une ligne : le niveau tant qu'aucun essai n'est allé au bout, puis ce que dit la page (consigne, décompte,
   « note n sur N », bilan). En dessous, trois ronds : au centre, le grand rond (« À toi de jouer ! »,
   « Corriger la phrase n », « Rejouer ») devient la note entendue pendant le jeu, avec sa jauge en arc ; de chaque
   côté, un petit rond change de rôle selon le moment : au repos, ce que joue le grand rond (« Phrase n » ou « Toute
   la comptine ») ; pendant le jeu, arrêter, recommencer, jusqu'à la note ; à la fin, l'autre niveau, suivante.
   D'un moment à l'autre, rien ne change de taille ni de place. */
.pupitre {
  --gc: 116px;                      /* le grand rond */
  --gb: calc(var(--gc) + 40px);     /* sa place, avec la jauge */
  --sc: 58px;                       /* les petits ronds */
  --pt: 44px;                       /* la ligne du haut */
  grid-area: dock;
  position: relative; z-index: 3;
  display: grid; grid-template-rows: var(--pt) var(--gb); gap: 6px;
  padding: 10px max(14px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px));
  background: var(--band, color-mix(in srgb, var(--panel) 35%, #FFFFFF));
  border-radius: 26px 26px 0 0;
  box-shadow: 0 -2px 0 var(--line), 0 -10px 26px color-mix(in srgb, var(--text) 7%, transparent);
}
/* univers de nuit : le pupitre reste un peu plus clair que la page */
:root[data-world="lune"], :root[data-world="coucou"] { --band: color-mix(in srgb, var(--panel-2) 90%, #FFFFFF); }

/* la ligne du haut : le niveau, ou ce que dit la page */
.pu-top { display: grid; place-items: center; min-width: 0; }
.pu-top > * { grid-area: 1 / 1; }
.pu-top .seg { width: min(100%, 420px); display: flex; }
.pu-top .seg button { flex: 1 1 0; justify-content: center; min-width: 0; height: calc(var(--pt) - 10px); white-space: nowrap; }
.pu-top .seg button span { overflow: hidden; text-overflow: ellipsis; }
.pu-top .hint { width: 100%; height: var(--pt); min-height: 0; overflow: hidden; font-size: 20px; }
.pu-top .hint.count { overflow: visible; } /* le petit trait du départ en levée, au-dessus des bulles */
.pu-top .hint.long { font-size: 15px; line-height: 1.15; }
.pu-top .hint.go { font-size: 24px; }
.pu-top .hint .nchip { min-width: 42px; height: 30px; font-size: 16px; }
.pu-top .hint svg { width: 26px; height: 26px; }
.pu-top .hint small { font-size: 13px; }
.pu-top .cin b { width: 1.5em; height: 1.5em; }

/* les trois ronds */
.pu-row { display: grid; grid-template-columns: minmax(0, 1fr) var(--gb) minmax(0, 1fr); width: 100%; max-width: 520px; margin: 0 auto; }
.pu-slot, .pu-mid { display: grid; min-width: 0; }
.pu-slot > *, .pu-mid > * { grid-area: 1 / 1; }
.pu-mid { place-items: center; width: var(--gb); height: var(--gb); }
.pu-side {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  height: var(--gb); min-width: 0; padding: calc((var(--gb) - var(--sc)) / 2) 2px 0;
  border: 0; background: none; color: var(--text); text-decoration: none; cursor: pointer;
  font-weight: 700; font-size: 13px; line-height: 1.15;
}
.pu-ic {
  flex: none; display: grid; place-items: center; width: var(--sc); height: var(--sc); border-radius: 50%;
  border: 2px solid var(--line-strong); background: var(--panel); color: var(--text);
  box-shadow: 0 3px 0 var(--line); transition: transform .08s, background-color .15s;
}
.pu-ic svg { width: 22px; height: 22px; }
.pu-lbl { max-width: 7.6em; text-align: center; }
.pu-side:active .pu-ic { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.pu-side.is-on .pu-ic { background: var(--text); color: var(--panel); border-color: var(--text); }
.pu-side:focus-visible { outline: none; }
.pu-side:focus-visible .pu-ic { outline: 3px solid var(--accent); outline-offset: 3px; }
.pu-side .q { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; border: 2px dashed currentColor; font-size: 15px; line-height: 1; }
@media (hover: hover) { .pu-side:hover .pu-ic { background: var(--panel-2); } .pu-side.is-on:hover .pu-ic { background: var(--text); } }
/* au repos, « Phrase n » et « Toute la comptine » : celui qui est choisi prend la couleur du grand rond, qui le jouera */
.pu-pick .pu-ic svg { width: calc(var(--sc) * .52); height: calc(var(--sc) * .52); }
.pu-pick[aria-pressed="false"] .pu-ic { color: var(--text-soft); }
.pu-pick[aria-pressed="false"] .pu-lbl { font-weight: 600; }
.pu-pick[aria-pressed="true"] .pu-ic { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); box-shadow: 0 3px 0 color-mix(in srgb, var(--accent) 62%, #000); }
.pu-pick[aria-pressed="true"]:active .pu-ic { box-shadow: 0 1px 0 color-mix(in srgb, var(--accent) 62%, #000); }

/* le grand rond : « À toi de jouer ! », « Corriger la phrase n », « Rejouer la comptine » */
.pu-go {
  width: var(--gc); height: var(--gc); padding: 0; border: 0; border-radius: 50%;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  background: var(--accent); color: var(--accent-ink); cursor: pointer; text-align: center;
  box-shadow: 0 5px 0 color-mix(in srgb, var(--accent) 62%, #000), 0 0 0 8px color-mix(in srgb, var(--accent) 14%, transparent);
  transition: transform .08s;
}
.pu-go .ic { display: grid; margin-bottom: 2px; }
.pu-go .ic svg { width: calc(var(--gc) * .21); height: calc(var(--gc) * .21); }
.pu-go-t { font-family: var(--font-display); font-weight: 800; font-size: calc(var(--gc) * .17); line-height: 1; }
.pu-go-s { max-width: 86%; font-weight: 700; font-size: calc(var(--gc) * .11); line-height: 1.1; }
.pu-go:active { transform: translateY(3px); box-shadow: 0 2px 0 color-mix(in srgb, var(--accent) 62%, #000), 0 0 0 8px color-mix(in srgb, var(--accent) 14%, transparent); }
.pu-go:focus-visible { outline: 3px solid var(--text); outline-offset: 10px; }
/* « Corriger la phrase n » proposé : le grand rond respire doucement */
.pu-go.is-ready { animation: pu-ready 1.6s ease-in-out infinite; }
@keyframes pu-ready {
  0%, 100% { box-shadow: 0 5px 0 color-mix(in srgb, var(--accent) 62%, #000), 0 0 0 8px color-mix(in srgb, var(--accent) 14%, transparent); }
  50% { box-shadow: 0 5px 0 color-mix(in srgb, var(--accent) 62%, #000), 0 0 0 17px color-mix(in srgb, var(--accent) 0%, transparent); }
}
@media (prefers-reduced-motion: reduce) { .pu-go.is-ready { animation: none; } }

/* pendant le jeu : la note entendue, et la jauge en arc au-dessus (bas, juste, haut) */
.pu-ear { position: relative; width: var(--gb); height: var(--gb); display: grid; place-items: center; }
.pu-gauge { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.pu-gauge .g-trk { fill: none; stroke: var(--line-strong); stroke-width: 5; stroke-linecap: round; }
.pu-gauge .g-ok { fill: none; stroke: #4CAF5A; stroke-width: 9; stroke-linecap: round; opacity: .8; }
.pu-gauge .needle { transform-box: view-box; transform-origin: 50% 50%; transform: rotate(calc(var(--c, 0) * 1.2deg)); transition: transform .12s, opacity .2s; }
.pu-gauge .needle circle { fill: var(--text); stroke: var(--panel); stroke-width: 2.5; }
.pu-gauge .needle.off { opacity: .25; }
.g-lo, .g-hi { position: absolute; top: 31%; font-size: 11px; font-weight: 700; line-height: 1; color: var(--text-soft); }
.g-lo { right: 88%; }
.g-hi { left: 88%; }
.pu-ear .heard {
  width: var(--gc); height: var(--gc); align-content: center; gap: 3px;
  box-shadow: 0 0 0 calc(var(--lvl) * 8px) color-mix(in srgb, var(--nc, var(--accent)) 24%, transparent);
}
.pu-ear .heard-n { font-size: calc(var(--gc) * .3); }
.heard-s { font-size: 13px; font-weight: 700; line-height: 1; }
.heard-s:empty { display: none; }

/* le micro ne marche pas : une bulle au-dessus du pupitre, avec de quoi le rallumer */
.pu-msg {
  position: absolute; left: 12px; right: 12px; bottom: calc(100% + 10px); z-index: 6;
  max-width: 520px; margin: 0 auto;
  display: grid; gap: 10px; justify-items: center; text-align: center;
  padding: 12px 16px 14px; border-radius: 18px;
  background: var(--panel); color: var(--text); border: 2px solid var(--line-strong);
  box-shadow: 0 12px 30px rgba(0, 0, 0, .2); font-size: 15px; line-height: 1.35;
}
.pu-msg p { margin: 0; }
.pu-msg a { font-weight: 700; }
.pu-msg .btn-big { height: 46px; font-size: 16px; padding-right: 18px; }
.pu-msg .btn-big .ic { width: 34px; height: 34px; }


/* téléphone : la phrase et ses perles un peu plus grandes quand l'écran est assez haut */
@media (max-width: 899px) and (min-height: 760px) {
  .card { padding: 14px 16px 16px; gap: 10px; border-radius: 22px; }
  .pill { width: 34px; height: 34px; font-size: 14px; }
  .ph-lyric { font-size: 19px; }
  .beads { --stp: 8px; --bs: 32px; gap: 4px; }
  .bead { font-size: 13px; }
}
/* téléphone peu haut : le pupitre se resserre, le décor garde sa place */
@media (max-width: 899px) and (max-height: 700px) {
  .pupitre { --gc: 96px; --sc: 50px; --pt: 40px; gap: 4px; padding-top: 8px; }
  .pu-top .hint { font-size: 18px; }
  .pu-top .hint.go { font-size: 21px; }
  .pu-side { font-size: 12px; gap: 4px; }
}
@media (max-width: 899px) and (max-height: 580px) {
  .pupitre { --gc: 80px; --sc: 46px; }
}
/* bureau : le pupitre occupe le bas de la colonne de jeu */
@media (min-width: 900px) {
  .pupitre { --gc: 128px; --sc: 62px; --pt: 50px; padding-top: 12px; padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
  .pu-top .hint { font-size: 21px; }
  .pu-side { font-size: 13.5px; }
}
@media (min-width: 900px) and (max-height: 760px) { .pupitre { --gc: 108px; --sc: 54px; --pt: 46px; } }
@media (min-width: 900px) and (max-height: 640px) { .pupitre { --gc: 92px; --sc: 50px; --pt: 42px; padding-top: 8px; } }
/* téléphone à l'horizontale : le décor à gauche, la phrase et le pupitre à droite (comme sur ordinateur) */
@media (max-width: 899px) and (max-height: 500px) and (orientation: landscape) {
  .song { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); grid-template-rows: minmax(0, 1fr) auto; grid-template-areas: "stage play" "stage dock"; }
  .stage { min-height: 0; }
  .play { padding-block: 8px; }
  .stage-bar .back { width: 42px; padding: 0; }
  .stage-bar .back span { display: none; }
  .inst-pill { flex: none; padding: 0 26px 0 10px; gap: 4px; }
  .inst-pill .chev { right: 7px; width: 15px; height: 15px; margin-top: -7.5px; }
  .stage-bar .stage-title { padding: 0 14px; }
  .stage-bar .stage-title > span { display: none; }
  .stage-bar .stage-title b { font-size: 15px; line-height: 1.04; white-space: normal; text-wrap: balance; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; }
  .pupitre { border-radius: 22px 22px 0 0; }
}

/* le Défi, en haut du pupitre (à la place du niveau) : où en est le Défi de cette comptine */
.pu-defi { width: 100%; height: var(--pt); margin: 0; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 6px; font-weight: 700; font-size: 15px; line-height: 1.15; text-align: center; color: var(--text); }
.pu-defi svg { flex: none; width: 22px; height: 22px; color: var(--accent); }
/* fin de comptine, en Aventure : la comptine suivante vient de s'ouvrir */
.done-unlock { display: inline-flex; align-items: center; gap: 8px; margin: 0; padding: 6px 14px; border-radius: 999px; background: var(--panel-2); font-weight: 700; }
.done-unlock svg { flex: none; width: 20px; height: 20px; color: var(--accent); }

/* ================================ DÉCORS ================================ */
.sc .sc-text { font-family: var(--font-display); font-weight: 800; }
.sc .pl { transform: translate(calc(var(--mx2, 0) * var(--d, 0) * 16px), calc(var(--my2, 0) * var(--d, 0) * 9px)); transition: transform .7s cubic-bezier(.2, .7, .2, 1); }
.sc .fl { transition: opacity .6s; }
.sc .fl-in { animation: fl-bob 5s ease-in-out infinite alternate; }
.sc .fl.gone { opacity: 0; }
@keyframes fl-bob { from { transform: translate(-12px, 10px) rotate(-10deg); } to { transform: translate(12px, -14px) rotate(10deg); } }
@keyframes hop { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-34px); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes bob { from { transform: translateY(0); } to { transform: translateY(-14px); } }

/* confiserie */
.sc-bonbons .bb-fill { transform: translateY(calc((1 - var(--p, 0)) * 340px)); transition: transform .9s cubic-bezier(.3, 1.4, .5, 1); }
.sc-bonbons .bb-lolly { transform-box: view-box; animation: sway 4s ease-in-out infinite alternate; }
.sc-bonbons .bb-l1 { transform-origin: 230px 795px; }
.sc-bonbons .bb-l2 { transform-origin: 790px 795px; animation-delay: -2s; }
.sc-bonbons .bb-jar { transform-box: view-box; transform-origin: 500px 790px; }
.react .sc-bonbons .bb-jar { animation: jiggle .5s; }
.sc-bonbons .bb-rain { display: none; }
.is-done .sc-bonbons .bb-rain { display: block; }

/* ---------- analyse : partitions → événements datés ---------- */
const NOTE_PC = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
const NOTE_STEP = { C: 0, D: 1, E: 2, F: 3, G: 4, A: 5, B: 6 };
const NOTE_FR = { C: 'Do', D: 'Ré', E: 'Mi', F: 'Fa', G: 'Sol', A: 'La', B: 'Si' };
const PC_FR = ['Do', 'Do♯', 'Ré', 'Mi♭', 'Mi', 'Fa', 'Fa♯', 'Sol', 'Sol♯', 'La', 'Si♭', 'Si'];
const PC_LETTER = ['C', null, 'D', null, 'E', 'F', null, 'G', null, 'A', null, 'B'];
const DUR = { w: 4, h: 2, q: 1, e: 0.5, s: 0.25 };

function parsePitch(p) {
  const m = /^([A-G])(\d)$/.exec(p);
  if (!m) throw new Error('Hauteur illisible : ' + p);
  const L = m[1], o = +m[2];
  return { name: p, letter: L, fr: NOTE_FR[L], midi: 12 * (o + 1) + NOTE_PC[L], step: o * 7 + NOTE_STEP[L], octave: o };
}

function parseDur(d) {
  const dotted = d.endsWith('.');
  const base = DUR[dotted ? d.slice(0, -1) : d];
  if (base == null) throw new Error('Durée illisible : ' + d);
  return dotted ? base * 1.5 : base;
}

function splitSyllables(text) {
  const words = text.split(' ');
  const out = [];
  words.forEach((w, wi) => {
    const parts = w.split('|');
    parts.forEach((p, pi) => {
      let s = p.replace(/_/g, ' ');
      if (pi === parts.length - 1 && wi < words.length - 1) s += ' ';
      out.push(s);
    });
  });
  return out;
}

function buildSong(src) {
  const song = Object.assign({}, src);
  const beatsPerBar = src.meter[0] * (4 / src.meter[1]);
  song.barBeats = beatsPerBar;
  song.events = [];
  song.notes = [];
  song.phrases = [];
  let t = 0;
  src.phrases.forEach(([text, seq], pi) => {
    const syl = splitSyllables(text);
    const ph = { index: pi, text, syllables: syl, events: [], notes: [], start: t };
    let si = 0;
    seq.trim().split(/\s+/).forEach((tok) => {
      const [p, d] = tok.split('/');
      const dur = parseDur(d);
      const ev = { t, dur, phrase: pi };
      if (p === 'r') {
        ev.rest = true;
      } else {
        Object.assign(ev, parsePitch(p));
        ev.n = song.notes.length;
        ev.syl = syl[si];
        ev.sylIndex = si;
        si++;
        song.notes.push(ev);
        ph.notes.push(ev.n);
      }
      // accent : premier temps de mesure (et 2e pulsation en 6/8)
      const pos = ((t - src.pickup) % beatsPerBar + beatsPerBar) % beatsPerBar;
      ev.accent = pos < 1e-6 ? 1 : (src.meter[1] === 8 && Math.abs(pos - 1.5) < 1e-6 ? 0.6 : 0);
      song.events.push(ev);
      ph.events.push(ev);
      t += dur;
    });
    ph.end = t;
    ph.sylCount = syl.length;
    ph.noteCount = si;
    song.phrases.push(ph);
  });
  song.total = t;
  // la première note de chaque phrase est donnée (mais il faut la jouer)
  song.given = new Set(song.phrases.map((ph) => ph.notes[0]));
  song.minStep = Math.min(...song.notes.map((n) => n.step));
  song.maxStep = Math.max(...song.notes.map((n) => n.step));
  song.minMidi = Math.min(...song.notes.map((n) => n.midi));
  song.maxMidi = Math.max(...song.notes.map((n) => n.midi));
  return song;
}

  /* --- cordes pincées : Karplus-Strong (violon pincé, harpe, guitare…) --- */
  function ksBuffer(v, midi) {
    const key = v.id + ':' + midi;
