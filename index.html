    const rate = ctx.sampleRate, f = hz(midi);
    const N = Math.max(2, Math.round(rate / f - 0.5));
    const fAct = rate / (N + 0.5);
    const len = Math.floor(rate * v.seconds);
    const buf = ctx.createBuffer(1, len, rate);
    const d = buf.getChannelData(0);
    const ring = new Float32Array(N);
    for (let i = 0; i < N; i++) ring[i] = Math.random() * 2 - 1;
    const passes = Math.round((1 - v.bright) * 6);
    for (let p = 0; p < passes; p++) {
      let prev = ring[N - 1];
      for (let i = 0; i < N; i++) { const cur = ring[i]; ring[i] = 0.5 * (cur + prev); prev = cur; }
    }
    let mean = 0;
    for (let i = 0; i < N; i++) mean += ring[i];
    mean /= N;
    for (let i = 0; i < N; i++) ring[i] -= mean;
    let idx = 0, peak = 0;
    for (let i = 0; i < len; i++) {
      const a = ring[idx], b = ring[(idx + 1) % N];
      d[i] = a;
      ring[idx] = v.damp * 0.5 * (a + b);
      idx = (idx + 1) % N;
      const abs = Math.abs(a);
      if (abs > peak) peak = abs;

    for (let i = 0; i < fade; i++) d[len - 1 - i] *= i / fade;
    const k = 1 / (peak || 1);
    for (let i = 0; i < len; i++) d[i] *= k;

  function windNote(v, dest, midi, t, dur, vel) {
    const f = hz(midi);
    let wave = waves.get(v.id);
    if (!wave) {
      const imag = new Float32Array([0].concat(v.wave));
      wave = ctx.createPeriodicWave(new Float32Array(imag.length), imag);
      waves.set(v.id, wave);
    }
    const end = t + Math.max(0.08, dur * 0.93);
    const peak = v.gain * vel;
    const o = ctx.createOscillator();
    o.setPeriodicWave(wave);
    o.frequency.value = f;
    const lfo = ctx.createOscillator();
    lfo.frequency.value = v.vibrato[0];
    const lg = ctx.createGain();
    lg.gain.setValueAtTime(0, t);
    lg.gain.linearRampToValueAtTime(f * v.vibrato[1], t + Math.min(0.35, dur * 0.6) + 0.01);
    lfo.connect(lg);
    lg.connect(o.frequency);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, t + v.attack);
    g.gain.setValueAtTime(peak, end);
    g.gain.setTargetAtTime(0, end, v.release / 3);
    o.connect(g);
    g.connect(dest);
    const n = ctx.createBufferSource();
    n.buffer = noise;
    n.loop = true;
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = f * 2;
    bp.Q.value = 1.2;
    const ng = ctx.createGain();
    ng.gain.setValueAtTime(0, t);
    ng.gain.linearRampToValueAtTime(v.breath * vel, t + 0.02);
    ng.gain.setTargetAtTime(v.breath * 0.3 * vel, t + 0.05, 0.05);
    ng.gain.setTargetAtTime(0, end, 0.03);
    n.connect(bp);
    bp.connect(ng);
    ng.connect(dest);
    const stop = end + 0.4;
    o.start(t); lfo.start(t); n.start(t, Math.random() * 0.5);
    o.stop(stop); lfo.stop(stop); n.stop(stop);
  }

  /* --- instruments tenus de l'élève : flûte, saxophone, cuivres, cordes frottées --- */
  function sustNote(v, dest, midi, t, dur, vel) {
    const f = hz(midi);
    let wave = waves.get(v.id);
    if (!wave) {
      const imag = new Float32Array([0].concat(v.wave));
      wave = ctx.createPeriodicWave(new Float32Array(imag.length), imag);
      waves.set(v.id, wave);
    }
    const end = t + Math.max(0.08, dur * 0.94);
    const peak = v.gain * vel;
    const o = ctx.createOscillator();
    o.setPeriodicWave(wave);
    o.frequency.value = f;
    // vibrato qui arrive après l'attaque
    const lfo = ctx.createOscillator();
    lfo.frequency.value = v.vibrato[0];
    const lg = ctx.createGain();
    const vd = Math.min(v.vibrato[2], dur * 0.5);
    lg.gain.setValueAtTime(0, t);
    lg.gain.setValueAtTime(0, t + vd);
    lg.gain.linearRampToValueAtTime(f * v.vibrato[1], t + vd + 0.25);
    lfo.connect(lg);
    lg.connect(o.frequency);
    // filtre : s'ouvre à l'attaque (éclat des cuivres), plafonné pour les cordes
    const [lp0, lp1, lpT, lpMax = 12000] = v.lp;
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.Q.value = 0.7;
    lp.frequency.setValueAtTime(Math.min(lpMax, f * lp0), t);
    lp.frequency.linearRampToValueAtTime(Math.min(lpMax, f * lp1), t + lpT);
    o.connect(lp);
    let last = lp;
    (v.body || []).forEach(([fr, db]) => {
      const pk = ctx.createBiquadFilter();
      pk.type = 'peaking'; pk.frequency.value = fr; pk.Q.value = 1.1; pk.gain.value = db;
      last.connect(pk); last = pk;
    });
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, t + v.attack);
    g.gain.setValueAtTime(peak, end);
    g.gain.setTargetAtTime(0, end, v.release / 3);
    last.connect(g);
    g.connect(dest);
    // souffle (vents) ou frottement de l'archet (cordes)
    const n = ctx.createBufferSource();
    n.buffer = noise;
    n.loop = true;
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = Math.min(9000, f * v.noise[0]);
    bp.Q.value = v.noise[1];
    const ng = ctx.createGain();
    ng.gain.setValueAtTime(0, t);
    ng.gain.linearRampToValueAtTime(v.breath * vel, t + Math.min(0.03, v.attack));
    ng.gain.setTargetAtTime(v.breath * 0.35 * vel, t + v.attack, 0.06);
    ng.gain.setTargetAtTime(0, end, 0.03);
    n.connect(bp);
    bp.connect(ng);
    ng.connect(dest);
    const stop = end + v.release + 0.4;
    o.start(t); lfo.start(t); n.start(t, Math.random() * 0.5);
    o.stop(stop); lfo.stop(stop); n.stop(stop);
  }

  /* --- accordéon (anches légèrement désaccordées : effet musette) --- */
  function reedNote(v, dest, midi, t, dur, vel) {
    const f = hz(midi);
    const end = t + Math.max(0.08, dur * 0.95);
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = Math.min(v.lp, f * 9);
    lp.Q.value = 0.6;
    const g = ctx.createGain();
    const peak = v.gain * vel;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, t + v.attack);
    g.gain.setValueAtTime(peak, end);
    g.gain.setTargetAtTime(0, end, v.release / 3);
    [-v.detune, 0, v.detune].forEach((c, i) => {
      const o = ctx.createOscillator();
      o.type = i === 1 ? 'square' : 'sawtooth';
      o.frequency.value = f;
      o.detune.value = c;
      const og = ctx.createGain();
      og.gain.value = i === 1 ? 0.32 : 0.6;
      o.connect(og);
      og.connect(lp);
      o.start(t);
      o.stop(end + 0.4);
    });
    lp.connect(g);
    g.connect(dest);
  }

  /* --- sons enregistrés de l'instrument choisi (dossier sons/, chargés à la demande) ---
     Chaque fichier sons/<voix>.js apporte un MP3 où quelques notes du vrai
     instrument sont mises bout à bout (une tous les 2 à 5 demi-tons), avec leur
     hauteur exacte et, pour les sons tenus, une boucle pour durer autant qu'il
     faut. Une note est jouée à partir de l'enregistrement le plus proche, un peu
     accéléré ou ralenti. Tant que le son n'est pas prêt (ou s'il manque, page
     ouverte seule), c'est le timbre synthétisé qui joue. */
  const SAMPLED = {
    piano:    { gain: 0.97, rev: 0.12, ring: 0.18, damp: 0.12 },
    xylo:     { gain: 0.89, rev: 0.1,  ring: 0.12, damp: 0.1 },
    guitar:   { gain: 0.89, rev: 0.14, ring: 0.3,  damp: 0.16 },
    eguitar:  { gain: 0.93, rev: 0.12, ring: 0.3,  damp: 0.14 },
    flute:    { gain: 0.98, rev: 0.14, release: 0.12 },
    clarinet: { gain: 0.91, rev: 0.12, release: 0.1 },
    sax:      { gain: 0.97, rev: 0.1,  release: 0.1 },
    trumpet:  { gain: 1.16, rev: 0.1,  release: 0.1 },
    horn:     { gain: 0.97, rev: 0.12, release: 0.14 },
    trombone: { gain: 1.05, rev: 0.1,  release: 0.12 },
    violin:   { gain: 0.98, rev: 0.12, release: 0.16 },
    viola:    { gain: 0.82, rev: 0.12, release: 0.16 },
    cello:    { gain: 0.92, rev: 0.12, release: 0.18 },
  };
  const packs = new Map(); // voix → { state: loading | data | decoding | ready | error, zones, buffer, delay }
  let sampledVoice = null; // seule la voix de l'instrument choisi joue ses enregistrements
  let dctx = null;

  function receive(p) {
    if (!p || !SAMPLED[p.id]) return;
    const k = Object.assign(packs.get(p.id) || {}, { id: p.id, state: 'data', zones: p.zones.slice().sort((a, b) => a.m - b.m), mark: p.mark, mp3: p.mp3 });
    packs.set(p.id, k);
    decode(k);
  }
  const queued = window.NotesSons;
  window.NotesSons = { push: receive };
  if (Array.isArray(queued)) queued.forEach(receive);

  function loadPack(id) {
    if (!SAMPLED[id] || packs.has(id) || typeof document === 'undefined') return;
    packs.set(id, { id, state: 'loading' });
    const s = document.createElement('script');
    s.src = (window.SONS_BASE || 'sons/') + id + '.js';
    s.async = true;
    s.onerror = () => { const k = packs.get(id); if (k && k.state === 'loading') k.state = 'error'; };
    (document.head || document.documentElement).appendChild(s);
  }

  // décodage sans attendre le premier geste de l'élève (contexte hors ligne)
  function decoder() {
    if (ctx) return ctx;
    if (!dctx) {
      const O = window.OfflineAudioContext || window.webkitOfflineAudioContext;
      try { if (O) dctx = new O(1, 1, 44100); } catch (e) { dctx = null; }
    }
    return dctx;
  }
  function decode(k) {
    const c = decoder();
    if (!c || k.state !== 'data') return;
    k.state = 'decoding';
    let bytes;
    try {
      const bin = atob(k.mp3);
      bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    } catch (e) { k.state = 'error'; return; }
    k.mp3 = null;
    const ok = (buf) => { if (k.state !== 'decoding') return; k.buffer = buf; k.delay = decoderDelay(buf, k.zones, k.mark); k.state = 'ready'; };
    const ko = () => { if (k.state === 'decoding') k.state = 'error'; };
    try {
      const pr = c.decodeAudioData(bytes.buffer, ok, ko);
      if (pr && pr.catch) pr.catch(ko);
    } catch (e) { ko(); }
  }
  /* Le décodeur MP3 décale tout le fichier de quelques millisecondes (25 ms
     environ). Un repère (une seule impulsion, dans le silence du début) donne
     ce décalage à l'échantillon près ; à défaut, on retrouve l'attaque de chaque
     note (même mesure qu'à la fabrication : enveloppe sur 3 ms, -38 dB sous la
     crête) et on garde l'écart médian. */
  function decoderDelay(buf, zones, mark) {
    const d = buf.getChannelData(0), sr = buf.sampleRate, h = Math.max(1, Math.round(sr * 0.0015));
    if (mark != null) {
      let best = 0, at = -1;
      const end = Math.min(d.length, Math.floor((mark + 0.065) * sr));
      for (let i = 0; i < end; i++) if (Math.abs(d[i]) > best) { best = Math.abs(d[i]); at = i; }
      if (best > 0.05) {
        // sommet entre deux échantillons (parabole)
        let f = 0;
        if (at > 0 && at < d.length - 1) {
          const a = Math.abs(d[at - 1]), b = best, c = Math.abs(d[at + 1]), den = a - 2 * b + c;
          if (den < 0) f = 0.5 * (a - c) / den;
        }
        return Math.max(-0.02, Math.min(0.08, (at + f) / sr - mark));
      }
    }
    const ds = [];
    zones.forEach((z) => {
      const a = Math.max(0, Math.floor((z.s - 0.03) * sr)), b = Math.min(d.length, Math.floor((z.s + z.n) * sr));
      if (b - a < 4 * h) return;
      // énergie sur une fenêtre de 3 ms centrée (sommes cumulées)
      const lo = Math.max(0, a - h), hi = Math.min(d.length, b + h + 1);
      const P = new Float64Array(hi - lo + 1);
      for (let i = lo; i < hi; i++) P[i - lo + 1] = P[i - lo] + d[i] * d[i];
      const en = (i) => P[Math.min(hi, i + h + 1) - lo] - P[Math.max(lo, i - h) - lo];
      let mx = 0;
      for (let i = a; i < b; i++) mx = Math.max(mx, en(i));
      const thr = mx * Math.pow(10, -38 / 10); // -38 dB sous la crête
      let i0 = a;
      while (i0 < b && en(i0) <= thr) i0++;
      if (i0 < b) ds.push(i0 / sr - (z.s + z.r));
    });
    if (!ds.length) return 0;
    ds.sort((x, y) => x - y);
    return Math.max(-0.02, Math.min(0.08, ds[ds.length >> 1]));
  }
  const packReady = (id) => {
    const k = id === sampledVoice ? packs.get(id) : null;
    return k && k.state === 'ready' ? k : null;
  };

  function smpNote(k, dest, midi, t, dur, vel) {
    const P = SAMPLED[k.id];
    let z = k.zones[0];
    for (const c of k.zones) if (Math.abs(c.m - midi) < Math.abs(z.m - midi)) z = c;
    const rate = Math.pow(2, (midi - z.m) / 12);
    const src = ctx.createBufferSource();
    src.buffer = k.buffer;
    src.playbackRate.value = rate;
    const off = Math.max(0, z.s + k.delay);
    // attaque lente (archet, souffle) : la note part un peu avant, pour être entendue sur le temps ;
    // si c'est déjà passé (touche frappée à l'instant), on saute le début de l'attaque
    let ts = t - (z.a || 0) / rate, skip = 0;
    const now = ctx.currentTime;
    if (ts < now) { skip = (now - ts) * rate; ts = now; }
    const g = ctx.createGain();
    const peak = P.gain * vel;
    g.gain.setValueAtTime(peak, ts);
    let stop;
    if (z.l) {
      // son tenu : la boucle prend le relais après l'attaque, puis on relâche
      src.loop = true;
      src.loopStart = off + z.l[0];
      src.loopEnd = off + z.l[1];
      const end = t + Math.max(0.08, dur * 0.94);
      g.gain.setValueAtTime(peak, end);
      g.gain.setTargetAtTime(0, end, P.release / 3);
      stop = end + P.release * 2.5 + 0.05;
    } else {
      // son frappé : il s'éteint tout seul, on l'étouffe un peu après la fin de la note
      const dampAt = t + Math.max(dur, 0.1) + P.ring;
      g.gain.setValueAtTime(peak, dampAt);
      g.gain.setTargetAtTime(0, dampAt, P.damp);
      stop = Math.min(ts + (z.n - skip - 0.005) / rate, dampAt + P.damp * 7); // jamais au-delà de sa note dans le MP3
    }
    src.connect(g);
    g.connect(dest);
    src.start(ts, off + skip);
    src.stop(Math.max(ts + 0.05, stop));
  }

  let lastVoice = null;
  function note(voiceId, dest, midi, t, dur, vel) {
    const v = voiceOf(voiceId);
    lastVoice = v.id;
    const m = midi + transpose;
    mark(v, m, t, dur, dest);
    const k = ctx && packReady(v.id);
    if (k) smpNote(k, dest, m, t, dur, vel);
    else if (v.kind === 'add') addNote(v, dest, m, t, dur, vel);
    else if (v.kind === 'ks') ksNote(v, dest, m, t, dur, vel);
    else if (v.kind === 'wind') windNote(v, dest, m, t, dur, vel);
    else if (v.kind === 'sust') sustNote(v, dest, m, t, dur, vel);
    else reedNote(v, dest, m, t, dur, vel);
  }

  /* Une note isolée (lame du xylophone, perle touchée) */
  function tap(voiceId, midi, dur = 0.55) {
    if (!ensure()) return;
    const key = voiceId + (packReady(voiceId) ? ':enr' : '');
    let b = tapBuses.get(key);
    if (!b) { b = makeBus(voiceOf(voiceId)); tapBuses.set(key, b); }
    note(voiceId, b, midi, ctx.currentTime + 0.008, dur, 1);
  }

  /* Une suite de notes datées en secondes ; renvoie de quoi l'arrêter */
  function sequence(voiceId, items, lead = 0.08) {
    if (!ensure()) return null;
    const bus = makeBus(voiceOf(voiceId));
    const t0 = ctx.currentTime + lead;
    items.forEach((it) => note(voiceId, bus, it.midi, t0 + it.start, it.dur, it.vel));
    return {
      t0,
      stop() {
        const now = ctx.currentTime;
        bus.gain.cancelScheduledValues(now);
        bus.gain.setValueAtTime(bus.gain.value, now);
        bus.gain.linearRampToValueAtTime(0, now + 0.06);
        quietUntil = Math.min(quietUntil, now + 0.45);
        recent.forEach((r) => { if (r.bus === bus) { r.until = r.start > now ? 0 : Math.min(r.until, now + 0.3); r.end = Math.min(r.end, now + 0.06); } });
        setTimeout(() => { try { bus.disconnect(); } catch (e) { /* déjà débranché */ } }, 250);
      },
    };
  }

  /* Pulsation du décompte : un « toc » de bois, bruit filtré sans hauteur
     nette (le micro ne le prend pas pour une note, et il ne coupe pas l'écoute) */
  let clickBuf = null;
  function clickAt(t, accent) {
    if (!ensure()) return null;
    if (!clickBuf) {
      const n = Math.floor(ctx.sampleRate * 0.05);
      clickBuf = ctx.createBuffer(1, n, ctx.sampleRate);
      const d = clickBuf.getChannelData(0);
      let seed = 3;
      for (let i = 0; i < n; i++) {
        seed = (seed * 16807) % 2147483647;
        d[i] = ((seed / 2147483647) * 2 - 1) * Math.pow(1 - i / n, 5);
      }
    }
    const src = ctx.createBufferSource();
    src.buffer = clickBuf;
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = accent ? 2400 : 1600;
    bp.Q.value = 1.4;
    const g = ctx.createGain();
    g.gain.value = accent ? 2.6 : 1.8;
    src.connect(bp); bp.connect(g); g.connect(master);
    src.start(Math.max(t, ctx.currentTime));
    return src;
  }

  /* Petite fanfare de fin : Do Mi Sol Do */
  function flourish(voiceId) {
    return sequence(voiceId, [60, 64, 67, 72].map((m, i) => ({ midi: m, start: i * 0.11, dur: i === 3 ? 0.6 : 0.16, vel: 0.8 })));
  }

  return {
    ensure, tap, sequence, flourish, clickAt,
    now: () => (ctx ? ctx.currentTime : 0),
    // délai entre l'instant programmé et le son dans le haut-parleur
    outLatency: () => (ctx ? (ctx.outputLatency || 0) + (ctx.baseLatency || 0) : 0),
    quietAt: () => quietUntil,
    ringing, EARLY,
    lastConcert: () => lastConcert,
    lastVoice: () => lastVoice,
    hasVoice: (id) => !!VOICES[id],
    setTranspose: (n) => { transpose = n | 0; },
    // l'instrument choisi joue avec ses enregistrements (chargés à la demande) ; null : timbres synthétisés
    useSamples: (id) => { sampledVoice = SAMPLED[id] ? id : null; if (sampledVoice) loadPack(id); },
    samplesState: (id) => { const k = packs.get(id); return k ? k.state : 'none'; },
    samplesInfo: (id) => { const k = packs.get(id); return k ? { state: k.state, delay: k.delay, zones: k.zones, rate: k.buffer && k.buffer.sampleRate } : null; },
    available: !!AC,
  };
})();

/* Modèles par défaut des noms de notes chantés (la voix) : le timbre (MFCC) des syllabes do ré mi fa sol

/* ------------------------------------------------------------------
   L'oreille : écoute un instrument réel au micro et reconnaît les notes
   - détection de hauteur par l'algorithme YIN (de Cheveigné & Kawahara)
   - suivi des notes : une note est « jouée » quand sa hauteur reste stable
     ~90 ms ; une note répétée est reconnue à sa nouvelle attaque
     (creux puis remontée du volume) ou après un court silence.
   - pendant que la page joue elle-même de la musique, l'écoute est coupée
     pour ne pas confondre le haut-parleur avec l'instrument (en tenant
     compte du retard du haut-parleur, grand sur les téléphones).
   - le son du micro est recueilli dans le fil audio (AudioWorklet), morceau
     par morceau, avec l'instant exact de chaque morceau : même quand la page
     est occupée (décor 3D, téléphone lent), aucune trame n'est perdue et
     l'instant de chaque note reste juste. Sans AudioWorklet, on lit le son
     toutes les 28 ms (AnalyserNode), comme avant.
------------------------------------------------------------------- */
const PitchKit = (() => {
  const FMIN = 50, FMAX = 2800, TH = 0.15;
  let dp = null;

  /* Renvoie { f, clarity } ou null si le son n'a pas de hauteur nette.
     prefer : nom de la note attendue (0 = do … 11 = si) ou null. Quand plusieurs notes sonnent
     ensemble (la précédente résonne encore : pédale, pièce qui résonne), la période commune de
     l'accord l'emporte souvent (Do + Mi → Do deux octaves plus bas). Si la note attendue est
     nettement présente, on la garde, à condition qu'elle ne soit pas qu'un sous-multiple d'une
     note plus aiguë jouée seule (jouer Sol4 quand on attend Do3 reste un Sol). */
  function yin(x, sr, fmin = FMIN, fmax = FMAX, prefer = null) {
    const N = x.length, W = Math.floor(N / 2);
    const tauMin = Math.max(2, Math.floor(sr / fmax));
    const tauMax = Math.min(W - 2, Math.ceil(sr / fmin));
    if (!dp || dp.length < tauMax + 2) dp = new Float32Array(tauMax + 2);
    dp[0] = 1;
    let sum = 0, best = -1, last = tauMax, done = 0;
    for (let tau = 1; tau <= tauMax; tau++) {
      let s = 0;
      for (let j = 0; j < W; j++) { const d = x[j] - x[j + tau]; s += d * d; }
      sum += s;
      dp[tau] = sum > 0 ? (s * tau) / sum : 1;
      done = tau;
      // premier minimum local sous le seuil
      if (tau - 1 > tauMin && dp[tau - 1] < TH && dp[tau] >= dp[tau - 1]) { best = tau - 1; last = tau; break; }
    }
    // la suite de la courbe, si on doit chercher la note attendue plus loin
    const finish = () => {
      for (let tau = done + 1; tau <= tauMax; tau++) {
        let s = 0;
        for (let j = 0; j < W; j++) { const d = x[j] - x[j + tau]; s += d * d; }
        sum += s;
        dp[tau] = sum > 0 ? (s * tau) / sum : 1;
      }
      done = tauMax;
    };
    if (best < 0) {
      let mv = 1;
      for (let tau = tauMin + 1; tau < tauMax; tau++) if (dp[tau] < mv) { mv = dp[tau]; best = tau; }
      if (best < 0 || mv > 0.28) best = -1;
    }
    const pcOf = (f) => ((Math.round(69 + 12 * Math.log2(f / 440)) % 12) + 12) % 12;
    if (prefer != null && (best < 0 || pcOf(sr / best) !== prefer)) {
      finish();
      const alt = preferred(sr, tauMin, tauMax, prefer, pcOf);
      if (alt) { best = alt; last = tauMax; }
    }
    if (best < 0) return null;
    let t = best;
    if (best > 1 && best + 1 <= last) {
      const a = dp[best - 1], b = dp[best], c = dp[best + 1];
      const den = a - 2 * b + c;
      if (den > 1e-9) t = best + (0.5 * (a - c)) / den;
    }
    let f = sr / t;
    // lames de métallophone, glockenspiel, cloches : harmoniques non alignées,
    // on affine sur le pic du spectre autour de la fondamentale trouvée
    if (f > 300) f = refine(x, sr, f);
    return { f, clarity: 1 - dp[best] };
  }

  // la période de la note attendue (à n'importe quelle octave), si elle est nettement présente
  const PREFER_DP = 0.3;
  function preferred(sr, tauMin, tauMax, pc, pcOf) {
    let pick = -1, pv = 1;
    for (let m = 36; m <= 108; m++) {
      if (((m % 12) + 12) % 12 !== pc) continue;
      const tc = sr / (440 * Math.pow(2, (m - 69) / 12));
      const a = Math.max(tauMin + 1, Math.floor(tc * 0.97)), b = Math.min(tauMax - 1, Math.ceil(tc * 1.03));
      if (a > b) continue;
      let lt = -1, lv = 1;
      for (let tau = a; tau <= b; tau++) if (dp[tau] < lv && dp[tau] <= dp[tau - 1] && dp[tau] <= dp[tau + 1]) { lv = dp[tau]; lt = tau; }
      if (lt < 0 || lv > PREFER_DP) continue;
      // pas un multiple de la période d'une autre note, plus aiguë et au moins aussi nette :
      // c'est alors cette note-là qui sonne (Sol4 joué seul est aussi périodique sur 3 ou 7 de ses périodes)
      let sub = false;
      for (let tau = tauMin + 1; tau < lt * 0.92; tau++) {
        if (dp[tau] < lv + 0.12 && dp[tau] <= dp[tau - 1] && dp[tau] <= dp[tau + 1] && pcOf(sr / tau) !== pc) { sub = true; break; }
      }
      if (sub) continue;
      // la plus aiguë des octaves qui conviennent (les plus graves en sont des multiples)
      if (pick < 0 || lt < pick) { pick = lt; pv = lv; }
    }
    return pick > 0 ? pick : null;
  }

  let hann = null;
  const SPAN = 80, STEP = 10;
  function refine(x, sr, f0) {
    const N = x.length;
    if (!hann || hann.length !== N) {
      hann = new Float32Array(N);
      for (let i = 0; i < N; i++) hann[i] = 0.5 - 0.5 * Math.cos((2 * Math.PI * i) / (N - 1));
    }
    const pw = [];
    for (let c = -SPAN; c <= SPAN; c += STEP) {
      const w = (2 * Math.PI * f0 * Math.pow(2, c / 1200)) / sr, k = 2 * Math.cos(w);
      let s1 = 0, s2 = 0;
      for (let i = 0; i < N; i++) { const s = x[i] * hann[i] + k * s1 - s2; s2 = s1; s1 = s; }
      pw.push(Math.max(1e-12, s1 * s1 + s2 * s2 - k * s1 * s2));
    }
    let b = 0;
    for (let i = 1; i < pw.length; i++) if (pw[i] > pw[b]) b = i;
    let off = 0;
    if (b > 0 && b < pw.length - 1) {
      const l = Math.log(pw[b - 1]), m = Math.log(pw[b]), r = Math.log(pw[b + 1]);
      const den = l - 2 * m + r;
      if (den < 0) off = (0.5 * (l - r)) / den;
    } else return f0; // pic au bord : on garde l'estimation de départ
    return f0 * Math.pow(2, (-SPAN + (b + off) * STEP) / 1200);
  }

  /* Suivi des notes. push() renvoie une note jouée { r, cents, f, t } ou null ;
     t = instant de la première trame de la note (pour juger le rythme).
     T.ring = { pcs, body } : ce que la page fait encore entendre. Tant qu'une
     note de la page n'est pas finie (body), et ensuite sur les hauteurs qui
     résonnent encore (pcs), seule une vraie attaque compte : le volume monte
     nettement au-dessus de ce qu'on entendait juste avant. Le haut-parleur
     qui s'éteint, ou le mélange de deux notes, ne passent pas pour une note. */
  function makeTracker() {
    /* voice : on chante les noms des notes. Une note reprise à la même hauteur (« sol sol », « mi mi ») passe
       alors toujours par une consonne : un trou dans la hauteur (s, f) ou un creux du volume (m, l, d, r).
       Seuls ces deux signes comptent, et pas avant 0,18 s : dans « mi » ou « ré », la voyelle qui suit la
       consonne, déjà chantée à la bonne hauteur, fait remonter le volume sans être une nouvelle note. */
    const T = { cand: null, held: null, silent: 0, tune: 0, expectPc: null, expectPcs: null, ring: null, hist: [], voice: false };
    const ATK = 2, HIST = 10;
    const remember = (rms) => { T.hist.push(rms); if (T.hist.length > HIST) T.hist.shift(); };
    // on : instant d'une attaque entendue dans cette trame (ou null)
    T.push = (res, rms, gate, now = 0, on = null) => {
      if (on != null) T.on = on;
      const floor = T.hist.length ? Math.min(...T.hist) : 0;
      remember(rms);
      // attaque : le volume dépasse nettement le plus faible des ~280 ms précédentes
      const rise = rms > floor * ATK && rms > gate * 1.3;
      if (res && res.f >= FMIN && res.f <= FMAX) {
        const m = 69 + 12 * Math.log2(res.f / 440) - T.tune / 100;
        const r = Math.round(m), cents = (m - r) * 100;
        T.silent = 0;
        // même nom de note, même à l'octave près : le micro d'un téléphone rend mal les graves,
        // et la hauteur saute parfois d'une octave d'une trame à l'autre (seul le nom compte)
        if (T.cand && (((T.cand.r - r) % 12) + 12) % 12 === 0) {
          T.cand.n++; T.cand.c = T.cand.c * 0.6 + cents * 0.4;
          if (rise) T.cand.atk = true;
        } else T.cand = { r, n: 1, c: cents, t: now, atk: rise };
        const pc = ((r % 12) + 12) % 12;
        // 3 trames pour une note attendue (la prochaine, ou l'une des suivantes quand on chante en rythme), 5 sinon
        const need = !T.expectPcs || T.expectPcs.includes(pc) ? 3 : 5;
        if (T.cand.n < need) return null;
        const masked = T.ring && !T.cand.atk && (T.ring.body || T.ring.pcs.has(pc));
        if (masked && (!T.held || T.held.pc !== pc)) T.held = { pc, peak: rms, min: rms, armed: false, ring: true };
        const h = T.held;
        if (!h || h.pc !== pc) {
          // la voix : le volume des trames de la note déjà entendues sert de référence au creux de la consonne
          // suivante (une note chantée brève n'a parfois qu'une ou deux trames après celle-ci)
          T.held = { pc, r, peak: rms, min: rms, armed: false, t0: T.cand.t, lv: T.voice ? T.hist.slice(-Math.min(T.cand.n, 6)) : undefined };
          T.on = null; // l'attaque de cette note-ci
          return { r, cents: T.cand.c, f: res.f, t: T.cand.t };
        }
        if (h.ring && !masked && T.cand.atk) {
          // l'instrument attaque par-dessus ce que la page fait encore résonner
          T.held = { pc, r, peak: rms, min: rms, armed: false };
          return { r, cents: T.cand.c, f: res.f, t: now };
        }
        h.peak = Math.max(h.peak, rms);
        if (h.r == null) h.r = r;
        const k = h.lv || (h.lv = []), L = k.length;
        // Même nom de note, autre octave (Pomme de reinette : Sol3 Sol4 Sol3 Sol4). C'est une nouvelle note
        // si la nouvelle octave tient 3 trames de suite ET que le volume est remonté au passage (une attaque).
        // Un micro de téléphone qui hésite entre deux octaves sur une même note tenue, lui, alterne d'une
        // trame à l'autre, ou glisse vers l'octave pendant que le son décroît : ni l'un ni l'autre ne compte.
        if (r !== h.r) {
          if (!h.oct || h.oct.r !== r) h.oct = { r, n: 0, t: now, lo: L ? Math.min(...k.slice(-3)) : rms, atk: false };
          h.oct.n++;
          if ((rms > h.oct.lo * 1.2 || (T.on != null && T.on >= h.oct.t - 0.06)) && rms > gate * 1.3) h.oct.atk = true;
          if (h.oct.n >= 3 && h.oct.atk) {
            const t0 = h.oct.t;
            T.held = { pc, r, peak: rms, min: rms, armed: false, t0 };
            T.on = null;
            return { r, cents: T.cand.c, f: res.f, t: t0 };
          }
          k.push(rms); if (k.length > 9) k.shift();
          return null;
        }
        h.oct = null;
        // Une remontée du volume ne compte qu'une fois confirmée sur les 2 trames suivantes (même hauteur,
        // même octave, volume toujours haut) : à la première trame d'une NOUVELLE note, la fenêtre d'analyse
        // entend encore surtout la note d'avant, avec un volume qui monte. Sans cette attente, la fin d'une
        // note longue de piano suivie d'une autre note passait pour la même note rejouée (« note en trop »).
        if (h.re) {
          if (h.r === r && rms > h.re.base * h.re.k) {
            if (++h.re.n >= 2) {
              const t0 = h.re.t;
              if (T.voice && h.t0 != null && t0 - h.t0 < 0.18) { h.re = null; k.push(rms); if (k.length > 9) k.shift(); return null; }
              T.held = { pc, r, peak: rms, min: rms, armed: false, t0, lv: T.voice ? T.hist.slice(-3) : undefined };
              T.on = null;
              return { r, cents: T.cand.c, f: res.f, t: t0 };
            }
          } else h.re = null;
        }
        if (!h.re && h.r === r) {
          // piano, xylophone… : le son ne fait que décroître (au moins 5 trames, ~140 ms) ; s'il remonte
          // nettement d'un coup, c'est peut-être la même note frappée de nouveau, même si elle résonne encore
          let run = 0;
          for (let q = L - 2; q > 0 && k[q - 1] > k[q] * 1.005; q--) run++;
          const lo = L >= 2 ? Math.min(k[L - 2], k[L - 1]) : 0;
          const restrike = !T.voice && !h.ring && run >= 5 && rms > lo * 1.3 && rms > gate * 1.3;
          // flûte, voix… : un creux puis une remontée (coup de langue, nouvelle attaque)
          // la voix : un vrai creux (la consonne entre deux syllabes, ~10 dB sous le volume des trames juste
          // avant), pas l'ondulation du vibrato ni la voyelle tenue plus doucement que l'attaque
          const ref = T.voice ? (L ? Math.max(...k.slice(-6)) : rms) : h.peak;
          if (!h.armed && rms < ref * (T.voice ? 0.3 : 0.55)) { h.armed = true; h.min = rms; }
          if (h.armed) h.min = Math.min(h.min, rms);
          // la voix, consonne voisée (« do do », « ré ré ») : le volume ne baisse parfois que de 6 dB ; ce petit creux
          // compte s'il est suivi d'une vraie attaque, entendue à l'instant (l'énergie fait presque doubler d'un coup),
          // et seulement quand la même note est attendue de nouveau (une voyelle tenue n'est pas coupée en deux)
          if (T.voice && !h.soft && rms < ref * 0.5) { h.soft = true; h.smin = rms; }
          if (h.soft) h.smin = Math.min(h.smin, rms);
          const dip = h.armed && rms > h.min * (T.voice ? 2.5 : 1.8) && rms > gate * 1.3;
          const soft = T.voice && !dip && h.soft && T.expectPc === pc && T.on != null && now - T.on < 0.075 && (h.t0 == null || T.on > h.t0 + 0.15) && rms > h.smin * 1.8 && rms > gate * 1.3;
          // une attaque entendue à l'instant (même hauteur juste après) : la même note, jouée de nouveau
          // Si c'est justement cette note qui est attendue de nouveau (Sol Sol Sol Sol), l'attaque suffit,
          // même plus douce que la précédente (le volume peut ne pas monter : l'étouffoir du piano coupe
          // la note d'avant au moment où la nouvelle commence) ; sinon le volume doit monter de 10 %.
          const onT = !T.voice && T.on != null && now - T.on < 0.075 && !h.ring && (h.t0 == null || T.on > h.t0 + 0.06) ? T.on : null;
          if (onT != null) { h.re = { t: onT, base: L ? k[L - 1] : rms, n: 0, k: T.expectPc === pc ? 0.75 : 1.1 }; T.on = null; }
          else if (restrike || dip) h.re = { t: now, base: restrike ? lo : h.min, n: 0, k: 1.15 };
          else if (soft) { h.re = { t: T.on, base: h.smin, n: 0, k: 1.15 }; T.on = null; }
        } else if (!h.re) {
          if (!h.armed && rms < (T.voice && L ? Math.max(...k.slice(-6)) * 0.3 : h.peak * 0.55)) { h.armed = true; h.min = rms; }
          if (h.armed) h.min = Math.min(h.min, rms);
          if (T.voice && L && !h.soft && rms < Math.max(...k.slice(-6)) * 0.5) { h.soft = true; h.smin = rms; }
          if (h.soft) h.smin = Math.min(h.smin, rms);
        }
        k.push(rms); if (k.length > 9) k.shift();
        return null;
      }
      T.silent++;
      const h = T.held;
      if (h) {
        // la voix : une trame sans hauteur pendant qu'une reprise se confirme (la voyelle qui s'installe) ne l'annule pas
        if (T.voice && h.re && !h.re.miss) h.re.miss = true; else h.re = null;
        const ref = T.voice && h.lv && h.lv.length ? Math.max(...h.lv.slice(-6)) : h.peak;
        if (!h.armed && rms < ref * (T.voice ? 0.3 : 0.55)) { h.armed = true; h.min = rms; }
        else if (h.armed) h.min = Math.min(h.min, rms);
        if (T.voice && !h.soft && rms < ref * 0.5) { h.soft = true; h.smin = rms; }
        else if (h.soft) h.smin = Math.min(h.smin, rms);
      }
      // la voix : une voyelle tenue perd parfois sa hauteur deux ou trois trames (souffle) ; la note continue
      if (T.silent >= (T.voice ? 5 : 3)) { T.held = null; T.cand = null; }
      return null;
    };
    T.hold = (pc, rms) => { remember(rms); T.held = pc == null ? null : { pc, peak: rms, min: rms, armed: false }; T.cand = null; T.silent = 0; };
    T.nudge = (cents) => { T.tune = Math.max(-45, Math.min(45, T.tune + cents * 0.3)); };
    return T;
  }

  /* Attaques. Une note rejouée (Sol Sol Sol Sol de « À la pêche aux moules ») a la même hauteur que
     la précédente : seule l'attaque la trahit. L'énergie est suivie par tranches de 128 échantillons,
     sur une fenêtre glissante de 1024 (~21 ms, plus longue que la période des notes graves) :
     - une attaque fait plus que doubler (×1,8) l'énergie par rapport aux 21 à 45 ms précédentes ;
     - ou bien les aigus (coup du marteau, de la baguette, coup de langue) triplent, le volume montant un peu.
     Un son qui décroît ne monte jamais ; un trémolo monte trop lentement. Une attaque au plus par 60 ms.
     feed(x, gate) reçoit les échantillons arrivés depuis l'appel précédent et renvoie, en secondes avant
     la fin de x, l'instant de la première attaque trouvée (ou null). */
  function makeOnset(sr) {
    const B = 128, WIN = 8, LAG0 = 8, LAG1 = 16;
    const e = [], h = [], W = [], WH = [];
    let carry = new Float32Array(0), prev = 0, pos = 0, last = -1e9;
    return function feed(x, gate) {
      let buf = x;
      if (carry.length) { buf = new Float32Array(carry.length + x.length); buf.set(carry); buf.set(x, carry.length); }
      const g2 = gate * gate * WIN;
      let found = null, b = 0;
      for (; b + B <= buf.length; b += B) {
        let se = 0, sh = 0;
        for (let i = b; i < b + B; i++) { const v = buf[i], d = v - prev; se += v * v; sh += d * d; prev = v; }
        e.push(se / B); h.push(sh / B);
        if (e.length > WIN) { e.shift(); h.shift(); }
        let w = 0, wh = 0;
        for (let i = 0; i < e.length; i++) { w += e[i]; wh += h[i]; }
        W.push(w); WH.push(wh);
        if (W.length > LAG1 + 1) { W.shift(); WH.shift(); }
        pos += B;
        const n = W.length;
        if (n <= LAG1 || pos - last < 0.06 * sr) continue;
        let ref = Infinity, refH = Infinity;
        for (let i = n - 1 - LAG1; i <= n - 1 - LAG0; i++) { if (W[i] < ref) ref = W[i]; if (WH[i] < refH) refH = WH[i]; }
        const rise = w > ref * 1.8 && w > g2;
        const click = wh > refH * 3 && w > ref * 1.15 && w > g2;
        if (rise || click) { last = pos; if (found == null) found = (buf.length - (b + B)) / sr; }
      }
      carry = buf.slice(b);
      if (found != null) found += carry.length / sr;
      return found;
    };
  }

  /* Seuil d'écoute et bruit de fond. Un micro de téléphone, sans gain automatique,
     rend un piano à 1 m vers −50 à −65 dB : le seuil suit le bruit de fond mesuré
     (3 fois au-dessus) et ne descend pas sous −70 dB. */
  const GATE_MIN = 0.0003, NF0 = 0.001; // NF0 : bruit de fond supposé au départ (seuil −50 dB), vite corrigé
  const gateOf = (nf) => Math.max(GATE_MIN, nf * 3);
  // bruit de fond : suivi sur les trames sans hauteur (vite vers le bas, lentement vers le haut)
  const floorOf = (nf, rms) => (rms < nf ? nf * 0.9 + rms * 0.1 : Math.min(0.05, nf * 0.997 + rms * 0.003));

  /* ---------- Les noms de notes chantés (la voix) ----------
     Chaque syllabe (do, ré, mi, fa, sol, la, si) est résumée par son timbre : les MFCC (enveloppe du
     spectre sur l'échelle des mels), toutes les 20 ms, du dernier creux d'énergie dans les 0,15 s qui
     précèdent le début de la note chantée jusqu'à 0,35 s après (ou la note suivante) : la consonne
     d'attaque (d, r, m, f, s, l) puis la voyelle tenue (o, é, i, a). On la compare à des modèles par
     alignement souple (DTW, qui tolère qu'on chante plus vite ou plus lentement).
     Les modèles par défaut viennent d'une cinquantaine de voix de synthèse neuronales (Kokoro) chantées à hauteur fixe ;
     ceux de l'élève (« Régler ma voix ») s'y ajoutent, et rendent la reconnaissance bien plus sûre. */
  const SYL = ['do', 're', 'mi', 'fa', 'sol', 'la', 'si'];
  const SYL_PC = { 0: 'do', 2: 're', 4: 'mi', 5: 'fa', 7: 'sol', 9: 'la', 11: 'si' };
  const SYL_PRE = 0.15, SYL_POST = 0.35;
  const NFFT = 2048, NB = 24, NC = 12;
  let fRe = null, fIm = null;
  function power(w) { // spectre de puissance (FFT radix 2 sur NFFT points)
    if (!fRe) { fRe = new Float64Array(NFFT); fIm = new Float64Array(NFFT); }
    const re = fRe, im = fIm, N = NFFT;
    re.fill(0); im.fill(0); re.set(w);
    for (let i = 1, j = 0; i < N; i++) {
      let bit = N >> 1;
      for (; j & bit; bit >>= 1) j ^= bit;
      j ^= bit;
      if (i < j) { const t = re[i]; re[i] = re[j]; re[j] = t; }
    }
    for (let len = 2; len <= N; len <<= 1) {
      const a = (-2 * Math.PI) / len, wr = Math.cos(a), wi = Math.sin(a), h = len >> 1;
      for (let i = 0; i < N; i += len) {
        let cr = 1, ci = 0;
        for (let k = 0; k < h; k++) {
          const p = i + k, q = p + h;
          const vr = re[q] * cr - im[q] * ci, vi = re[q] * ci + im[q] * cr;
          re[q] = re[p] - vr; im[q] = im[p] - vi; re[p] += vr; im[p] += vi;
          const t = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = t;
        }
      }
    }
    const P = new Float64Array(N / 2);
    for (let i = 0; i < N / 2; i++) P[i] = re[i] * re[i] + im[i] * im[i];
    return P;
  }
  // warp : le banc de filtres glissé en fréquence (×warp), pour une voix au conduit vocal plus court ou plus long
  const banks = {};
  function melBank(sr, warp = 1) {
    const key = sr + ':' + warp;
    if (banks[key]) return banks[key];
    const mel = (f) => 2595 * Math.log10(1 + f / 700), imel = (m) => 700 * (Math.pow(10, m / 2595) - 1);
    const lo = mel(80 * warp), hi = mel(7000 * warp), bin = sr / NFFT;
    const edges = Array.from({ length: NB + 2 }, (_, i) => imel(lo + ((hi - lo) * i) / (NB + 1)));
    const f = [];
    for (let b = 0; b < NB; b++) {
      const a = edges[b], c = edges[b + 1], d = edges[b + 2], w = [];
      for (let k = Math.floor(a / bin); k <= Math.ceil(d / bin) && k < NFFT / 2; k++) {
        const fk = k * bin, g = fk < c ? (fk - a) / (c - a) : (d - fk) / (d - c);
        if (g > 0) w.push([k, g]);
      }
      f.push(w);
    }
    return (banks[key] = { sr, f });
  }
  // MFCC de x[from…to[ : un tableau de trames (Float32Array de NC coefficients), fenêtres de 25 ms toutes les 20 ms
  function mfcc(x, sr, from, to, warp = 1) {
    const win = Math.round(0.025 * sr), hop = Math.round(0.02 * sr), B = melBank(sr, warp).f, out = [];
    const w = new Float64Array(Math.min(win, NFFT)), e = new Float64Array(NB);
    for (let s = Math.max(1, from); s + w.length <= Math.min(x.length, to); s += hop) {
      for (let i = 0; i < w.length; i++) w[i] = (x[s + i] - 0.97 * x[s + i - 1]) * (0.54 - 0.46 * Math.cos((2 * Math.PI * i) / (w.length - 1)));
      const P = power(w);
      for (let b = 0; b < NB; b++) { let sum = 0; for (const [k, g] of B[b]) sum += g * P[k]; e[b] = Math.log(sum + 1e-10); }
      const c = new Float32Array(NC);
      for (let k = 1; k <= NC; k++) {
        let s2 = 0;
        for (let b = 0; b < NB; b++) s2 += e[b] * Math.cos((Math.PI * k * (b + 0.5)) / NB);
        c[k - 1] = s2 * (1 + 6 * Math.sin((Math.PI * k) / 12));
      }
      out.push(c);
    }
    return out;
  }
  // distance moyenne le long du meilleur alignement (bande de ±50 %)
  function dtw(A, Bq) {
    const n = A.length, m = Bq.length;
    if (!n || !m) return Infinity;
    const band = Math.ceil(Math.max(n, m) / 2) + Math.abs(n - m);
    let prev = new Float64Array(m + 1).fill(Infinity), cur = new Float64Array(m + 1);
    prev[0] = 0;
    for (let i = 1; i <= n; i++) {
      cur.fill(Infinity);
      const a = A[i - 1];
      for (let j = Math.max(1, i - band); j <= Math.min(m, i + band); j++) {
        const b = Bq[j - 1];
        let s = 0;
        for (let k = 0; k < NC; k++) { const d = a[k] - b[k]; s += d * d; }
        cur[j] = Math.sqrt(s) + Math.min(prev[j - 1], prev[j], cur[j - 1]);
      }
      const t = prev; prev = cur; cur = t;
    }
    return prev[m] / (n + m);
  }
  /* seqs : la syllabe chantée, telle quelle puis vue par des bancs de filtres glissés (sylSeqs) ; models : les
     modèles par défaut { do: [séquence, …], … }, comparés à toutes ces vues (des voix de toutes tailles) ;
     mine : ceux de l'élève (« Régler ma voix »), comparés à la syllabe telle quelle. → { best, d: { do: distance, … } } */
  function nearest(seqs, models, mine) {
    if (seqs && seqs.length && !Array.isArray(seqs[0])) seqs = [seqs]; // une seule séquence
    const d = {};
    let best = null;
    for (const s of SYL) {
      let v = Infinity;
      for (const t of (models && models[s]) || []) for (const q of seqs) v = Math.min(v, dtw(q, t));
      for (const t of (mine && mine[s]) || []) v = Math.min(v, dtw(seqs[0], t));
      d[s] = v;
      if (best == null || v < d[best]) best = s;
    }
    return { best, d };
  }
  /* La syllabe chantée est-elle le nom attendu ? 'oui', 'non' (un autre nom, nettement plus proche)
     ou null (on ne sait pas : on ne pénalise pas l'élève pour une hésitation de la reconnaissance). */
  function sayMatch(syl, want, strict) {
    if (!syl || !want || !isFinite(syl.d[want])) return null;
    if (syl.best === want) return 'oui';
    return syl.d[want] > syl.d[syl.best] * (strict ? 1.2 : 1.3) ? 'non' : null;
  }
  // modèles rangés en texte (base64 d'entiers sur 8 bits, une échelle commune)
  function packModels(models) {
    let mx = 1e-6;
    for (const s of SYL) for (const t of models[s] || []) for (const c of t) for (const v of c) mx = Math.max(mx, Math.abs(v));
    const sc = mx / 127, m = {};
    for (const s of SYL) {
      m[s] = (models[s] || []).map((t) => {
        const b = new Uint8Array(t.length * NC);
        t.forEach((c, i) => c.forEach((v, k) => { b[i * NC + k] = (Math.max(-127, Math.min(127, Math.round(v / sc))) + 256) % 256; }));
        let str = ''; for (const x of b) str += String.fromCharCode(x);
        return btoa(str);
      });
    }
    return { s: +sc.toPrecision(5), m };
  }
  function unpackModels(p) {
    const out = {};
    for (const s of SYL) {
      out[s] = ((p.m && p.m[s]) || []).map((str) => {
        const raw = atob(str), n = raw.length / NC, t = [];
        for (let i = 0; i < n; i++) { const c = new Float32Array(NC); for (let k = 0; k < NC; k++) { const v = raw.charCodeAt(i * NC + k); c[k] = (v > 127 ? v - 256 : v) * p.s; } t.push(c); }
        return t;
      });
    }
    return out;
  }

  /* La fenêtre de la syllabe d'une note commencée à « on » (s) ; prev : début de la note d'avant (ou -1),
     next : début de la note suivante si elle est déjà là. Pas trop loin avant : la fin de la note précédente
     n'est pas la consonne de celle-ci ; et pas au-delà de la note suivante (notes brèves). */
  function sylWindow(on, prev, next) {
    const pre = Math.max(0.05, Math.min(SYL_PRE, prev >= 0 ? on - prev - 0.12 : SYL_PRE));
    return [on - pre, next != null ? Math.max(on + 0.1, Math.min(on + SYL_POST, next - 0.02)) : on + SYL_POST];
  }
  /* Les MFCC de la syllabe d'une note commencée à l'échantillon « on », dans la fenêtre [a, b[ :
     on laisse de côté ce qui précède le dernier creux d'énergie avant la note (le silence, ou la fin
     de la note d'avant quand on enchaîne), pour garder la consonne d'attaque et la voyelle. */
  function sylSeq(x, sr, a, on, b, warp = 1) {
    a = Math.max(1, a); on = Math.max(a, Math.min(on, x.length));
    const hop = Math.round(0.01 * sr), E = [];
    for (let s = a; s + hop <= on; s += hop) { let e = 0; for (let i = s; i < s + hop; i++) e += x[i] * x[i]; E.push(e); }

})();

const Ear = (() => {
  const FRAME_MS = 28, N = 2048;
  const S = {
    on: false, stream: null, nodes: [], an: null, buf: null, timer: 0, sr: 48000, nf: PitchKit.NF0, gated: false, lastUi: 0, T: PitchKit.makeTracker(),
    mode: '', ring: null, fill: 0, tok: 0, onset: null,
    // la voix : historique du son (1,5 s), notes en attente de leur syllabe, modèles des syllabes
    hist: null, hw: 0, ht: 0, wait: [], voice: null, lastOn: -1,
    // pour le diagnostic (?diag) : traitements du micro, trames par seconde, retard du traitement
    dg: { proc: null, frames: 0, since: 0, fps: 0, lag: 0, lagMax: 0, rms: 0, f: 0 },
  };

  const WORKLET = `class NeEar extends AudioWorkletProcessor {
  constructor(o) { super(); this.hop = o.processorOptions.hop; this.b = new Float32Array(this.hop); this.n = 0; }

    const ch = inputs[0] && inputs[0][0];
    if (!ch) return true;
    for (let i = 0; i < ch.length;) {
      const k = Math.min(ch.length - i, this.hop - this.n);
      this.b.set(ch.subarray(i, i + k), this.n);
      this.n += k; i += k;
      if (this.n === this.hop) {
        this.port.postMessage({ x: this.b, t: currentTime + i / sampleRate }, [this.b.buffer]);

  function sample(t0, t1) { // le son entre deux instants, pris dans l'historique

  }

/* ------------------------------------------------------------------
   Le rythme : compare une phrase jouée à la phrase attendue
   - les notes jouées sont associées aux notes attendues dans l'ordre
     (programmation dynamique : hauteur + écart de temps, notes oubliées
     ou en trop permises) ;
   - on retire le décalage d'ensemble (latence du son ou du micro, départ
     un peu tardif) et, sur les phrases assez longues, le tempo réellement
     tenu s'il reste proche du décompte (± 12 %) : un léger ralenti régulier
     ne fait pas « tomber » toutes les notes de la fin ;
   - écarts exprimés en pulsations : ≤ 0,25 en place, ≤ 0,45 un peu tôt ou
     un peu tard, au-delà nettement en avance ou en retard ;
   - indulgence qui grandit avec la longueur : sur une longue phrase, une
     note nettement à côté est pardonnée ; sur toute une comptine, quelques
     fausses notes aussi.
------------------------------------------------------------------- */
const Rhythm = (() => {
  const OK = 0.25, NEAR = 0.45;

  const median = (a) => {
    const s = [...a].sort((x, y) => x - y), n = s.length;
    return n ? (n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2) : 0;
  };

  // exp, got : [{ t (secondes) , … }] ; same(e, g) : bonne hauteur ?
  // modèle de temps : une note attendue à t doit sonner à off + k·t
  function align(exp, got, same, off, k, win) {
    const n = exp.length, m = got.length;
    // une fausse note coûte plus qu'un écart de temps, même grand :
    // on associe d'abord les bonnes hauteurs, dans l'ordre
    const MISS = 1.5, EXTRA = 1.1, WRONG = 2.2;
    const D = Array.from({ length: n + 1 }, () => new Float64Array(m + 1));
    const B = Array.from({ length: n + 1 }, () => new Int8Array(m + 1));
    for (let i = 1; i <= n; i++) { D[i][0] = i * MISS; B[i][0] = 1; }
    for (let j = 1; j <= m; j++) { D[0][j] = j * EXTRA; B[0][j] = 2; }
    for (let i = 1; i <= n; i++) {
      for (let j = 1; j <= m; j++) {
        const dt = (got[j - 1].t - off - k * exp[i - 1].t) / win;
        let best = D[i - 1][j - 1] + (same(exp[i - 1], got[j - 1]) ? 0 : WRONG) + Math.min(2, dt * dt), b = 0;
        if (D[i - 1][j] + MISS < best) { best = D[i - 1][j] + MISS; b = 1; }
        if (D[i][j - 1] + EXTRA < best) { best = D[i][j - 1] + EXTRA; b = 2; }
        D[i][j] = best; B[i][j] = b;
      }
    }
    const pairs = new Array(n).fill(-1), extra = [];
    let i = n, j = m;
    while (i > 0 || j > 0) {
      const b = B[i][j];
      if (b === 0 && i > 0 && j > 0) { pairs[i - 1] = j - 1; i--; j--; } else if (b === 1) i--; else { extra.push(j - 1); j--; }
    }
    return { pairs, extra: extra.reverse() };
  }

  /* exp : notes attendues { t } (t en secondes, la première à 0)
     got : notes jouées { t } (même origine : l'instant où la phrase devait commencer)
     beat : durée d'une pulsation (s) ; same(e, g) : la hauteur est-elle juste ?
     mic : notes venues du micro (une note répétée peut lui échapper) */
  function evaluate({ exp, got, beat, same, mic = false }) {
    const n = exp.length;
    const win = Math.max(0.12, beat * 0.5);
    let off = got.length && same(exp[0], got[0]) && Math.abs(got[0].t) < beat * 1.5 ? got[0].t : 0;
    let k = 1, raw = 1;
    let A = align(exp, got, same, off, k, win);
    const rightPairs = () => A.pairs.map((j, i) => [i, j]).filter(([i, j]) => j >= 0 && same(exp[i], got[j]));
    let rp = rightPairs();
    if (rp.length) { off = median(rp.map(([i, j]) => got[j].t - exp[i].t)); A = align(exp, got, same, off, k, win); rp = rightPairs(); }
    // tempo réellement tenu (phrases assez longues seulement : sinon on effacerait les erreurs de rythme)
    for (let it = 0; it < 2 && rp.length >= 5; it++) {
      const xs = rp.map(([i]) => exp[i].t), ys = rp.map(([, j]) => got[j].t);
      const mx = xs.reduce((a, v) => a + v, 0) / xs.length, my = ys.reduce((a, v) => a + v, 0) / ys.length;
      let sxy = 0, sxx = 0;
      xs.forEach((x, q) => { sxy += (x - mx) * (ys[q] - my); sxx += (x - mx) * (x - mx); });
      if (sxx < (3 * beat) * (3 * beat)) break;
      raw = sxy / sxx;
      k = Math.max(0.88, Math.min(1.12, raw));
      off = median(rp.map(([i, j]) => got[j].t - k * exp[i].t));
      A = align(exp, got, same, off, k, win);
      rp = rightPairs();
    }

    // au micro, une « note en trop » collée à une note jouée (moins de 90 ms, plus court que la plus
    // brève note des comptines) est la même attaque entendue deux fois, pas une note jouée
    let dup = 0;
    if (mic && A.extra.length) {
      const played = A.pairs.filter((j) => j >= 0).map((j) => got[j].t);
      const kept = A.extra.filter((j) => !played.some((t) => Math.abs(got[j].t - t) < 0.09));
      dup = A.extra.length - kept.length;
      A = { pairs: A.pairs, extra: kept };
    }

    const notes = exp.map((e, i) => {
      const j = A.pairs[i];
      if (j < 0) return { i, kind: 'missed' };
      const g = got[j];
      const dev = (g.t - off - k * e.t) / beat;
      const a = Math.abs(dev);
      const timing = a <= OK ? 'ok' : a <= NEAR ? (dev < 0 ? 'early' : 'late') : (dev < 0 ? 'early!' : 'late!');
      return { i, j, kind: same(e, g) ? 'right' : 'wrong', dev, timing };
    });
    const right = notes.filter((x) => x.kind === 'right');
    const missed = notes.filter((x) => x.kind === 'missed').length;
    const wrong = n - right.length - missed;
    const inPlace = right.filter((x) => x.timing === 'ok').length;
    const farOff = right.filter((x) => x.timing.endsWith('!')).length;
    const drift = raw > 1.1 ? 'slower' : raw < 0.9 ? 'faster' : null;
    const tempoOk = raw >= 0.86 && raw <= 1.14;

    // indulgence selon la longueur
    const okWrong = n >= 20 ? Math.floor(n / 20) : 0;
    const okMissed = (mic && n >= 8 ? 1 : 0) + (n >= 20 ? Math.floor(n / 20) : 0);
    const okFar = (n >= 10 ? 1 : 0) + (n >= 24 ? Math.floor((n - 10) / 12) : 0);
    const okExtra = 1 + Math.floor(n / 8);
    const pitchOk = wrong <= okWrong && missed <= okMissed;
    const rhythmOk = tempoOk && farOff <= okFar && inPlace >= Math.ceil(0.6 * right.length);
    return {
      notes, extra: A.extra, dup, off, k, slope: raw, entry: off / beat, drift,
      right: right.length, wrong, missed, inPlace, farOff, total: n,
      pitchOk, rhythmOk, pass: pitchOk && rhythmOk && A.extra.length <= okExtra,
      perfect: right.length === n && inPlace === n && !A.extra.length,
      played: got.length,
    };
  }

  /* Phrase courte pour l'enfant */
  function verdict(r, ordinal) {
    if (!r.played) return { text: 'Je n’ai rien entendu… Recommence après le décompte.', mood: 'down' };
    if (r.pass) return r.perfect ? { text: 'Parfait : juste et en rythme !', mood: 'ok' } : { text: 'Bravo, c’est réussi !', mood: 'ok' };
    if (!r.pitchOk) {
      if (r.missed === r.total) return { text: 'Je n’ai pas reconnu la phrase. Écoute l’exemple.', mood: 'down' };
      if (!r.wrong) return { text: r.missed === 1 ? 'Presque ! Il manque une note.' : `Il manque ${r.missed} notes.`, mood: 'down' };
      if (!r.missed) return { text: r.wrong === 1 ? 'Presque ! Une note n’est pas la bonne.' : `${r.wrong} notes ne sont pas les bonnes.`, mood: 'down' };
      return { text: `${r.wrong + r.missed} notes ne sont pas les bonnes.`, mood: 'down' };
    }
    if (r.drift === 'faster') return { text: 'Les notes sont justes, mais tu as accéléré.', mood: 'up' };
    if (r.drift === 'slower') return { text: 'Les notes sont justes, mais tu as ralenti.', mood: 'up' };
    const worst = r.notes.filter((x) => x.kind === 'right' && x.timing !== 'ok').sort((a, b) => Math.abs(b.dev) - Math.abs(a.dev))[0];
    if (worst) {
      const where = ordinal ? ordinal(worst.i) : `La ${worst.i ? worst.i + 1 + 'e' : '1re'} note`;
      return { text: `Notes justes ! ${where} arrive ${worst.dev < 0 ? 'trop tôt' : 'trop tard'}.`, mood: 'up' };
    }

  /* ------------------------------------------------------------------
     Mise à jour selon la progression (p de 0 à 1, phrases trouvées…)
  ------------------------------------------------------------------- */
  const MOUSE_X = [250, 420, 560, 720, 340, 640, 480];
  const WOLF_SAYS = ['Je mets ma culotte !', 'Je mets ma chemise !', 'Je mets mon chapeau !', 'Je mets mes bottes !', 'J’arrive !'];

  function update(stage, st) {
    stage.style.setProperty('--p', st.p.toFixed(3));
    stage.style.setProperty('--ph', st.phrasesDone);
    stage.classList.toggle('is-done', st.done);
    const svg = stage.querySelector('svg');
    if (!svg) return;
    // formes envolées restantes
    const fl = svg.querySelectorAll('.fl');
    const remain = Math.round(fl.length * (1 - st.p));
    fl.forEach((g, i) => g.classList.toggle('gone', i >= remain));
    stage.dataset.half = st.p >= 0.5 ? '1' : '0';
    if (st.world === 'lune') {
      svg.querySelectorAll('.lu-star').forEach((s, i) => s.classList.toggle('on', i < st.found));
    }
    if (st.world === 'provence') {
      svg.querySelectorAll('.pv-dancer').forEach((d, i) => d.classList.toggle('on', i < st.phrasesDone));
    }
    if (st.world === 'foret') {
      const stageN = st.done ? 4 : Math.min(3, st.phrasesDone);
      stage.dataset.wolf = st.done ? 'out' : String(stageN);
      const say = svg.querySelector('.fo-say');
      if (say) say.textContent = WOLF_SAYS[st.done ? 4 : stageN];
      fitBubbles(svg);
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => fitBubbles(svg));
    }
    if (st.world === 'prairie' && !stage.style.getPropertyValue('--mx')) {
      stage.style.setProperty('--mx', MOUSE_X[st.found % MOUSE_X.length] + 'px');
    }
    if (st.world === 'automne' && !stage.dataset.hole) placeFerret(stage, st.found % 5, false);
    const w = W[st.world];
    if (w && w.update) w.update(stage, st, svg);
  }

  function fitBubbles(svg) {
    svg.querySelectorAll('.bub-t').forEach((t) => {
      const bg = t.parentNode.querySelector('.bub-bg');
      try {
        const w = t.getComputedTextLength();
        if (!w) return;
        const cx = +t.getAttribute('x');
        bg.setAttribute('x', (cx - w / 2 - 30).toFixed(0));
        bg.setAttribute('width', (w + 60).toFixed(0));
      } catch (e) { /* texte pas encore rendu */ }
    });
  }

  function placeFerret(stage, k, pop) {
    const [x, y] = W.automne.holes[k];
    stage.dataset.hole = k;
    stage.style.setProperty('--hx', x + 'px');
    stage.style.setProperty('--hy', y + 'px');
    if (pop) restartClass(stage, 'fu-pop');
  }

  function restartClass(el, cls) {
    el.classList.remove(cls);
    void el.getBoundingClientRect();
    el.classList.add(cls);
  }

  let doneTimer = null;
  function react(stage, kind, st) {
    const w = W[st.world];
    if (w && w.react) w.react(stage, kind, st, stage.querySelector('svg'));
    if (kind === 'correct' || kind === 'phrase') {
      restartClass(stage, 'react');
      if (st.world === 'prairie') {
        stage.style.setProperty('--mx', MOUSE_X[st.found % MOUSE_X.length] + 'px');
        restartClass(stage, 'pr-hop');
      }
      if (st.world === 'automne') {
        let k = Math.floor(Math.random() * 5);
        if (String(k) === stage.dataset.hole) k = (k + 2) % 5;
        placeFerret(stage, k, true);
      }
    }
    if (kind === 'phrase') restartClass(stage, 'react-big');
    if (kind === 'complete') {
      restartClass(stage, 'react-big');
      if (st.world === 'automne') {
        clearInterval(doneTimer);
        let i = 0;
        doneTimer = setInterval(() => {
          placeFerret(stage, i % 5, true);
          if (++i > 10) { clearInterval(doneTimer); placeFerret(stage, 2, true); }
        }, 420);
      }
    }
  }

/* ------------------------------------------------------------------
   Les Notes Envolées — suivi des parties, pour le professeur

   Le jeu envoie au Worker du professeur (suivi/worker.js) le déroulé des
   parties : comptine, niveau, instrument choisi, xylophone ou micro,
   étoiles, erreurs, durée. Pas de compte : chaque navigateur reçoit un
   identifiant tiré au hasard, gardé sur l'appareil ; le Worker y ajoute
   l'adresse IP de la connexion. Le son du micro n'est jamais envoyé.
   Tant que SUIVI_URL est vide, rien ne part.
------------------------------------------------------------------- */
const Suivi = (() => {
  // adresse du Worker Cloudflare, sans « / » à la fin (vide : suivi coupé)
  // (la version de qualification passe window.NE_SUIVI_URL = '' : ses essais ne partent pas dans le suivi)
  const W = typeof window !== 'undefined' ? window : {};
  const SUIVI_URL = W.NE_SUIVI_URL != null ? W.NE_SUIVI_URL : 'https://notes-envolees-suivi.romain-gaudet.workers.dev';
  const NS = W.NE_NS || ''; // préfixe des clés du stockage local (qualification : 'qualif-')
  const ID_KEY = NS + 'notes-envolees-id';       // identifiant de ce navigateur
  const OFF_KEY = NS + 'notes-envolees-suivi-off'; // '1' : appareil du professeur, à ne pas suivre

  const get = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const put = (k, v) => { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { /* stockage indisponible */ } };

  let memo = null;
  function id() {
    const v = get(ID_KEY);
    if (v && /^[a-z0-9]{6,32}$/.test(v)) return v;
    if (!memo) {
      const abc = 'abcdefghijkmnpqrstuvwxyz23456789', a = new Uint8Array(12);
      crypto.getRandomValues(a);
      memo = Array.from(a, (x) => abc[x % abc.length]).join('');
    }
    put(ID_KEY, memo);
    return memo;
  }

  // temps passé page visible (ms) : la durée d'une partie ne compte pas l'onglet caché
  let shown = 0, since = document.hidden ? null : performance.now();
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { if (since != null) { shown += performance.now() - since; since = null; } }
    else if (since == null) since = performance.now();
  });
  const clock = () => shown + (since != null ? performance.now() - since : 0);

  const excluded = () => get(OFF_KEY) === '1';
  const active = () => !!SUIVI_URL && !excluded();

  function send(type, data) {
    if (!active()) return;
    const body = JSON.stringify(Object.assign({ e: id(), y: type, v: 1 }, data));
    const url = SUIVI_URL + '/e';
    try { if (navigator.sendBeacon && navigator.sendBeacon(url, body)) return; } catch (e) { /* on essaie autrement */ }
    try { fetch(url, { method: 'POST', body, keepalive: true, mode: 'no-cors' }).catch(() => {}); } catch (e) { /* tant pis */ }
  }

  function device() {
    const coarse = window.matchMedia && matchMedia('(pointer: coarse)').matches;
    const small = Math.min(screen.width || 0, screen.height || 0) < 600;
    return coarse ? (small ? 'telephone' : 'tablette') : 'ordinateur';
  }

  return {
    url: SUIVI_URL,
    configured: !!SUIVI_URL,
    active, send, clock, device,
    id: () => get(ID_KEY),
    excluded,
    exclude: (on) => put(OFF_KEY, on ? '1' : null),
  };
})();

    flag: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 21.5V3" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M6.8 3.6h12l-3.2 4.4 3.2 4.4h-12z" fill="currentColor"/></svg>',
    // les petits ronds du repos : une phrase (une rangée de perles), toute la comptine (deux rangées)
    phrase: '<svg viewBox="0 0 24 24" aria-hidden="true"><g fill="currentColor"><circle cx="3.6" cy="15" r="2.9"/><circle cx="9.2" cy="10" r="2.9"/><circle cx="14.8" cy="12.6" r="2.9"/><circle cx="20.4" cy="7.8" r="2.9"/></g></svg>',
    song: '<svg viewBox="0 0 24 24" aria-hidden="true"><g fill="currentColor"><circle cx="3.6" cy="8" r="2.4"/><circle cx="9.2" cy="4.2" r="2.4"/><circle cx="14.8" cy="6.2" r="2.4"/><circle cx="20.4" cy="2.9" r="2.4"/><circle cx="3.6" cy="20.6" r="2.4"/><circle cx="9.2" cy="16.8" r="2.4"/><circle cx="14.8" cy="18.8" r="2.4"/><circle cx="20.4" cy="15.5" r="2.4"/></g></svg>',
  };
  const star = (on, size = 24) => `<svg viewBox="0 0 24 24" width="${size}" height="${size}" aria-hidden="true"><path d="M12 2.6l2.9 5.9 6.5.95-4.7 4.6 1.1 6.45L12 17.45 6.2 20.5l1.1-6.45-4.7-4.6 6.5-.95z" fill="${on ? '#F5C32C' : 'none'}" stroke="${on ? '#C8901A' : 'currentColor'}" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
  const chip = (letter, name) => `<span class="nchip" data-l="${letter}">${name}</span>`;
  /* La jauge du grand rond, pendant le jeu : un arc au-dessus de la note entendue (bas à gauche, juste en haut, en
     vert, haut à droite) ; le point tourne avec l'écart à la note (±50 cents → ±60°, la zone verte : ±15 cents). */
  const GAUGE = '<svg class="pu-gauge" viewBox="0 0 156 156" aria-hidden="true"><path class="g-trk" d="M17.38 43A70 70 0 0 1 138.62 43"/><path class="g-ok" d="M56.37 11.43A70 70 0 0 1 99.63 11.43"/><g class="needle off" id="needle"><circle cx="78" cy="8" r="6"/></g></svg>';

  /* ---------------- réglages et étoiles (sur cet appareil) ---------------- */
  // préfixe NE_NS : la version de qualification garde ses réglages et ses étoiles à part
  const SET_KEY = (window.NE_NS || '') + 'notes-envolees-reglages', REC_KEY = (window.NE_NS || '') + 'notes-envolees-etoiles';
  function load(k, dflt) { try { const v = JSON.parse(localStorage.getItem(k) || 'null'); return v && typeof v === 'object' ? Object.assign(dflt, v) : dflt; } catch (e) { return dflt; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* stockage indisponible */ } }
  // mode : toujours 'mic' (on joue sur un vrai instrument, la page écoute au micro ; plus de xylophone à l'écran)
  // prenom : facultatif (accueil) ; choisi : l'élève a choisi lui-même son instrument (sinon la page le lui demande)
  const settings = load(SET_KEY, { mode: 'mic', inst: 'none', level: 1, play: 'phrases', prenom: '', choisi: false });
  if (OLD_INST[settings.inst]) settings.inst = OLD_INST[settings.inst];
  if (!INSTS[settings.inst]) settings.inst = 'none';
  settings.mode = 'mic';
  settings.level = settings.level === 2 ? 2 : 1;
  const cleanName = (s) => String(s || '').replace(/[^\p{L}\p{M}' \-’]/gu, '').replace(/\s+/g, ' ').trim().slice(0, 30);
  settings.prenom = cleanName(settings.prenom);
  // réglages d'avant le prénom : un instrument déjà choisi (autre que « autre instrument en do ») compte comme choisi
  settings.choisi = !!settings.choisi || settings.inst !== 'none';
  /* jeu : le mode de jeu, choisi à la première visite (absent : pas encore choisi, la page le demande une fois) ;
     affiche : en Défi, l'élève accepte que son record paraisse sur l'accueil, pour tout le monde (avec son prénom) */
  const JEUX = ['aventure', 'decouverte', 'defi'];
  if (settings.jeu != null && !JEUX.includes(settings.jeu)) settings.jeu = 'aventure';
  settings.affiche = !!settings.affiche;
  const jeu = () => settings.jeu || 'aventure';
  const records = load(REC_KEY, {});

  /* ---------------- les modes de jeu ----------------
     Aventure (par défaut) : les comptines s'ouvrent une à une, au fil du chemin ; une comptine terminée (une étoile au
     moins, à l'un des niveaux) ouvre la suivante. Découverte : tout est ouvert. Défi : une course, les 20 comptines
     dans l'ordre, chacune au niveau 2, d'un coup, en rythme et sans erreur ; une erreur (ou un abandon après avoir
     joué) renvoie au départ, la comptine 1. Le record (comptines d'affilée depuis le départ) peut paraître sur
     l'accueil, au tableau d'honneur, si l'élève le veut. */
  const JEU = {
    aventure: { name: 'Aventure', d: 'Les comptines s’ouvrent une à une : termine-en une pour ouvrir la suivante.', s: 'Les comptines s’ouvrent une à une : termine-en une pour ouvrir la suivante.' },
    decouverte: { name: 'Découverte', d: 'Toutes les comptines sont ouvertes : joue celles que tu veux.', s: 'Toutes les comptines sont ouvertes : joue celles que tu veux.' },
    defi: { name: 'Défi', d: 'Les 20 comptines dans l’ordre, en rythme, d’un coup et sans erreur. Une erreur : retour au départ ! Ton record peut paraître sur l’accueil.', s: 'Les 20 comptines dans l’ordre, au niveau 2, sans erreur. Une erreur : retour au départ !' },
  };
  const bestOf = (id) => Math.max(+records[id] || 0, +records[id + '@2'] || 0);

  /* Le Défi, sur cet appareil : pos, les comptines réussies d'affilée dans la course en cours (la comptine à jouer
     est LIB[pos] ; 20 : Défi terminé) ; best, le record ; departs, les courses commencées ; bestDeparts, au départ
     n° combien le record a été fait (à record égal, le moins de départs passe devant) ; last, la dernière nouvelle,
     pour l'accueil. (La première version, une réussite par comptine dans n'importe quel ordre, est oubliée.) */
  const DEFI_KEY = (window.NE_NS || '') + 'notes-envolees-defi';
  const DEFI0 = { v: 2, pos: 0, best: 0, departs: 1, bestDeparts: 0, last: null };
  const defi = (() => {
    try { const v = JSON.parse(localStorage.getItem(DEFI_KEY) || 'null'); if (v && v.v === 2) return Object.assign({}, DEFI0, v); } catch (e) { /* rien de gardé */ }
    return Object.assign({}, DEFI0);
  })();
  const defiSong = () => LIB[defi.pos] || null; // l'étape du moment (null : Défi terminé)

  function isOpen(song, j = jeu()) {
    if (j === 'defi') return song === defiSong(); // en Défi, seulement l'étape du moment
    if (j !== 'aventure') return true;
    const i = LIB.indexOf(song);
    return i <= 0 || bestOf(song.id) > 0 || bestOf(LIB[i - 1].id) > 0;
  }
  // en Aventure, la prochaine comptine à jouer : la première ouverte et pas encore terminée
  const nextToPlay = () => (jeu() === 'aventure' ? LIB.find((s) => isOpen(s) && !bestOf(s.id)) || null : null);
  // le nom au tableau d'honneur : le prénom ; s'il y a un deuxième mot, seulement son initiale (« Léa M. »)
  const publicName = () => { const w = settings.prenom.split(' ').filter(Boolean); return w.length > 1 ? `${w[0]} ${w[1][0].toUpperCase()}.` : w[0] || ''; };
  // l'état d'une comptine sur le chemin de l'accueil (Aventure, Découverte) : ouverte ou fermée, la prochaine à jouer
  function songState(s, NX = nextToPlay()) {
    const open = isOpen(s), i = LIB.indexOf(s);
    return { open, next: s === NX, lockedBy: open ? null : LIB[i - 1] || null };
  }
  const inst = () => {
    const i = INSTS[settings.inst], f = FAMS[i.fam];
    return Object.assign({}, i, { off: f.off, short: f.short, key: f.key, how: f.how });
  };
  const instOptions = () => Object.entries(INSTS).map(([k, v]) => `<option value="${k}"${settings.inst === k ? ' selected' : ''}>${v.name}</option>`).join('');
  // le timbre qui joue la musique de la page : celui de l'instrument choisi, sinon celui de la comptine
  const voiceNow = () => inst().voice || (G && G.song.voice);
  function instrLine(song) {
    const i = inst();
    if (i.sing) return `En do majeur, jouée ${song.instrument} : chante-la en disant le nom des notes.`;
    if (!i.voice) return `En do majeur, jouée ${song.instrument}.`;
    if (i.fam !== 'C') return `En do majeur (pour ${i.the}, elle sonne en ${i.key}), jouée ${i.at}.`;
    return `En do majeur, jouée ${i.at}${i.play === -12 ? ', une octave plus bas' : i.play === 12 ? ', une octave plus haut' : ''}.`;
  }
  function setInst(k) {
    if (!INSTS[k]) return;
    settings.inst = k;
    save(SET_KEY, settings);
    Sound.setTranspose(inst().play);
    Sound.useSamples(inst().voice);
    app.querySelectorAll('select.inst-sel').forEach((sel) => { sel.value = k; });
    const ipn = app.querySelector('#ip-name');
    if (ipn) ipn.textContent = instShort();
    if (G && view === 'song') {
      if (prepping()) cancelAttempt();
      expectNext();
      if (el.instr) el.instr.textContent = instrLine(G.song);
      if (G.cal && !singing()) calStop();
    }
    applyVoice();
  }
  function setLevel(v) {
    settings.level = v === 2 ? 2 : 1;
    save(SET_KEY, settings);
    if (G && view === 'song') { stopAll(); renderSong(G.song); }
  }

  /* ---------------- l'élève : son prénom, son instrument, son mode de jeu ----------------
     Première visite (sur l'accueil, ou dans une comptine ouverte directement par un lien) : trois écrans, en plein
     écran sur téléphone. « Comment t'appelles-tu ? » (facultatif), puis « Quel est ton instrument ? » : un dessin par
     instrument, on le touche, c'est choisi ; enfin « Comment veux-tu jouer ? » : Aventure, Découverte ou Défi.
     Ensuite, une ligne le rappelle en haut de l'accueil (« Bonjour, Léa ! », son instrument, son mode de jeu) ; son
     bouton « Changer », comme dans une comptine le bouton à son nom, ouvre les réglages : le prénom, le mode de jeu et
     l'instrument s'y changent directement, sans repasser par les trois écrans. Quand le suivi est branché, le prénom
     part avec les résultats (voir les mentions légales). */
  const INST_LIST = ['flute', 'clarinette', 'saxalto', 'trompette', 'trombone', 'cor', 'violon', 'alto', 'violoncelle', 'guitare', 'guitareelec', 'piano', 'xylophone', 'voix', 'none'];
  // nom court (bouton d'une comptine, rappel de l'accueil) ; sur les cartes à dessin, une précision si besoin
  const INST_TILE = { flute: 'Flûte', clarinette: 'Clarinette', saxalto: 'Saxophone', trompette: 'Trompette', trombone: 'Trombone', cor: 'Cor', violon: 'Violon', alto: 'Alto', violoncelle: 'Violoncelle', guitare: 'Guitare', guitareelec: 'Guitare élec.', piano: 'Piano', xylophone: 'Xylophone', voix: 'Voix', none: 'Autre' };
  const INST_CARD = { saxalto: ['Saxophone', 'alto'], guitare: ['Guitare', 'classique'], guitareelec: ['Guitare', 'électrique'], voix: ['Je chante', 'avec ma voix'], none: ['Autre', 'instrument'] };
  const instShort = (k = settings.inst) => INST_TILE[k] || INST_TILE.none;
  const instPic = (k = settings.inst) => (typeof INST_ICON !== 'undefined' && (INST_ICON[k] || INST_ICON.none)) || ICON.note;
  // les cartes à dessin (l'instrument déjà choisi est marqué)
  const instCards = () => INST_LIST.map((k) => {
    const [t, sub] = INST_CARD[k] || [INST_TILE[k], ''];
    return `<button class="ic-card" type="button" data-k="${k}" aria-pressed="${settings.choisi && settings.inst === k}"><span class="ic-pic">${instPic(k)}</span><b>${t}</b>${sub ? `<small>${sub}</small>` : ''}</button>`;
  }).join('');
  const helloHtml = () => (settings.prenom ? `Bonjour, <b>${esc(settings.prenom)}</b>${NB}!` : `Bonjour${NB}!`);
  // le rappel, en haut de l'accueil des deux versions : prénom, instrument, mode de jeu (en Défi, l'étape et le record)
  const jeuHtml = () => `<span class="ec-jeu">${ICON[jeu()]}${JEU[jeu()].name}</span>`;
  function defiLine() {
    if (jeu() !== 'defi') return '';
    const where = defiSong() ? `étape ${defi.pos + 1} sur ${LIB.length}` : 'Défi terminé';
    return `${where} · record${NB}: ${defi.best || 'pas encore'}${settings.affiche && canBoard() ? ' · au tableau d’honneur' : ''}`;
  }
  function eleveHtml() {
    const dl = defiLine();
    return `<section class="eleve-card" aria-label="Toi, ton instrument et ton mode de jeu">
      <div class="ec-sum">
        <span class="ec-pic">${instPic()}</span>
        <div class="ec-txt">
          <p class="ec-hello">${helloHtml()}</p>
          <p class="ec-row"><span class="ec-inst">${esc(instShort())}</span>${jeuHtml()}<button class="ec-edit" type="button">Changer</button></p>
          <p class="ec-defi"${dl ? '' : ' hidden'}>${esc(dl)}</p>
        </div>
      </div>
    </section>`;
  }
  function eleveRefresh(card) {
    if (!card || !document.contains(card)) return;
    card.querySelector('.ec-pic').innerHTML = instPic();
    card.querySelector('.ec-hello').innerHTML = helloHtml();
    card.querySelector('.ec-inst').textContent = instShort();
    card.querySelector('.ec-jeu').outerHTML = jeuHtml();
    const dl = defiLine(), p = card.querySelector('.ec-defi');
    p.textContent = dl;
    p.hidden = !dl;
  }
  // « Changer » : les réglages, où le prénom, le mode de jeu et l'instrument se changent directement
  function bindEleve(card) {
    if (!card) return;
    card.querySelector('.ec-edit').addEventListener('click', () => reglages({ card }));
  }
  // pourquoi le prénom (première visite et réglages)
  const nameWhy = () => (Suivi.configured ? 'Ce n’est pas obligatoire. Ton professeur le verra avec tes résultats.' : 'Ce n’est pas obligatoire. Il reste sur cet appareil.');
  /* La première visite : à l'accueil comme dans une comptine ouverte directement, tant que l'instrument n'est pas
     choisi : le prénom, l'instrument, puis le mode de jeu. Un élève inscrit avant les modes de jeu les découvre une
     fois (avec la question du prénom, s'il ne l'a pas encore donné). */
  function welcome(onDone) {
    if (!settings.choisi) onboard({ onDone });
    else if (!settings.jeu) onboard({ onDone, steps: settings.prenom ? [3] : [1, 3], nouveau: true });
  }
  // les cartes des modes de jeu (première visite) : un dessin, le nom, ce qui le distingue
  const jeuCards = (cur) => JEUX.map((k) => `<button class="jeu-card" type="button" role="radio" data-jeu="${k}" aria-checked="${k === cur}"><span class="jeu-ic">${ICON[k]}</span><b>${JEU[k].name}${k === 'aventure' ? '<small>par défaut</small>' : ''}</b><span class="jeu-d">${JEU[k].d}</span></button>`).join('');
  // l'accord pour le tableau d'honneur du Défi : il faut un prénom, et que cet appareil envoie le suivi
  const sendsHere = () => Suivi.configured && !Suivi.excluded();
  const canBoard = () => !!publicName() && sendsHere();
  const defiOkHtml = (cls) => `<label class="${cls}" hidden><input type="checkbox" class="defi-ok"${settings.affiche ? ' checked' : ''}><span class="defi-ok-t"></span></label>`;
  // short : les textes courts des réglages (deux lignes au plus)
  function defiOkUI(label, on, short) {
    if (!label) return;
    const box = label.querySelector('input'), can = canBoard();
    label.hidden = !on;
    box.disabled = !can;
    if (!can) box.checked = false;
    label.classList.toggle('is-off', !can);
    label.querySelector('.defi-ok-t').textContent = can && short ? `Afficher mon record sur l’accueil, pour tout le monde, avec «${NB}${publicName()}${NB}»`
      : !can && short ? (!sendsHere() ? `Rien ne part de cet appareil${NB}: pas de tableau d’honneur.` : 'Pour le tableau d’honneur de l’accueil, écris ton prénom.')
      : can ? `Afficher mon record sur l’accueil, au tableau d’honneur, pour tout le monde (avec mon prénom${NB}: ${publicName()})`
      : !sendsHere() ? `Ici, rien ne part de cet appareil${Suivi.configured ? ' (le suivi y est coupé)' : ''}${NB}: pas de tableau d’honneur.`
        : 'Pour paraître au tableau d’honneur de l’accueil, il faut écrire ton prénom.';
  }
  // un autre mode de jeu (ou l'accord pour le tableau d'honneur) : la page en tient compte tout de suite
  function setJeu(k, affiche) {
    const was = settings.jeu, wasAff = settings.affiche;
    settings.jeu = JEUX.includes(k) ? k : 'aventure';
    settings.affiche = !!affiche && canBoard();
    save(SET_KEY, settings);
    if (settings.affiche !== wasAff || (settings.jeu === 'defi' && was !== 'defi' && defiStarted())) defiSend();
    return was !== settings.jeu;
  }
  // steps : les écrans montrés (1 le prénom, 2 l'instrument, 3 le mode de jeu) ; nouveau : un élève déjà inscrit
  function onboard({ onDone, steps = [1, 2, 3], nouveau = false } = {}) {
    if (app.querySelector('.onb')) return;
    const why = nameWhy();
    const jeu0 = settings.jeu, name0 = publicName();
    let pick = jeu();
    const wrap = document.createElement('div');
    wrap.className = 'onb';
    wrap.setAttribute('role', 'dialog');
    wrap.setAttribute('aria-modal', 'true');
    wrap.innerHTML = `<div class="onb-in">
      <div class="onb-top"><span class="onb-brand">Les Notes Envolées</span><span class="onb-dots" aria-hidden="true">${steps.map(() => '<i></i>').join('')}</span></div>
      <form class="onb-step onb-s1" hidden novalidate>
        <h2 class="onb-t" id="onb-t1" tabindex="-1">Bonjour${NB}!<span>Comment t’appelles-tu${NB}?</span></h2>
        <input class="onb-name" name="prenom" type="text" maxlength="30" autocomplete="given-name" autocapitalize="words" spellcheck="false" enterkeyhint="next" placeholder="Ton prénom" aria-label="Ton prénom" value="${esc(settings.prenom)}">
        <p class="onb-why">${why}</p>
        <button class="btn-big onb-next" type="submit"><span>Suivant</span>${ICON.next}</button>
      </form>
      <section class="onb-step onb-s2" hidden aria-labelledby="onb-t2">
        <h2 class="onb-t" id="onb-t2" tabindex="-1"></h2>
        <p class="onb-sub">Touche son dessin.</p>
        <div class="ic-grid">${instCards()}</div>
        <button class="onb-back" type="button" data-back="2">${ICON.back}<span>Mon prénom</span></button>
      </section>
      <section class="onb-step onb-s3" hidden aria-labelledby="onb-t3">
        <h2 class="onb-t" id="onb-t3" tabindex="-1"></h2>
        <p class="onb-sub">${nouveau ? 'Nouveau : trois façons de jouer. Tu pourras changer quand tu veux, dans les réglages.' : 'Tu pourras changer quand tu veux, dans les réglages.'}</p>
        <div class="jeu-grid" role="radiogroup" aria-labelledby="onb-t3">${jeuCards(pick)}</div>
        ${defiOkHtml('onb-defi')}
        <button class="btn-big onb-go" type="button"><span>C’est parti${NB}!</span>${ICON.next}</button>
        <button class="onb-back" type="button" data-back="3">${ICON.back}<span></span></button>
      </section>
    </div>`;
    // la page derrière ne réagit plus, et ne défile plus
    const behind = [...app.children];
    behind.forEach((c) => { c.inert = true; });
    app.appendChild(wrap);
